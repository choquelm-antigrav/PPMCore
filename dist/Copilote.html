<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.12.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Charte : inspirée d'airbus.com. Police Inter (police numérique officielle d'Airbus), bleu de marque #00205B,
     tout en bleus : aucune teinte grise. Rouge, ambre et vert sont réservés aux états (alerte, critique, terminé). */
  :root {
    --brand: #00205B;
    --brand-2: #00377A;
    --accent: #0085CA;
    --accent-2: #5FB4E5;
    --paper: #F4F6F9;
    --surface: #FFFFFF;
    --tint: #E8F2FB;
    --hover: #DCEAF7;
    --ink: #1A1D29;
    --muted: #5A6473;
    --faint: #8A94A6;
    --rule: #E2E7EE;
    --line-strong: #C9D3E0;
    --bar: #3B9AD6;
    --bar-hover: #0085CA;
    --bar-done: #00377A;
    --summary: #00205B;
    --summary-progress: #00377A;
    --bar-external: #BFD8EE;
    --bar-external-progress: #8FBFE3;
    --ghost: #00377A;
    --amber: #E8820C;
    --amber-dark: #C05600;
    --red: #D0342C;
    --green: #1E8A56;
    --cyan: #5FB4E5;
    --focus: #0085CA;
    --on-accent: #FFFFFF;
    --warn-bg: #FFF1E6; --warn-ink: #C05600;
    --alert-bg: #FDE9E7; --alert-ink: #9B211A;
    --ok-bg: #E2F4EA; --ok-ink: #145C39;
    --shadow: 0 4px 20px rgba(0, 32, 91, .08);
    --radius: 6px;
    --grad-hero: linear-gradient(120deg, #00205B 0%, #00377A 45%, #0085CA 110%);
    --grad-accent: linear-gradient(90deg, #0085CA 0%, #5FB4E5 100%);
    --bar-bg: #00205B;
    color-scheme: light;
  }
  /* Thème nuit : classe .dark posée par la bannière, selon le choix de l'utilisateur ou, à défaut, le réglage de l'ordinateur. */
  :root.dark {
    --paper: #0A1730; --surface: #10213F; --tint: #152B52; --hover: #1B3563;
    --ink: #E8F0FD; --muted: #9DB3D6; --faint: #6F86AE; --rule: #1E3560; --line-strong: #4A6AA3;
    --bar: #4AA8E0; --bar-hover: #6BBBEA; --bar-done: #9CCDF0; --summary: #2A5CA8; --summary-progress: #4C84D0;
    --bar-external: #27467A; --bar-external-progress: #355C99; --ghost: #9CCDF0;
    --accent: #4DB2EC; --accent-2: #5FB4E5; --brand-2: #8CC4F0;
    --warn-bg: #3A2A07; --warn-ink: #F5CE7A; --alert-bg: #3D1412; --alert-ink: #F7A59F; --ok-bg: #0D3322; --ok-ink: #8FE0B6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
    --bar-bg: #06101F;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 Inter, "Segoe UI", Roboto, Arial, sans-serif; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased; }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--accent); }

  /* ---- bannière commune ---- */
  .ppm-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px 28px; height: 52px;
    padding: 0 24px; background: var(--bar-bg); color: #fff; border-bottom: 3px solid transparent; border-image: var(--grad-accent) 1; }
  .ppm-brand { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .ppm-brand img { height: 22px; width: auto; display: block; }
  .ppm-name { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .ppm-brand img:not([hidden]) + .ppm-name { padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .35); font-weight: 600; }
  .ppm-nav { display: flex; align-self: stretch; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .ppm-nav a { display: inline-flex; align-items: center; padding: 0 12px; color: rgba(255, 255, 255, .78); text-decoration: none;
    font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
  .ppm-nav a:hover { color: #fff; }
  .ppm-nav a[aria-current="page"] { color: #fff; border-bottom-color: var(--accent-2); }
  .ppm-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; }
  .ppm-icon:hover { background: rgba(255, 255, 255, .12); }
  .ppm-icon svg { width: 20px; height: 20px; }
  a.ppm-icon { text-decoration: none; }
  .ppm-icon[aria-current="page"] { background: rgba(255, 255, 255, .18); }

  /* ---- en-tête de page ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 24px 12px; background: var(--paper); }
  .title { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .title h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .title .context { margin: 0; color: var(--muted); font-size: 14px; }
  .title .context button { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .controls label.field { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
  select { min-width: 240px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { padding: 6px 12px; border: 0; background: transparent; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-accent); }
  :root.dark .seg button[aria-pressed="true"] { background: var(--accent); color: #031126; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
  .btn { padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-accent); }
  .btn.primary:hover { background: var(--brand-2); }
  :root.dark .btn.primary { background: var(--accent); border-color: var(--accent); color: #031126; }
  a.btn { display: inline-block; color: var(--ink); text-decoration: none; }
  a.btn.primary { color: var(--on-accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;
    border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; font-weight: 600; }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---- bandeau d'état : pastilles plutôt que phrases ---- */
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 24px 12px; }
  .status p { margin: 0; }
  .status .alert { color: var(--red); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--tint); color: var(--ink); font-size: 13px; font-weight: 500; }
  .chip.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 18px; height: 10px; border-radius: 3px; background: var(--bar); }
  .swatch.critical { background: var(--amber); } .swatch.alert { background: var(--red); }
  .swatch.done { background: var(--green); } .swatch.milestone { background: var(--cyan); }
  .swatch.summary { background: var(--summary); }

  /* ---- fenêtre d'information (ⓘ, ?) ---- */
  .pop-anchor { position: relative; display: inline-flex; }
  .popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 260px; max-width: min(420px, 86vw);
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 14px; }
  .popover.right { left: auto; right: 0; }
  .popover dl { margin: 0; }
  .popover .legend { flex-direction: column; gap: 6px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr); }
  main.with-details { grid-template-columns: minmax(0, 1fr) 340px; }
  .chart { min-width: 0; padding: 4px 24px 24px; }
  .gantt-host { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 17px; font-weight: 600; }
  .undated { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

  section.issues { margin-top: 20px; }
  section.issues h2, aside h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 14px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
  .table-wrap table { border: 0; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; background: var(--tint); }
  td.num { text-align: right; }

  aside { position: relative; padding: 16px 20px; background: var(--surface); border-left: 1px solid var(--rule); }
  aside[hidden] { display: none; }
  aside .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  aside h2 { padding-right: 28px; }
  aside .kind { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0 0 16px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .flag { display: block; margin: 0 0 12px; padding: 8px 10px; border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; }
  .flag.alert { border-color: var(--red); background: var(--alert-bg); color: var(--alert-ink); }
  form.declare { display: grid; gap: 8px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  form.declare h3 { margin: 0; font-size: 15px; font-weight: 600; }
  input[type=number], input[type=text], textarea { background: var(--surface); }
  form.declare input[type=number] { width: 96px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; }
  form.declare textarea { min-height: 64px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; resize: vertical; }
  form.declare .row { display: flex; align-items: center; gap: 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  dialog { max-width: 460px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 24px; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0, 32, 91, .35); }
  dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  dialog p { margin: 0 0 10px; }
  dialog .warn { color: var(--red); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 40;
    padding: 10px 16px; border-radius: 6px; background: var(--brand); color: #fff; box-shadow: var(--shadow); }
  :root.dark .toast { background: var(--accent); color: #031126; }
  .toast.error { background: var(--red); color: #fff; }
  .toast[hidden] { display: none; }
  .busy { cursor: progress; }
  .loading { padding: 48px 24px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .ppm-bar { padding: 0 8px 0 12px; gap: 8px; }
    .ppm-nav a { padding: 0 8px; }
    header, .status, .chart { padding-left: 12px; padding-right: 12px; }
    main.with-details { grid-template-columns: minmax(0, 1fr); }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
    select { min-width: 0; width: 100%; }
    .controls { width: 100%; }
  }
  /* Petit écran : la bannière passe sur deux lignes (marque et boutons, puis navigation) au lieu de couper le menu. */
  @media (max-width: 640px) {
    .ppm-bar { flex-wrap: wrap; height: auto; padding: 0 8px 0 12px; gap: 0 8px; }
    .ppm-brand { flex: 1; min-height: 44px; }
    .ppm-icon { align-self: center; }
    .ppm-nav { order: 3; flex: 1 0 100%; height: 40px; margin: 0 -8px 0 -12px; padding: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- charte inspirée de la diapositive Airbus : hero dégradé, libellés en capitales espacées, cartes à liseré, pastilles ---- */
  body { background: var(--paper); }
  header { position: relative; overflow: hidden; background: var(--grad-hero); color: #FFFFFF; padding: 20px 24px 18px; }
  header::after { content: ''; position: absolute; right: -8%; top: -60%; width: 45%; height: 260%; background: radial-gradient(circle at center, rgba(255, 255, 255, .13), transparent 60%); transform: skewX(-12deg); pointer-events: none; }
  header > * { position: relative; z-index: 1; }
  header .title { flex-wrap: wrap; row-gap: 2px; }
  header .eyebrow { flex: 0 0 100%; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-2); }
  header .title h1 { color: #FFFFFF; font-size: 28px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; }
  header .title .context, header .context { color: var(--accent-2); }
  header .controls label.field { color: var(--accent-2); }
  header .toggle { color: #FFFFFF; }
  header .icon-btn { color: #FFFFFF; }
  header .icon-btn:hover, header .icon-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
  header select, header .seg, header .btn { color: var(--ink); }
  header .seg button[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
  .popover { color: var(--ink); }
  .eyebrow-dark, body h2.sec { display: block; position: relative; padding-left: 38px; font-size: 12.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }
  .eyebrow-dark::before, body h2.sec::before { content: ''; position: absolute; left: 0; top: 50%; width: 28px; height: 2px; background: var(--accent); }
  .cards .card, .box, .kpi { border-left: 4px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); }
  .cards .card .k { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--brand-2); }
  :root.dark .cards .card .k { color: var(--accent-2); }
  th { font-size: 11.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--brand-2); }
  :root.dark th { color: var(--accent-2); }
  .chip, .badge { font-weight: 700; letter-spacing: .3px; }
  .num-dot { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #FFFFFF; font-weight: 800; font-size: 20px; flex: none; }
  :root.dark .num-dot { background: var(--accent); color: #06101F; }
  .tag-warn { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; background: var(--amber); color: #FFFFFF; padding: 3px 8px; border-radius: 100px; }
  .callout { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 8px 12px; font-weight: 500; }
  .hero-note { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .28); border-radius: 8px; padding: 12px 18px; max-width: 360px; backdrop-filter: blur(4px); }
  .hero-note .k { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-2); margin: 0 0 4px; }
  .hero-note .t { font-size: 15px; font-weight: 300; line-height: 1.4; color: #FFFFFF; margin: 0; }
  .hero-note .t b { font-weight: 700; }
  .btn.primary { background: var(--brand); border-color: var(--brand); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  /* Plus d'onglets : chaque rubrique est une zone de la page, avec son titre */
  .zone { padding: 22px 24px 0; }
  .zone h2.sec { margin: 0; }
  .zone[hidden] { display: none; }
  @media (max-width: 900px) { header { padding: 14px 12px 12px; } header .title h1 { font-size: 22px; } .zone { padding: 16px 12px 0; } }
</style>
<style>
  .panel { padding: 16px 24px 32px; max-width: 1100px; }
  .panel[hidden] { display: none; }
  .intro { margin: 0 0 16px; max-width: 72ch; }
  .note { margin: 8px 0 16px; color: var(--muted); max-width: 72ch; }
  .muted { color: var(--muted); }
  .late { color: var(--red); font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 0 0 16px; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .card .k { margin: 0; color: var(--muted); font-size: 13px; }
  .card .v { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  .card .s { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card.alert .v { color: var(--red); }
  .lines { margin: 0 0 20px; padding: 0; list-style: none; display: grid; gap: 6px; max-width: 80ch; }
  .lines li { padding: 8px 12px; background: var(--surface); border-left: 4px solid var(--rule); border-radius: 2px; }
  .lines li.alert { border-left-color: var(--red); }
  .lines li.warn { border-left-color: var(--amber); }
  h2.sec { font-size: 16px; margin: 22px 0 8px; }
  .ai { margin: 20px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; max-width: 80ch; }
  .ai h3 { margin: 0 0 8px; font-size: 15px; }
  .ai .answer { white-space: pre-wrap; margin: 0 0 10px; line-height: 1.5; }
  .ai textarea { width: 100%; min-height: 160px; font: 12.5px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border: 1px solid var(--rule); border-radius: 4px; }
  .warnbox { margin: 8px 0; padding: 8px 10px; background: var(--warn-bg); border-radius: 4px; color: var(--warn-ink); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12.5px; background: var(--tint); color: var(--ink); white-space: nowrap; }
  .badge.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .mode { margin-left: 8px; }
  .hyp { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin: 0 0 12px; }
  .hyp label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .hyp select { min-width: 260px; max-width: 100%; }
  .hyp input[type=number] { width: 90px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); cursor: pointer; font-size: 13.5px; }
  .chip .x { margin-left: 6px; color: var(--muted); }
  .ask textarea { width: 100%; max-width: 80ch; min-height: 70px; padding: 8px; border: 1px solid var(--rule); border-radius: 4px; font: inherit; }
  .qa { margin: 16px 0 0; display: grid; gap: 12px; max-width: 80ch; }
  .qa .q { font-weight: 600; margin: 0 0 4px; }
  .sugg { display: grid; gap: 10px; max-width: 90ch; }
  .sugg article { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .sugg p { margin: 4px 0; }
  .sugg input[type=text] { flex: 1; min-width: 180px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; }
  @media (max-width: 700px) {
    .panel { padding: 12px; }
    .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    #reload { margin-left: 0 !important; }
    .hyp select { min-width: 0; width: 100%; }
    .hyp label { width: 100%; }
  }
</style>
</head>
<body>
<div class="ppm-bar">
  <a class="ppm-brand" id="ppm-brand" href="#" aria-label="PPM, retour au planning">
    <img id="ppm-logo" alt="" hidden>
    <span class="ppm-name">PPM</span>
  </a>
  <nav class="ppm-nav" aria-label="Pages de l’outil">
    <a id="nav-overview" data-view="overview" href="#">Overview</a>
    <a id="nav-plan" data-view="gantt" href="#">Planning</a>
    <a id="nav-struct" data-view="structure" href="#">OBS/WBS</a>
    <a id="nav-res" data-view="ressources" href="#">Ressources</a>
    <a id="nav-suivi" data-view="suivi" href="#">Suivi</a>
    <a id="nav-news" data-view="actualites" href="#">Actualités</a>
    <a id="nav-copilot" data-view="copilote" href="#">Copilote</a>
    <a id="nav-budget" data-view="budget" href="#" hidden>Budget</a>
  </nav>
  <a class="ppm-icon" id="ppm-account" data-view="compte" href="#" aria-label="Mon compte" title="Mon compte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
  <a class="ppm-icon" id="ppm-admin" data-view="admin" href="#" aria-label="Administration" title="Administration" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  <button type="button" class="ppm-icon" id="ppm-theme" aria-label="Thème nuit" title="Thème nuit"></button>
</div>
<script>
/* Éléments communs à toutes les pages : bannière, thème jour/nuit, données préchargées, fenêtres d'information. */
(function () {
  'use strict';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var root = document.documentElement;

  /** JSON à clés triées : même clé que celle calculée par le serveur (stableJson_). */
  function stable(v) {
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  }
  /** Réponse préparée avec la page, consommée une seule fois ; null si absente (la page fait alors l'appel). */
  window.ppmPreloaded = function (action, params, write) {
    var B = window.BOOT;
    if (write || !B || !B.preload) return null;
    var k = action + '|' + stable(params || {});
    if (!Object.prototype.hasOwnProperty.call(B.preload, k)) return null;
    var res = B.preload[k];
    delete B.preload[k];
    return res && res.ok ? Promise.resolve(res.data) : null;
  };

  /** Fenêtre d'information attachée à un bouton : ouverture, fermeture au clic extérieur et avec Échap. */
  window.ppmPopover = function (btn, pop) {
    var close = function () { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = pop.hidden;
      document.querySelectorAll('.popover').forEach(function (p) { if (p !== pop) p.hidden = true; });
      pop.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
    });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { close(); btn.focus(); } });
  };

  /** Message lisible pour une erreur du serveur : le détail des champs refusés quand il existe. */
  var FIELD_LABELS = { job_function: 'Fonction', organization: 'Organisation', name: 'Nom', email: 'Adresse', country: 'Pays', supplier: 'Fournisseur', capacity_days_month: 'Capacité' };
  window.ppmErrorText = function (err) {
    if (err && Array.isArray(err.details) && err.details.length) {
      return err.details.map(function (d) { return (FIELD_LABELS[d.field] || d.field) + ' : ' + d.issue; }).join(' ; ');
    }
    return (err && err.message) || 'Opération impossible.';
  };

  /** Applique un thème choisi ailleurs (page Mon compte) ; « auto » revient au réglage de l'ordinateur. */
  window.ppmSetTheme = function (mode) {
    if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
    applyClass();
    var b = document.getElementById('ppm-theme');
    if (b) paint(b);
    document.dispatchEvent(new CustomEvent('ppm-theme', { detail: mode }));
  };

  function applyClass() { root.classList.toggle('dark', effective() === 'dark'); }
  function effective() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paint(btn) {
    var dark = effective() === 'dark';
    btn.innerHTML = dark ? SUN : MOON;
    btn.title = dark ? 'Thème jour' : 'Thème nuit';
    btn.setAttribute('aria-label', btn.title);
  }

  (function early() {
    var t = root.getAttribute('data-theme');
    if (t !== 'dark' && t !== 'light') root.removeAttribute('data-theme');
    applyClass();
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () { if (!root.getAttribute('data-theme')) { applyClass(); var b = document.getElementById('ppm-theme'); if (b) paint(b); } };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
  })();

  function init() {
    var B = window.BOOT || {};
    var base = B.baseUrl || '';
    var btn = document.getElementById('ppm-theme');
    paint(btn);
    btn.addEventListener('click', function () {
      var next = effective() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      applyClass();
      paint(btn);
      document.dispatchEvent(new CustomEvent('ppm-theme', { detail: next }));
      try { google.script.run.withFailureHandler(function () {}).uiCall('ui.set', { theme: next }, null); } catch (e) { /* hors web app */ }
    });
    // Adresses par défaut (les pages qui ont un projet courant les complètent) ; l'administration n'est proposée qu'aux administrateurs.
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (a) {
      if (!a.getAttribute('href') || a.getAttribute('href') === '#') a.setAttribute('href', base + '?view=' + a.getAttribute('data-view'));
    });
    document.getElementById('ppm-admin').hidden = !B.isAdmin;
    document.getElementById('nav-budget').hidden = !B.canBudget;
    document.getElementById('nav-copilot').hidden = !B.copilot; // copilote en suspens tant que PPM_COPILOT n'est pas « oui »
    var EYEBROW = { overview: 'Overview · Projet', gantt: 'Planning · Gantt', structure: 'OBS/WBS · Organisation et découpage', ressources: 'Ressources · Équipes et rôles', suivi: 'Suivi · Baselines', actualites: 'Actualités · Réunions et actions', copilote: 'Copilote · Analyse', budget: 'Budget · CPN et achats', compte: 'Mon compte', admin: 'Administration' };
    var titleBox = document.querySelector('header .title');
    if (titleBox && EYEBROW[B.view] && !titleBox.querySelector('.eyebrow')) {
      var eb = document.createElement('span');
      eb.className = 'eyebrow';
      eb.textContent = EYEBROW[B.view];
      titleBox.insertBefore(eb, titleBox.firstChild);
    }
    // Le projet courant suit d'une page à l'autre : dès qu'un lien de la bannière porte un projet (la page l'y a mis), les autres liens le reprennent.
    // Ainsi Overview, Ressources et Budget s'ouvrent sur le même projet que celui qu'on regarde, quelle que soit la page de départ.
    var SHARE = ['overview', 'gantt', 'structure', 'ressources', 'suivi', 'copilote', 'budget'];
    var navLinks = function () { return document.querySelectorAll('.ppm-nav a[data-view]'); };
    var propagating = false;
    function propagateProject() {
      if (propagating) return;
      propagating = true;
      var id = '';
      Array.prototype.forEach.call(navLinks(), function (a) { var m = /[?&]project=([^&]+)/.exec(a.getAttribute('href') || ''); if (m && !id) id = m[1]; });
      if (id) {
        Array.prototype.forEach.call(navLinks(), function (a) {
          var h = a.getAttribute('href') || '';
          if (SHARE.indexOf(a.getAttribute('data-view')) >= 0 && !/[?&]project=/.test(h)) a.setAttribute('href', h + (h.indexOf('?') >= 0 ? '&' : '?') + 'project=' + id);
        });
      }
      propagating = false;
    }
    var navBox = document.querySelector('.ppm-nav');
    if (navBox && window.MutationObserver) new MutationObserver(propagateProject).observe(navBox, { subtree: true, attributes: true, attributeFilter: ['href'] });
    propagateProject();

    var here = document.querySelector('.ppm-bar [data-view="' + (B.view || '') + '"]');
    if (here) here.setAttribute('aria-current', 'page');
    document.getElementById('ppm-brand').setAttribute('href', base + '?view=' + (B.home || 'overview'));
    if (B.logoUrl) {
      var img = document.getElementById('ppm-logo');
      img.src = B.logoUrl;
      img.alt = 'Airbus';
      img.hidden = false;
    }
    window.addEventListener('load', function () {
      if (window.console && B.version) console.info('PPM ' + B.version + ' : données préparées en ' + (B.serverMs || 0) + ' ms, page prête en ' + Math.round(performance.now()) + ' ms');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<header>
  <div class="title">
    <h1 id="title">Copilote</h1>
    <p class="context" id="context"></p>
  </div>
  <div class="controls">
    <select id="picker" aria-label="Projet"></select>
  </div>
</header>

<div class="status">
  <div class="seg" role="tablist" aria-label="Rubriques">
    <button type="button" data-tab="synthese" aria-pressed="true">Synthèse</button>
    <button type="button" data-tab="simulation" aria-pressed="false">Simulation « et si… »</button>
    <button type="button" data-tab="questions" aria-pressed="false">Questions</button>
    <button type="button" data-tab="suggestions" aria-pressed="false" id="tab-sugg">Suggestions</button>
  </div>
  <button type="button" class="icon-btn" id="reload" style="margin-left:auto" aria-label="Actualiser" title="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</div>

<section class="panel" id="panel-synthese" aria-label="Synthèse"></section>
<section class="panel" id="panel-simulation" aria-label="Simulation" hidden></section>
<section class="panel" id="panel-questions" aria-label="Questions" hidden></section>
<section class="panel" id="panel-suggestions" aria-label="Suggestions" hidden></section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';

  var state = { tab: 'synthese', projectId: '', catalog: null, status: null, brief: null, briefAi: null,
    items: null, hyps: [], sim: null, simAi: null, qa: [], sugg: null, seq: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var GEMINI_URL = 'https://gemini.google.com/app';

  // ------------------------------------------------------------ outils
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function uuid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function frDate(s) { if (!s) return '—'; var p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function plural(n, one, many) { return n + ' ' + (Math.abs(n) > 1 ? many : one); }
  function days(n) { return n === null || n === undefined ? '' : n === 0 ? '=' : (n > 0 ? '+' : '−') + plural(Math.abs(n), 'jour', 'jours'); }
  var toastTimer = null;
  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isError ? 7000 : 3500);
  }
  function call(action, params, write) {
    var pre = window.ppmPreloaded && window.ppmPreloaded(action, params, write);
    if (pre) return pre;
    return new Promise(function (resolve, reject) {
      document.body.classList.add('busy');
      google.script.run
        .withSuccessHandler(function (res) {
          document.body.classList.remove('busy');
          if (res && res.ok) resolve(res.data); else reject(res && res.error ? res.error : { code: 'INTERNAL', message: 'Réponse inattendue du serveur.' });
        })
        .withFailureHandler(function (err) {
          document.body.classList.remove('busy');
          reject({ code: 'NETWORK', message: 'Le serveur ne répond pas. Vérifiez la connexion puis cliquez sur Actualiser.', details: String(err) });
        })
        .uiCall(action, params || {}, write ? uuid() : null);
    });
  }
  function loading(panel) { clear(panel); panel.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(panel, title, text) { clear(panel); panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text || '' })])); }
  function card(k, v, s, alert) {
    return el('div', { class: 'card' + (alert ? ' alert' : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]);
  }
  function table(head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { return el('th', { scope: 'col', text: h }); }))]), el('tbody', {}, rows)])]);
  }
  function mode() { return state.status ? state.status.mode : 'off'; }

  // ------------------------------------------------------------ bloc IA (réponse, texte à copier, avis)
  function aiBlock(ai, title) {
    var box = el('div', { class: 'ai' }, [el('h3', { text: title })]);
    if (ai.mode === 'manual') {
      var ta = el('textarea', { readonly: 'readonly', 'aria-label': 'Texte à coller dans Gemini', class: 'prompt' });
      ta.value = ai.prompt;
      box.appendChild(el('p', { class: 'note', text: 'Copiez ce texte et collez-le dans Gemini : il contient les consignes et les chiffres calculés par l’outil. Relisez la réponse avant de l’utiliser.' }));
      box.appendChild(ta);
      box.appendChild(el('div', { class: 'row' }, [
        el('button', { type: 'button', class: 'btn primary', text: 'Copier le texte', onclick: function () { copy(ta); } }),
        el('a', { class: 'btn', href: GEMINI_URL, target: '_blank', rel: 'noopener', text: 'Ouvrir Gemini' })
      ]));
      return box;
    }
    box.appendChild(el('p', { class: 'answer', text: ai.text }));
    if (ai.unverified && ai.unverified.length) {
      box.appendChild(el('p', { class: 'warnbox', text: 'Chiffres absents des données de l’outil : ' + ai.unverified.join(', ') + '. Ne les reprenez pas sans vérification.' }));
    } else {
      box.appendChild(el('p', { class: 'note', text: 'Tous les chiffres cités se retrouvent dans les données calculées par l’outil.' + (ai.steps && ai.steps.length ? ' Données consultées : ' + ai.steps.map(stepLabel).join(', ') + '.' : '') }));
    }
    var fb = el('div', { class: 'row' }, [el('span', { class: 'muted', text: 'Cette réponse vous est-elle utile ?' })]);
    [['Utile', true], ['Pas utile', false]].forEach(function (b) {
      fb.appendChild(el('button', { type: 'button', class: 'btn', text: b[0], onclick: function (e) {
        var btns = fb.querySelectorAll('button');
        Array.prototype.forEach.call(btns, function (x) { x.disabled = true; });
        call('copilot.feedback', { logId: ai.logId, useful: b[1] }, true).then(function () { e.target.textContent = b[0] + ' ✓'; toast('Merci : votre avis sert à mesurer la pertinence du copilote.'); })
          .catch(function (err) { Array.prototype.forEach.call(btns, function (x) { x.disabled = false; }); toast(err.message || 'Avis non enregistré.', true); });
      } }));
    });
    box.appendChild(fb);
    return box;
  }
  function stepLabel(s) {
    return { get_brief: 'synthèse', list_items: 'liste des livrables', simulate_shift: 'simulation', list_risks: 'risques', list_alerts: 'alertes' }[s] || s;
  }
  function copy(ta) {
    var done = function () { toast('Texte copié : collez-le dans Gemini.'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, fallback); return; }
    } catch (e) { /* voir ci-dessous */ }
    fallback();
    function fallback() {
      ta.focus(); ta.select();
      try { if (document.execCommand('copy')) { done(); return; } } catch (e) { /* rien */ }
      toast('Texte sélectionné : faites Ctrl+C (ou Cmd+C) pour le copier.');
    }
  }
  function aiButtonLabel(what) {
    return mode() === 'api' ? what + ' avec Gemini' : 'Préparer le texte pour Gemini';
  }

  // ------------------------------------------------------------ navigation
  function remember() {
    var base = BOOT.baseUrl || '', q = state.projectId ? '&project=' + state.projectId : '';
    $('nav-plan').setAttribute('href', base + '?view=gantt' + q);
    $('nav-struct').setAttribute('href', base + '?view=structure' + q);
    $('nav-suivi').setAttribute('href', base + '?view=suivi' + q);
    $('nav-copilot').setAttribute('href', base + '?view=copilote' + q + '&tab=' + state.tab);
    try { google.script.history.replace(null, { view: 'copilote', project: state.projectId, tab: state.tab }); } catch (e) { /* hors web app */ }
  }
  function fillPicker() {
    var sel = $('picker'); clear(sel);
    var cat = state.catalog, byProgram = {};
    cat.projects.forEach(function (p) { (byProgram[p.program_id || ''] = byProgram[p.program_id || ''] || []).push(p); });
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    var group = function (label, list) {
      if (!list || !list.length) return;
      var og = el('optgroup', { label: label });
      list.sort(sortCode).forEach(function (p) { og.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
      sel.appendChild(og);
    };
    cat.programs.slice().sort(sortCode).forEach(function (g) { group(g.code + ' ' + g.name, byProgram[g.id]); });
    group('Hors programme', byProgram['']);
    sel.value = state.projectId;
  }
  function syncTabs() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-tab') === state.tab)); });
    ['synthese', 'simulation', 'questions', 'suggestions'].forEach(function (t) { $('panel-' + t).hidden = t !== state.tab; });
  }
  function setTab(t) { state.tab = t; syncTabs(); remember(); return render(); }
  function renderContext() {
    var p = state.catalog.projects.filter(function (x) { return x.id === state.projectId; })[0];
    $('title').textContent = p ? p.code + ' ' + p.name : 'Copilote';
    var m = mode();
    var ctx = $('context'); clear(ctx);
    ctx.appendChild(el('span', { class: 'badge mode ' + (m === 'off' ? '' : 'ok'), id: 'mode-badge',
      text: m === 'api' ? 'IA : Gemini' + (state.status.model ? ' (' + state.status.model + ')' : '') + ' — ' + state.status.quota.used + '/' + state.status.quota.limit + ' demandes aujourd’hui'
        : m === 'manual' ? 'IA : texte à coller dans Gemini' : 'IA désactivée' }));
  }

  function loadProject(id) {
    state.projectId = id; state.brief = null; state.briefAi = null; state.items = null; state.hyps = []; state.sim = null; state.simAi = null; state.qa = []; state.sugg = null;
    $('picker').value = id;
    remember();
    return call('copilot.status', { projectId: id }).then(function (s) { state.status = s; renderContext(); return render(); })
      .catch(function (e) { toast(e.message || 'Erreur.', true); });
  }
  function render() {
    if (state.tab === 'synthese') return renderSynthese();
    if (state.tab === 'simulation') return renderSimulation();
    if (state.tab === 'questions') { renderQuestions(); return Promise.resolve(); }
    return renderSuggestions();
  }

  // ------------------------------------------------------------ synthèse
  function renderSynthese() {
    var panel = $('panel-synthese');
    if (!state.brief) {
      loading(panel);
      var ticket = ++state.seq;
      return call('copilot.brief', { projectId: state.projectId }).then(function (b) {
        if (ticket !== state.seq) return;
        state.brief = b; renderSynthese();
      }).catch(function (e) { empty(panel, 'Synthèse indisponible.', e.message); });
    }
    var f = state.brief.facts, st = f.schedule;
    clear(panel);
    var cards = el('div', { class: 'cards' });
    cards.appendChild(card('Avancement', f.progress.weighted_pct + ' %', plural(f.progress.done, 'élément terminé', 'éléments terminés') + ' sur ' + f.progress.items));
    cards.appendChild(card('Fin du plan', frDate(st.plan_end), st.margin_to_target === null ? (st.target_end ? '' : 'Pas de fin visée') :
      (st.margin_to_target >= 0 ? plural(st.margin_to_target, 'jour ouvré', 'jours ouvrés') + ' de marge' : plural(-st.margin_to_target, 'jour ouvré', 'jours ouvrés') + ' après la fin visée'), st.margin_to_target !== null && st.margin_to_target < 0));
    cards.appendChild(card('Écart à la baseline', f.baseline ? days(st.slip_vs_baseline) : '—', f.baseline ? f.baseline.label + ' du ' + frDate(f.baseline.frozen_on) : 'Pas de baseline', st.slip_vs_baseline > 0));
    cards.appendChild(card('En retard', String(f.late_count), f.late_count ? 'dont « ' + f.late[0].name + ' »' : 'aucun élément', f.late_count > 0));
    cards.appendChild(card('Alertes', String(f.insights.alerte), plural(f.insights.vigilance, 'vigilance', 'vigilances'), f.insights.alerte > 0));
    panel.appendChild(cards);
    panel.appendChild(el('ul', { class: 'lines', id: 'brief-lines' }, state.brief.lines.map(function (l) { return el('li', { class: l.tone || '', text: l.text }); })));

    if (f.upcoming_milestones.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Jalons des 90 prochains jours' }));
      panel.appendChild(table(['Jalon', 'Date', 'Dans', 'Écart à la baseline', 'Menacé par'], f.upcoming_milestones.map(function (m) {
        return el('tr', {}, [el('td', { text: m.name }), el('td', { text: frDate(m.date) }), el('td', { text: plural(m.in_days, 'jour', 'jours') }),
          el('td', { class: 'num' + (m.slip_vs_baseline > 0 ? ' late' : ''), text: m.slip_vs_baseline === null ? '—' : days(m.slip_vs_baseline) }),
          el('td', { class: m.threatened_by.length ? 'late' : '', text: m.threatened_by.join(', ') || '—' })]);
      })));
    }
    if (f.due_soon.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Échéances des 14 prochains jours' }));
      panel.appendChild(table(['Livrable', 'Fin prévue', 'Avancement', 'Responsable'], f.due_soon.map(function (d) {
        return el('tr', {}, [el('td', {}, [d.name, d.critical ? el('span', { class: 'badge warn', text: 'critique', style: 'margin-left:6px' }) : null]),
          el('td', { text: frDate(d.finish) }), el('td', { class: 'num', text: d.progress_pct + ' %' }), el('td', { text: d.owner || '—' })]);
      })));
    }
    if (f.weak_signals.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Signaux faibles' }));
      panel.appendChild(el('p', { class: 'note', text: 'Commentaires d’avancement récents qui annoncent un blocage, avant que la date ne bouge.' }));
      panel.appendChild(table(['Livrable', 'Déclaré le', 'Commentaire'], f.weak_signals.map(function (s) {
        return el('tr', {}, [el('td', { text: s.item }), el('td', { text: frDate(s.date) }), el('td', { text: '« ' + s.comment + ' »' })]);
      })));
    }

    if (mode() === 'off') {
      panel.appendChild(el('p', { class: 'note', text: 'Synthèse calculée par l’outil ; rédaction par Gemini non activée.' }));
    } else {
      panel.appendChild(el('div', { class: 'row', style: 'margin-top:16px' }, [el('button', { type: 'button', class: 'btn primary', id: 'brief-ai',
        text: aiButtonLabel('Rédiger la synthèse'), onclick: function (e) {
          e.target.disabled = true;
          call('copilot.brief', { projectId: state.projectId, ai: true }, true).then(function (b) { state.briefAi = b.ai; refreshStatus(); renderSynthese(); })
            .catch(function (err) { e.target.disabled = false; toast(err.message || 'Échec.', true); });
        } })]));
      if (state.briefAi) panel.appendChild(aiBlock(state.briefAi, state.briefAi.mode === 'manual' ? 'Texte à coller dans Gemini' : 'Synthèse rédigée par Gemini'));
    }
  }
  function refreshStatus() { call('copilot.status', { projectId: state.projectId }).then(function (s) { state.status = s; renderContext(); }).catch(function () { /* rien */ }); }

  // ------------------------------------------------------------ simulation
  function renderSimulation() {
    var panel = $('panel-simulation');
    if (!state.items) {
      loading(panel);
      return call('gantt.project', { projectId: state.projectId }).then(function (g) {
        state.items = g.rows.filter(function (r) { return r.kind === 'item' && r.finish && !r.external; });
        renderSimulation();
      }).catch(function (e) { empty(panel, 'Planning indisponible.', e.message); });
    }
    clear(panel);
    if (!state.items.length) { panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucun élément daté dans ce projet.' })])); return Promise.resolve(); }
    var sel = el('select', { id: 'sim-item', 'aria-label': 'Élément à décaler' });
    state.items.forEach(function (r) { sel.appendChild(el('option', { value: r.id, text: r.name + ' — fin ' + frDate(r.finish) })); });
    var nb = el('input', { type: 'number', id: 'sim-days', value: '5', min: '-200', max: '200', step: '1', 'aria-label': 'Décalage en jours ouvrés' });
    panel.appendChild(el('div', { class: 'hyp' }, [
      el('label', {}, ['Élément', sel]), el('label', {}, ['Décalage (jours ouvrés, négatif pour avancer)', nb]),
      el('button', { type: 'button', class: 'btn', id: 'sim-add', text: 'Ajouter l’hypothèse', onclick: function () {
        var n = Math.round(Number(nb.value));
        if (!n) { toast('Indiquez un décalage différent de zéro.', true); return; }
        var it = state.items.filter(function (r) { return r.id === sel.value; })[0];
        state.hyps = state.hyps.filter(function (h) { return h.itemId !== it.id; }).concat([{ itemId: it.id, name: it.name, shiftDays: n }]);
        state.sim = null; state.simAi = null; renderSimulation();
      } })
    ]));
    var chips = el('div', { class: 'chips', id: 'sim-hyps' });
    state.hyps.forEach(function (h) {
      chips.appendChild(el('span', { class: 'chip' }, [h.name + ' ' + (h.shiftDays > 0 ? '+' : '−') + plural(Math.abs(h.shiftDays), 'jour', 'jours'),
        el('button', { type: 'button', class: 'x', 'aria-label': 'Retirer ' + h.name, text: '×', style: 'border:0;background:none;cursor:pointer', onclick: function () {
          state.hyps = state.hyps.filter(function (x) { return x !== h; }); state.sim = null; state.simAi = null; renderSimulation();
        } })]));
    });
    panel.appendChild(chips);
    var go = el('button', { type: 'button', class: 'btn primary', id: 'sim-run', text: 'Simuler', onclick: runSim });
    go.disabled = !state.hyps.length;
    panel.appendChild(el('div', { class: 'row' }, [go, el('span', { class: 'muted', text: state.hyps.length ? '' : 'Ajoutez au moins une hypothèse.' })]));
    if (state.sim) renderSimResult(panel);
    return Promise.resolve();
  }
  function runSim() {
    call('simulations.run', { projectId: state.projectId, changes: state.hyps.map(function (h) { return { itemId: h.itemId, shiftDays: h.shiftDays }; }) })
      .then(function (r) { state.sim = r; state.simAi = null; renderSimulation(); })
      .catch(function (e) { toast(e.message || 'Simulation impossible.', true); });
  }
  function renderSimResult(panel) {
    var r = state.sim, pe = r.plan_end;
    var box = el('div', { id: 'sim-result' });
    box.appendChild(el('h2', { class: 'sec', text: 'Résultat' }));
    var cards = el('div', { class: 'cards' });
    cards.appendChild(card('Fin du plan', frDate(pe.after), pe.shift ? days(pe.shift) + ' ouvrés (avant : ' + frDate(pe.before) + ')' : 'Inchangée', pe.shift > 0));
    if (pe.baseline) cards.appendChild(card('Écart à la baseline', days(pe.slip_vs_baseline), 'fin figée le ' + frDate(pe.baseline), pe.slip_vs_baseline > 0));
    cards.appendChild(card('Décalés en cascade', String(r.domino), r.domino ? 'successeurs repoussés' : 'la marge absorbe', r.domino > 0));
    cards.appendChild(card('Jalons menacés', String(r.newly_threatened.length), '', r.newly_threatened.length > 0));
    cards.appendChild(card('Autres projets', String(r.external_impacts.length), r.external_impacts.length ? 'à prévenir' : 'aucun impact', r.external_impacts.length > 0));
    box.appendChild(cards);
    box.appendChild(table(['Élément', 'Fin avant', 'Fin après', 'Décalage', 'Pourquoi'], r.moved.map(function (m) {
      return el('tr', {}, [el('td', { text: m.name }), el('td', { text: frDate(m.before_finish) }), el('td', { text: frDate(m.finish) }),
        el('td', { class: 'num' + (m.shift > 0 ? ' late' : ''), text: days(m.shift) }), el('td', { text: m.hypothesis ? 'Hypothèse' : 'Suit « ' + m.cause + ' »' })]);
    })));
    var list = function (title, items) { if (!items.length) return; box.appendChild(el('h2', { class: 'sec', text: title })); box.appendChild(el('ul', {}, items.map(function (t) { return el('li', { text: t }); }))); };
    list('Jalons qui deviendraient menacés', r.newly_threatened.map(function (t) { return '« ' + t.milestone + ' » (' + frDate(t.milestone_date) + ') : « ' + t.deliverable + ' » finirait le ' + frDate(t.deliverable_finish) + '.'; }));
    list('Autres projets touchés', r.external_impacts.map(function (e) { return e.project + ' · « ' + e.name + ' » devrait être repoussé de ' + plural(e.gap, 'jour ouvré', 'jours ouvrés') + ' (à cause de « ' + e.because + ' »).'; }));
    list('Éléments qui passeraient sur le chemin critique', r.newly_critical.map(function (n) { return n; }));
    r.notes.forEach(function (n) { box.appendChild(el('p', { class: 'note', text: n })); });
    box.appendChild(el('p', { class: 'note', text: 'Rien n’est enregistré. Pour appliquer une hypothèse, déplacez les barres dans le Planning.' }));
    if (mode() !== 'off') {
      box.appendChild(el('button', { type: 'button', class: 'btn', id: 'sim-ai', text: aiButtonLabel('Expliquer'), onclick: function (e) {
        e.target.disabled = true;
        call('simulations.run', { projectId: state.projectId, explain: true, changes: state.hyps.map(function (h) { return { itemId: h.itemId, shiftDays: h.shiftDays }; }) }, true)
          .then(function (res) { state.simAi = res.ai; refreshStatus(); renderSimulation(); })
          .catch(function (err) { e.target.disabled = false; toast(err.message || 'Échec.', true); });
      } }));
      if (state.simAi) box.appendChild(aiBlock(state.simAi, state.simAi.mode === 'manual' ? 'Texte à coller dans Gemini' : 'Explication de Gemini'));
    }
    panel.appendChild(box);
  }

  // ------------------------------------------------------------ questions
  var EXAMPLES = ['Quels livrables risquent de retarder le prochain jalon ?', 'Que se passe-t-il si le livrable le plus en retard glisse encore de 5 jours ?', 'Quels points aborder au prochain COPIL ?'];
  function renderQuestions() {
    var panel = $('panel-questions');
    clear(panel);
    if (mode() === 'off') {
      empty(panel, 'Questions au copilote : non activées.', 'Le copilote répond aux questions en consultant les données du projet par l’outil. Il faut d’abord qu’un administrateur active Gemini (propriété PPM_AI_MODE), avec l’accord de la DSI.');
      return;
    }
    var ta = el('textarea', { id: 'question', maxlength: '1000', 'aria-label': 'Votre question', placeholder: 'Votre question…' });
    var chips = el('div', { class: 'chips' }, EXAMPLES.map(function (q) { return el('button', { type: 'button', class: 'chip', text: q, onclick: function () { ta.value = q; ta.focus(); } }); }));
    var ask = el('button', { type: 'button', class: 'btn primary', id: 'ask-btn', text: mode() === 'api' ? 'Demander' : 'Préparer le texte pour Gemini', onclick: function () {
      var q = ta.value.trim();
      if (!q) { toast('Posez une question.', true); return; }
      ask.disabled = true;
      call('copilot.ask', { projectId: state.projectId, question: q }, true).then(function (a) {
        state.qa.unshift({ q: q, a: a }); ta.value = ''; refreshStatus(); renderQuestions();
      }).catch(function (e) { ask.disabled = false; toast(e.message || 'Échec.', true); });
    } });
    panel.appendChild(el('div', { class: 'ask' }, [chips, ta, el('div', { class: 'row', style: 'margin-top:8px' }, [ask])]));
    var qa = el('div', { class: 'qa', id: 'qa' });
    state.qa.forEach(function (x) { qa.appendChild(el('div', {}, [el('p', { class: 'q', text: x.q }), aiBlock(x.a, x.a.mode === 'manual' ? 'Texte à coller dans Gemini' : 'Réponse')])); });
    panel.appendChild(qa);
  }

  // ------------------------------------------------------------ suggestions
  function renderSuggestions() {
    var panel = $('panel-suggestions');
    loading(panel);
    return call('copilot.suggestions', { projectId: state.projectId }).then(function (s) {
      state.sugg = s;
      $('tab-sugg').textContent = 'Suggestions' + (s.pending.length ? ' (' + s.pending.length + ')' : '');
      clear(panel);
      if (!s.canDecide) panel.appendChild(el('p', { class: 'note', text: 'Lecture seule : le chef de projet, le DPL ou le Program Leader décident.' }));
      var st = s.stats;
      var cards = el('div', { class: 'cards' });
      cards.appendChild(card('En attente', String(s.pending.length), ''));
      cards.appendChild(card('Taux d’acceptation', st.accept_rate === null ? '—' : st.accept_rate + ' %', 'des suggestions traitées'));
      if (st.ai_answers) cards.appendChild(card('Réponses de Gemini', String(st.ai_answers), st.ai_useful + ' utiles, ' + st.ai_not_useful + ' pas utiles'));
      panel.appendChild(cards);
      if (!s.pending.length) panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucune suggestion en attente.' })]));
      var list = el('div', { class: 'sugg', id: 'sugg-list' });
      s.pending.forEach(function (x) {
        var art = el('article', { 'data-insight': x.id }, [
          el('div', { class: 'row' }, [el('span', { class: 'badge ' + (x.severity === 'Alerte' ? 'alert' : x.severity === 'Vigilance' ? 'warn' : ''), text: x.severity })]),
          el('p', { text: x.message }), x.suggestion ? el('p', { class: 'muted', text: 'Suggestion : ' + x.suggestion }) : null
        ]);
        if (s.canDecide) {
          var note = el('input', { type: 'text', maxlength: '500', placeholder: 'Note (facultative)', 'aria-label': 'Note' });
          var decide = function (d) {
            return function () {
              call('insights.decide', { id: x.id, version: x.version, decision: d, note: note.value }, true)
                .then(function () { toast(d === 'Accepté' ? 'Suggestion acceptée.' : 'Suggestion ignorée.'); return renderSuggestions(); })
                .catch(function (e) { toast(e.message || 'Échec.', true); });
            };
          };
          art.appendChild(el('div', { class: 'row', style: 'margin-top:8px' }, [note,
            el('button', { type: 'button', class: 'btn primary', text: 'Accepter', onclick: decide('Accepté') }),
            el('button', { type: 'button', class: 'btn', text: 'Ignorer', onclick: decide('Ignoré') })]));
        }
        list.appendChild(art);
      });
      panel.appendChild(list);
      if (s.recent.length) {
        panel.appendChild(el('h2', { class: 'sec', text: 'Décisions récentes' }));
        panel.appendChild(table(['Constat', 'Décision', 'Par', 'Note'], s.recent.map(function (r) {
          return el('tr', {}, [el('td', { text: r.message }), el('td', {}, [el('span', { class: 'badge ' + (r.status === 'Accepté' ? 'ok' : ''), text: r.status })]),
            el('td', { text: r.decided_by + ' · ' + frDate(r.decided_at) }), el('td', { text: r.note || '' })]);
        })));
      }
    }).catch(function (e) { empty(panel, 'Suggestions indisponibles.', e.message); });
  }

  // ------------------------------------------------------------ événements et démarrage
  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
  $('picker').addEventListener('change', function () { loadProject(this.value); });
  $('reload').addEventListener('click', function () { loadProject(state.projectId); });

  state.tab = BOOT.tab || 'synthese';
  syncTabs();
  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { empty($('panel-' + state.tab), 'Aucun projet pour l’instant.', 'Créez un projet dans l’application AppSheet, puis revenez ici.'); return; }
    state.projectId = first;
    fillPicker();
    return loadProject(first);
  }).catch(function (e) { empty($('panel-' + state.tab), 'Chargement impossible.', e.message); });

  window.__ppm = { state: state, setTab: setTab };
})();
</script>
</body>
</html>
