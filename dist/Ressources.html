<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.19.4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Charte : inspirée d'airbus.com. Police Inter (police numérique officielle d'Airbus), bleu de marque #00205B,
     tout en bleus : aucune teinte grise. Rouge, ambre et vert sont réservés aux états (alerte, critique, terminé). */
  :root {
    --brand: #00205B;
    --brand-2: #00377A;
    --accent: #0085CA;
    --accent-2: #5FB4E5;
    --paper: #F4F6F9;
    --surface: #FFFFFF;
    --tint: #E8F2FB;
    --hover: #DCEAF7;
    --ink: #1A1D29;
    --muted: #5A6473;
    --faint: #8A94A6;
    --rule: #E2E7EE;
    --line-strong: #C9D3E0;
    --bar: #3B9AD6;
    --bar-hover: #0085CA;
    --bar-done: #00377A;
    --summary: #00205B;
    --summary-progress: #00377A;
    --bar-external: #BFD8EE;
    --bar-external-progress: #8FBFE3;
    --ghost: #00377A;
    --amber: #E8820C;
    --amber-dark: #C05600;
    --red: #D0342C;
    --green: #1E8A56;
    --cyan: #5FB4E5;
    --focus: #0085CA;
    --on-accent: #FFFFFF;
    --warn-bg: #FFF1E6; --warn-ink: #C05600;
    --alert-bg: #FDE9E7; --alert-ink: #9B211A;
    --ok-bg: #E2F4EA; --ok-ink: #145C39;
    --shadow: 0 4px 20px rgba(0, 32, 91, .08);
    --radius: 6px;
    --grad-hero: linear-gradient(120deg, #00205B 0%, #00377A 45%, #0085CA 110%);
    --grad-accent: linear-gradient(90deg, #0085CA 0%, #5FB4E5 100%);
    --bar-bg: #00205B;
    color-scheme: light;
  }
  /* Thème nuit : classe .dark posée par la bannière, selon le choix de l'utilisateur ou, à défaut, le réglage de l'ordinateur. */
  :root.dark {
    --paper: #0A1730; --surface: #10213F; --tint: #152B52; --hover: #1B3563;
    --ink: #E8F0FD; --muted: #9DB3D6; --faint: #6F86AE; --rule: #1E3560; --line-strong: #4A6AA3;
    --bar: #4AA8E0; --bar-hover: #6BBBEA; --bar-done: #9CCDF0; --summary: #2A5CA8; --summary-progress: #4C84D0;
    --bar-external: #27467A; --bar-external-progress: #355C99; --ghost: #9CCDF0;
    --accent: #4DB2EC; --accent-2: #5FB4E5; --brand-2: #8CC4F0;
    --warn-bg: #3A2A07; --warn-ink: #F5CE7A; --alert-bg: #3D1412; --alert-ink: #F7A59F; --ok-bg: #0D3322; --ok-ink: #8FE0B6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
    --bar-bg: #06101F;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 Inter, "Segoe UI", Roboto, Arial, sans-serif; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased; }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--accent); }

  /* ---- bannière commune ---- */
  .ppm-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px 28px; height: 52px;
    padding: 0 24px; background: var(--bar-bg); color: #fff; border-bottom: 3px solid transparent; border-image: var(--grad-accent) 1; }
  .ppm-brand { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .ppm-brand img { height: 22px; width: auto; display: block; }
  .ppm-name { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .ppm-brand img:not([hidden]) + .ppm-name { padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .35); font-weight: 600; }
  .ppm-nav { display: flex; align-self: stretch; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .ppm-nav a { display: inline-flex; align-items: center; padding: 0 12px; color: rgba(255, 255, 255, .78); text-decoration: none;
    font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
  .ppm-nav a:hover { color: #fff; }
  .ppm-nav a[aria-current="page"] { color: #fff; border-bottom-color: var(--accent-2); }
  .ppm-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; }
  .ppm-icon:hover { background: rgba(255, 255, 255, .12); }
  .ppm-icon svg { width: 20px; height: 20px; }
  a.ppm-icon { text-decoration: none; }
  .ppm-icon[aria-current="page"] { background: rgba(255, 255, 255, .18); }

  /* ---- en-tête de page ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 24px 12px; background: var(--paper); }
  .title { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .title h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .title .context { margin: 0; color: var(--muted); font-size: 14px; }
  .title .context button { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .controls label.field { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
  select { min-width: 240px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { padding: 6px 12px; border: 0; background: transparent; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-accent); }
  :root.dark .seg button[aria-pressed="true"] { background: var(--accent); color: #031126; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
  .btn { padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-accent); }
  .btn.primary:hover { background: var(--brand-2); }
  :root.dark .btn.primary { background: var(--accent); border-color: var(--accent); color: #031126; }
  a.btn { display: inline-block; color: var(--ink); text-decoration: none; }
  a.btn.primary { color: var(--on-accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;
    border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; font-weight: 600; }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---- bandeau d'état : pastilles plutôt que phrases ---- */
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 24px 12px; }
  .status p { margin: 0; }
  .status .alert { color: var(--red); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--tint); color: var(--ink); font-size: 13px; font-weight: 500; }
  .chip.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 18px; height: 10px; border-radius: 3px; background: var(--bar); }
  .swatch.critical { background: var(--amber); } .swatch.alert { background: var(--red); }
  .swatch.done { background: var(--green); } .swatch.milestone { background: var(--cyan); }
  .swatch.summary { background: var(--summary); }

  /* ---- fenêtre d'information (ⓘ, ?) ---- */
  .pop-anchor { position: relative; display: inline-flex; }
  .popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 260px; max-width: min(420px, 86vw);
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 14px; }
  .popover.right { left: auto; right: 0; }
  .popover dl { margin: 0; }
  .popover .legend { flex-direction: column; gap: 6px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr); }
  main.with-details { grid-template-columns: minmax(0, 1fr) 340px; }
  .chart { min-width: 0; padding: 4px 24px 24px; }
  .gantt-host { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 17px; font-weight: 600; }
  .undated { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

  section.issues { margin-top: 20px; }
  section.issues h2, aside h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 14px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
  .table-wrap table { border: 0; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; background: var(--tint); }
  td.num { text-align: right; }

  aside { position: relative; padding: 16px 20px; background: var(--surface); border-left: 1px solid var(--rule); }
  aside[hidden] { display: none; }
  aside .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  aside h2 { padding-right: 28px; }
  aside .kind { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0 0 16px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .flag { display: block; margin: 0 0 12px; padding: 8px 10px; border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; }
  .flag.alert { border-color: var(--red); background: var(--alert-bg); color: var(--alert-ink); }
  form.declare { display: grid; gap: 8px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  form.declare h3 { margin: 0; font-size: 15px; font-weight: 600; }
  input[type=number], input[type=text], textarea { background: var(--surface); }
  form.declare input[type=number] { width: 96px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; }
  form.declare textarea { min-height: 64px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; resize: vertical; }
  form.declare .row { display: flex; align-items: center; gap: 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  dialog { max-width: 460px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 24px; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0, 32, 91, .35); }
  dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  dialog p { margin: 0 0 10px; }
  dialog .warn { color: var(--red); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 40;
    padding: 10px 16px; border-radius: 6px; background: var(--brand); color: #fff; box-shadow: var(--shadow); }
  :root.dark .toast { background: var(--accent); color: #031126; }
  .toast.error { background: var(--red); color: #fff; }
  .toast[hidden] { display: none; }
  .busy { cursor: progress; }
  .loading { padding: 48px 24px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .ppm-bar { padding: 0 8px 0 12px; gap: 8px; }
    .ppm-nav a { padding: 0 8px; }
    header, .status, .chart { padding-left: 12px; padding-right: 12px; }
    main.with-details { grid-template-columns: minmax(0, 1fr); }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
    select { min-width: 0; width: 100%; }
    .controls { width: 100%; }
  }
  /* Petit écran : la bannière passe sur deux lignes (marque et boutons, puis navigation) au lieu de couper le menu. */
  @media (max-width: 640px) {
    .ppm-bar { flex-wrap: wrap; height: auto; padding: 0 8px 0 12px; gap: 0 8px; }
    .ppm-brand { flex: 1; min-height: 44px; }
    .ppm-icon { align-self: center; }
    .ppm-nav { order: 3; flex: 1 0 100%; height: 40px; margin: 0 -8px 0 -12px; padding: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- charte inspirée de la diapositive Airbus : hero dégradé, libellés en capitales espacées, cartes à liseré, pastilles ---- */
  body { background: var(--paper); }
  header { position: relative; overflow: hidden; background: var(--grad-hero); color: #FFFFFF; padding: 20px 24px 18px; }
  header::after { content: ''; position: absolute; right: -8%; top: -60%; width: 45%; height: 260%; background: radial-gradient(circle at center, rgba(255, 255, 255, .13), transparent 60%); transform: skewX(-12deg); pointer-events: none; }
  header > * { position: relative; z-index: 1; }
  header .title { flex-wrap: wrap; row-gap: 2px; }
  header .eyebrow { flex: 0 0 100%; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-2); }
  header .title h1 { color: #FFFFFF; font-size: 28px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; }
  header .title .context, header .context { color: var(--accent-2); }
  header .controls label.field { color: var(--accent-2); }
  header .toggle { color: #FFFFFF; }
  header .icon-btn { color: #FFFFFF; }
  header .icon-btn:hover, header .icon-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
  header select, header .seg, header .btn { color: var(--ink); }
  header .seg button[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
  .popover { color: var(--ink); }
  .eyebrow-dark, body h2.sec { display: block; position: relative; padding-left: 38px; font-size: 12.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }
  .eyebrow-dark::before, body h2.sec::before { content: ''; position: absolute; left: 0; top: 50%; width: 28px; height: 2px; background: var(--accent); }
  .cards .card, .box, .kpi { border-left: 4px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); }
  .cards .card .k { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--brand-2); }
  :root.dark .cards .card .k { color: var(--accent-2); }
  th { font-size: 11.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--brand-2); }
  :root.dark th { color: var(--accent-2); }
  .chip, .badge { font-weight: 700; letter-spacing: .3px; }
  .num-dot { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #FFFFFF; font-weight: 800; font-size: 20px; flex: none; }
  :root.dark .num-dot { background: var(--accent); color: #06101F; }
  .tag-warn { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; background: var(--amber); color: #FFFFFF; padding: 3px 8px; border-radius: 100px; }
  .callout { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 8px 12px; font-weight: 500; }
  .hero-note { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .28); border-radius: 8px; padding: 12px 18px; max-width: 360px; backdrop-filter: blur(4px); }
  .hero-note .k { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-2); margin: 0 0 4px; }
  .hero-note .t { font-size: 15px; font-weight: 300; line-height: 1.4; color: #FFFFFF; margin: 0; }
  .hero-note .t b { font-weight: 700; }
  .btn.primary { background: var(--brand); border-color: var(--brand); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  /* Plus d'onglets : chaque rubrique est une zone de la page, avec son titre */
  .zone { padding: 22px 24px 0; }
  .zone h2.sec { margin: 0; }
  .zone[hidden] { display: none; }
  @media (max-width: 900px) { header { padding: 14px 12px 12px; } header .title h1 { font-size: 22px; } .zone { padding: 16px 12px 0; } }
  /* ---- composants communs aux pages (0.12.1) : une seule définition, reprise des pages ---- */
  .panel[hidden] { display: none; }
  /* Pages en zones (Compte, Budget, Administration) : une grille qui se réagence selon la largeur, des cartes comme dans l'Overview, sans place vide.
     --cell-min = largeur minimale d'une carte ; --max-cols = nombre maximal de colonnes (jamais de colonne vide sur un grand écran) ; .wide = une carte sur toute la largeur (gros tableaux) ; une carte dont le panneau est masqué disparaît. */
  .zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(min(100%, var(--cell-min, 460px)), calc((100% - (var(--max-cols, 4) - 1) * 20px) / var(--max-cols, 4))), 1fr)); gap: 20px; padding: 16px 24px 28px; align-items: start; }
  .zones .cell { min-width: 0; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); }
  .zones .cell.wide { grid-column: 1 / -1; }
  .zones .cell:has(> .panel[hidden]) { display: none; }
  .zones .cell > .zone { padding: 16px 20px 0; }
  .zones .cell > .panel { max-width: none; padding: 8px 20px 20px; }
  .zones .form { max-width: none; }
  @media (max-width: 700px) { .zones { padding: 12px; gap: 12px; } .zones .cell > .zone { padding: 12px 12px 0; } .zones .cell > .panel { padding: 8px 12px 14px; } }
  .muted { color: var(--muted); }
  .late { color: var(--red); font-weight: 500; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12.5px; background: var(--tint); color: var(--ink); white-space: nowrap; }
  .badge.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
  td small { display: block; color: var(--muted); }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions-cell .btn { padding: 3px 10px; font-size: 13.5px; }
  .ed-grid { display: grid; gap: 12px; }
  .ed-grid label.lbl { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .ed-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ed-error { margin: 12px 0 0; color: var(--red); font-weight: 500; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0 0 16px; }
  .card .k { margin: 0; color: var(--muted); font-size: 13px; }
  .card .v { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  .card .s { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card.alert .v { color: var(--red); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .ed-grid input, .ed-grid select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
</style>
<script>
/**
 * PPM — outils communs à toutes les pages (0.12.1). Une seule version de chacun : le corriger ici le corrige partout.
 * Inclus par chaque page, comme Style et Header (balise d'inclusion de Common, juste après celle de Style). Chaque page les reprend sous des noms courts
 * (var el = ppm.el, …) puis ne contient plus que sa logique propre.
 */
(function (root) {
  'use strict';
  var ppm = root.ppm = root.ppm || {};
  var toastTimer = null;

  /** Crée un élément : attrs (text, class, onclick…, ou tout autre attribut), children (texte ou éléments ; le vide est ignoré). */
  ppm.el = function (tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  };

  ppm.clear = function (n) { while (n.firstChild) n.removeChild(n.firstChild); };

  /** Identifiant d'une écriture : le serveur ignore une écriture rejouée avec le même identifiant. */
  ppm.uuid = function () {

  };

  /** AAAA-MM-JJ (ou date-heure ISO) → JJ/MM/AAAA ; `empty` est rendu quand il n'y a pas de date lisible (par défaut : rien). */
  ppm.frDate = function (s, empty) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (empty === undefined ? '' : empty);
  };

  /** Message bref en bas de page (élément #toast) ; une erreur reste plus longtemps. */
  ppm.toast = function (msg, isError) {
    var t = document.getElementById('toast');

        .withSuccessHandler(function (res) {

        })

    });
  };

  ppm.openDialog = function (d) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); };
  ppm.closeDialog = function (d) { if (d.close) d.close(); else d.removeAttribute('open'); };
})(window);

<script>
/**
 * PPM — formulaire générique et fenêtre de confirmation (0.12.3), pour les pages qui en ont : Budget, Overview, Ressources, Structure.
 * Inclus après Common par ces seules pages (champ « shared » du registre), pour ne rien ajouter aux autres.
 */
(function (root) {
  'use strict';
  var ppm = root.ppm;

  /**
   * Formulaire générique (dialogue #genform : champs décrits par un objet) et fenêtre de confirmation (#confirm).
   * cfg : $ résolveur d'identifiant de la page (Structure : suffixe -wbs ; par défaut getElementById) ;
   *       state objet de la page où garder le formulaire ouvert (state.gform) et l'action à confirmer (state.confirmAction) ;
   *       closeDialog fermeture propre à la page, si elle fait plus que fermer ;
   *       confirmClass classe du bouton de confirmation (Structure : 'btn danger') ; onConfirm rappel à l'ouverture d'une confirmation.
   * Champs : { key, label, type: text | number | date | select | textarea, value, options, maxlength, placeholder, list, half },
   * spec : { title, fields, ok, note, datalists, after(inputs), extra: { label, run(inputs) }, onSubmit(values) }.
   */
  ppm.forms = function (cfg) {
    var $ = cfg.$ || function (id) { return document.getElementById(id); };
    var state = cfg.state, el = ppm.el, clear = ppm.clear, closeDialog = cfg.closeDialog || ppm.closeDialog;

    function fillSelect(sel, options, value) {
      clear(sel);
      options.forEach(function (o) { sel.appendChild(el('option', { value: o.value, text: o.label })); });
      sel.value = value === undefined || value === null ? (options[0] ? options[0].value : '') : value;
    }

    function openForm(spec) {
      $('gf-title').textContent = spec.title;
      var body = $('gf-body'); clear(body);
      var inputs = {}, pending = null;
      var flush = function () { if (pending) { body.appendChild(el('div', { class: 'ed-row2' }, pending)); pending = null; } };
      spec.fields.forEach(function (f) {
        var c;
        if (f.type === 'select') { c = el('select', { id: 'gf-' + f.key }); fillSelect(c, f.options || [], f.value); }
        else if (f.type === 'textarea') { c = el('textarea', { id: 'gf-' + f.key, rows: '8' }); c.value = f.value || ''; }
        else {
          var a = { type: f.type || 'text', id: 'gf-' + f.key, autocomplete: 'off' };
          if (f.maxlength) a.maxlength = String(f.maxlength);
          if (f.placeholder) a.placeholder = f.placeholder;
          if (f.list) a.list = f.list;
          if (f.type === 'number') { a.min = '0'; a.step = 'any'; }
          c = el('input', a); c.value = f.value === undefined || f.value === null ? '' : f.value;
        }
        inputs[f.key] = c;
        var lab = el('label', { class: 'lbl' }, [f.label, c]);
        if (f.half) { pending = pending || []; pending.push(lab); if (pending.length === 2) flush(); } else { flush(); body.appendChild(lab); }
      });
      flush();
      (spec.datalists || []).forEach(function (d) { body.appendChild(el('datalist', { id: d.id }, d.values.map(function (v) { return el('option', { value: v }); }))); });
      if (spec.note) body.appendChild(el('p', { class: 'note', text: spec.note }));
      if (spec.after) spec.after(inputs);
      var extra = $('gf-extra');
      if (extra) { extra.hidden = !spec.extra; if (spec.extra) { extra.textContent = spec.extra.label; extra.onclick = function () { spec.extra.run(inputs); }; } }
      state.gform = { spec: spec, inputs: inputs };
      $('gf-error').hidden = true; $('gf-ok').textContent = spec.ok || 'Enregistrer'; $('gf-ok').disabled = false;
      ppm.openDialog($('genform'));
      var first = body.querySelector('input, select, textarea'); if (first) first.focus();
    }

    function submitForm() {
      var g = state.gform;
      if (!g) return;
      var values = {};
      Object.keys(g.inputs).forEach(function (k) { values[k] = g.inputs[k].value; });
      $('gf-ok').disabled = true;
      Promise.resolve().then(function () { return g.spec.onSubmit(values); }).then(function () { closeDialog($('genform')); }).catch(function (err) {
        $('gf-ok').disabled = false;
        var m = $('gf-error'); m.textContent = err && err.code === 'CONFLICT' ? 'Modifié entre-temps par quelqu’un d’autre : fermez, actualisez puis recommencez.' : ppmErrorText(err); m.hidden = false;
      });
    }

    function openConfirm(title, text, okLabel, action) {
      if (cfg.onConfirm) cfg.onConfirm();
      $('confirm-title').textContent = title; $('confirm-text').textContent = text;
      $('confirm-ok').textContent = okLabel; if (cfg.confirmClass) $('confirm-ok').className = cfg.confirmClass;
      $('confirm-error').hidden = true; $('confirm-ok').disabled = false;
      state.confirmAction = function () {
        $('confirm-ok').disabled = true;
        return action().then(function () { closeDialog($('confirm')); }).catch(function (err) {
          $('confirm-ok').disabled = false;
          var m = $('confirm-error'); m.textContent = ppmErrorText(err); m.hidden = false;
        });
      };
      ppm.openDialog($('confirm'));
    }

    return { fillSelect: fillSelect, openForm: openForm, submitForm: submitForm, openConfirm: openConfirm };
  };
})(window);
</script>

<script>
/* Éléments communs à toutes les pages : bannière, thème jour/nuit, données préchargées, fenêtres d'information. */
(function () {
  'use strict';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var root = document.documentElement;

  /** JSON à clés triées : même clé que celle calculée par le serveur (stableJson_). */
  function stable(v) {
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  }
  /** Réponse préparée avec la page, consommée une seule fois ; null si absente (la page fait alors l'appel). */
  window.ppmPreloaded = function (action, params, write) {
    var B = window.BOOT;
    if (write || !B || !B.preload) return null;
    var k = action + '|' + stable(params || {});
    if (!Object.prototype.hasOwnProperty.call(B.preload, k)) return null;
    var res = B.preload[k];
    delete B.preload[k];
    return res && res.ok ? Promise.resolve(res.data) : null;
  };

  /** Fenêtre d'information attachée à un bouton : ouverture, fermeture au clic extérieur et avec Échap. */
  window.ppmPopover = function (btn, pop) {
    var close = function () { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = pop.hidden;
      document.querySelectorAll('.popover').forEach(function (p) { if (p !== pop) p.hidden = true; });
      pop.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
    });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { close(); btn.focus(); } });
  };

  /** Message lisible pour une erreur du serveur : le détail des champs refusés quand il existe. */
  var FIELD_LABELS = { job_function: 'Fonction', organization: 'Organisation', name: 'Nom', email: 'Adresse', country: 'Pays', supplier: 'Fournisseur', capacity_days_month: 'Capacité' };
  window.ppmErrorText = function (err) {
    if (err && Array.isArray(err.details) && err.details.length) {
      return err.details.map(function (d) { return (FIELD_LABELS[d.field] || d.field) + ' : ' + d.issue; }).join(' ; ');
    }
    return (err && err.message) || 'Opération impossible.';
  };

  /** Applique un thème choisi ailleurs (page Mon compte) ; « auto » revient au réglage de l'ordinateur. */
  window.ppmSetTheme = function (mode) {
    if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
    applyClass();
    var b = document.getElementById('ppm-theme');
    if (b) paint(b);
    document.dispatchEvent(new CustomEvent('ppm-theme', { detail: mode }));
  };

  function applyClass() { root.classList.toggle('dark', effective() === 'dark'); }
  function effective() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paint(btn) {
    var dark = effective() === 'dark';
    btn.innerHTML = dark ? SUN : MOON;
    btn.title = dark ? 'Thème jour' : 'Thème nuit';
    btn.setAttribute('aria-label', btn.title);
  }

  (function early() {
    var t = root.getAttribute('data-theme');
    if (t !== 'dark' && t !== 'light') root.removeAttribute('data-theme');
    applyClass();
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () { if (!root.getAttribute('data-theme')) { applyClass(); var b = document.getElementById('ppm-theme'); if (b) paint(b); } };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
  })();

  function init() {
    var B = window.BOOT || {};
    var base = B.baseUrl || '';
    var btn = document.getElementById('ppm-theme');
    paint(btn);
    btn.addEventListener('click', function () {
      var next = effective() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      applyClass();
      paint(btn);
      document.dispatchEvent(new CustomEvent('ppm-theme', { detail: next }));
      try { google.script.run.withFailureHandler(function () {}).uiCall('ui.set', { theme: next }, null); } catch (e) { /* hors web app */ }
    });
    // Adresses par défaut (les pages qui ont un projet courant les complètent) ; l'administration n'est proposée qu'aux administrateurs.
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (a) {
      if (!a.getAttribute('href') || a.getAttribute('href') === '#') a.setAttribute('href', base + '?view=' + a.getAttribute('data-view'));
    });
    document.getElementById('ppm-admin').hidden = !B.isAdmin;
    document.getElementById('nav-budget').hidden = !B.canBudget;
    document.getElementById('nav-copilot').hidden = !B.copilot; // copilote en suspens tant que PPM_COPILOT n'est pas « oui »
    var EYEBROW = { overview: 'Overview · Projet', gantt: 'Planning · Gantt', structure: 'WBS · Découpage et rôles', ressources: 'Ressources · Équipes et rôles', suivi: 'Suivi · Baselines', actualites: 'Actualités · Réunions et actions', copilote: 'Copilote · Synthèse, simulation, questions et clé Gemini', budget: 'Budget · CPN et achats', compte: 'Mon compte', admin: 'Administration' };
    var titleBox = document.querySelector('header .title');
    if (titleBox && EYEBROW[B.view] && !titleBox.querySelector('.eyebrow')) {
      var eb = document.createElement('span');
      eb.className = 'eyebrow';
      eb.textContent = EYEBROW[B.view];
      titleBox.insertBefore(eb, titleBox.firstChild);
    }
    // Le projet courant suit d'une page à l'autre : dès qu'un lien de la bannière porte un projet (la page l'y a mis), les autres liens le reprennent.
    // Ainsi Overview, Ressources et Budget s'ouvrent sur le même projet que celui qu'on regarde, quelle que soit la page de départ.
    var SHARE = ['overview', 'gantt', 'structure', 'ressources', 'suivi', 'actualites', 'copilote', 'budget'];
    var navLinks = function () { return document.querySelectorAll('.ppm-nav a[data-view]'); };
    var propagating = false;
    function propagateProject() {
      if (propagating) return;
      propagating = true;
      var id = '';
      Array.prototype.forEach.call(navLinks(), function (a) { var m = /[?&]project=([^&]+)/.exec(a.getAttribute('href') || ''); if (m && !id) id = m[1]; });
      if (id) {
        Array.prototype.forEach.call(navLinks(), function (a) {
          var h = a.getAttribute('href') || '';
          if (SHARE.indexOf(a.getAttribute('data-view')) >= 0 && !/[?&]project=/.test(h)) a.setAttribute('href', h + (h.indexOf('?') >= 0 ? '&' : '?') + 'project=' + id);
        });
      }
      propagating = false;
    }
    var navBox = document.querySelector('.ppm-nav');
    if (navBox && window.MutationObserver) new MutationObserver(propagateProject).observe(navBox, { subtree: true, attributes: true, attributeFilter: ['href'] });
    propagateProject();

    var here = document.querySelector('.ppm-bar [data-view="' + (B.view || '') + '"]');
    if (here) here.setAttribute('aria-current', 'page');
    document.getElementById('ppm-brand').setAttribute('href', base + '?view=' + (B.home || 'overview'));
    if (B.logoUrl) {
      var img = document.getElementById('ppm-logo');
      img.src = B.logoUrl;
      img.alt = 'Airbus';
      img.hidden = false;
    }
    window.addEventListener('load', function () {
      if (window.console && B.version) console.info('PPM ' + B.version + ' : données préparées en ' + (B.serverMs || 0) + ' ms, page prête en ' + Math.round(performance.now()) + ' ms');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, openDialog = ppm.openDialog, closeDialog = ppm.closeDialog;

  var state = { data: null, projectId: '', team: '', catalog: null, seq: 0, showAllTeams: false };
  var $ = function (id) { return document.getElementById(id); };
  var COUNTRY_LIST = [['FR', 'France'], ['DE', 'Allemagne'], ['UK', 'Royaume-Uni'], ['IN', 'Inde']];

  // ------------------------------------------------------------ outils
  function fail(e) { toast(ppmErrorText(e), true); }

  // ------------------------------------------------------------ formulaire générique et confirmation
  var forms = ppm.forms({ $: $, state: state });
  var fillSelect = forms.fillSelect, openForm = forms.openForm, submitForm = forms.submitForm, openConfirm = forms.openConfirm;

  // ------------------------------------------------------------ chargement et rendu
  function load() {
    var ticket = ++state.seq;
    return call('ressources.get', { projectId: state.projectId }).then(function (d) {
      if (ticket !== state.seq) return;
      state.data = d; render();
    }).catch(function (e) { var p = $('people'); clear(p); p.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Chargement impossible.' }), el('span', { text: (e && e.message) || 'Erreur inconnue.' })])); });
  }

  /**
   * Les équipes affichées à droite : celles qui ont au moins un membre qui participe au projet (avec leurs parents, en grisé) ; « Toutes les équipes » les montre toutes. Les FORMULAIRES
   * (attribuer une équipe à une personne, choisir l'équipe parente) proposent toujours TOUTES les équipes existantes, importées ou créées à la main.
   */
  function shownTeams() { var d = state.data; return d.teamsMode === 'project' && !state.showAllTeams ? d.teams : d.allTeams; }
  function teamOptions(emptyLabel) {
    return [{ value: '', label: emptyLabel }].concat(state.data.allTeams.map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; }));
  }

  function visiblePeople() {
    var q = $('res-search').value.trim().toLowerCase(), type = $('type-filter').value, team = state.team;
    return state.data.people.filter(function (p) {
      if (type && p.resource_type !== type) return false;
      if (team === '__none') { if (p.team_id) return false; } else if (team && p.team_id !== team) return false;
      return !q || (p.name + ' ' + p.job_function + ' ' + p.organization + ' ' + p.supplier).toLowerCase().indexOf(q) >= 0;
    });
  }

  /** Peut-elle se connecter ? Il faut une adresse e-mail dans un domaine autorisé ; le rôle dit ensuite ce qu'elle peut faire. */
  function accessBadge(p) {
    var d = state.data;
    if (p.access === 'ok') return el('span', { class: 'badge ok', text: 'Peut se connecter', title: p.email });
    if (p.access === 'outside') return el('span', { class: 'badge warn', text: 'Hors domaine', title: p.email + ' : hors des domaines autorisés (' + d.domains.join(', ') + ')' });
    return el('span', { class: 'badge warn', text: 'Sans adresse', title: 'Sans adresse e-mail professionnelle, la personne figure dans les listes mais ne peut pas se connecter.' });
  }

  /** Livrables et jalons dont la personne est responsable, et ce à quoi elle contribue sans en être responsable. */
  function deliverablesCell(p) {
    var own = (p.deliverables || 0) + (p.milestones || 0);
    if (!own && !p.contributes) return el('span', { class: 'muted', text: '—' });
    var detail = [];
    if (p.deliverables) detail.push(p.deliverables + (p.deliverables > 1 ? ' livrables' : ' livrable'));
    if (p.milestones) detail.push(p.milestones + (p.milestones > 1 ? ' jalons' : ' jalon'));
    if (p.contributes) detail.push('contribue à ' + p.contributes);
    return el('div', {}, [el('strong', { class: 'deliv-n', text: String(own) }), el('small', { text: detail.join(' · ') })]);
  }

  /** Les rôles d'une personne dans ce projet, en lecture seule : ils se posent sur chaque objet, dans le WBS. Sans aucun rôle : Reader. */
  function rolesCell(p) {
    if (!p.roles.length) return el('span', {}, [el('span', { class: 'badge', title: 'Rôle par défaut : lit tout, ne modifie rien. Un rôle se pose dans le WBS, sur l’objet concerné.', text: 'Reader' }), ' ']);
    return el('span', { text: p.roles.map(function (r) { return r.label + (r.scope ? ' (' + r.scope + ')' : ''); }).join(', ') });
  }

  function render() {
    var d = state.data;
    $('title').textContent = d.project ? 'Ressources de ' + d.project.name : 'Ressources';
    $('context').textContent = d.project ? d.project.code : '';
    $('person-add').hidden = !d.canEdit; $('team-add').hidden = !d.canEdit; $('teams-import').hidden = !d.canEdit;
    $('teams-all-row').hidden = d.teamsMode !== 'project'; $('teams-all').checked = state.showAllTeams;
    var shown = shownTeams();
    if (state.team && state.team !== '__none' && !shown.some(function (t) { return t.id === state.team; })) state.team = '';
    var tf = $('team-filter'), cur = state.team;
    fillSelect(tf, [{ value: '', label: 'Toutes les équipes' }, { value: '__none', label: 'Sans équipe' }].concat(shown.map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; })), cur);
    var rows = visiblePeople();
    $('count').textContent = plural(rows.length, 'personne', 'personnes');
    var host = $('people'); clear(host);
    if (!rows.length) host.appendChild(el('div', { class: 'empty' }, [el('strong', { text: d.people.length ? 'Aucune personne ne correspond.' : 'Aucune personne pour l’instant.' }), el('span', { text: d.canEdit && !d.people.length ? 'Ajoutez la première avec « Ajouter une personne ».' : '' })]));
    else {
      var head = ['Nom', 'Statut et accès', 'Équipe', 'Livrables', 'Rôles'];
      if (d.canEdit) head.push('');
      host.appendChild(el('div', { class: 'table-wrap' }, [el('table', { id: 'res-table' }, [
        el('thead', {}, [el('tr', {}, head.map(function (h, i) { return el('th', { scope: 'col', class: (h === '' ? ' sticky-r' : ''), text: h }); }))]),
        el('tbody', {}, rows.map(function (p) {
          var cells = [
            el('td', {}, [p.name, el('small', { text: [p.job_function, p.resource_type === 'Externe' ? (p.supplier || p.organization) : p.organization].filter(Boolean).join(' · ') || ' ' })]),
            el('td', {}, [el('div', { class: 'stack' }, [el('span', { class: 'badge' + (p.resource_type === 'Externe' ? ' ext' : ''), text: p.resource_type }), accessBadge(p)])]),
            el('td', { text: p.team || '—' }), el('td', { class: 'deliv' }, [deliverablesCell(p)]),
            el('td', {}, [rolesCell(p), p.unplaced ? el('a', { href: (BOOT.baseUrl || '') + '?view=structure&project=' + state.projectId, title: 'Aucun rôle pour l’instant : un rôle se pose dans le WBS', text: 'poser un rôle' }) : null])
          ];
          if (d.canEdit) cells.push(el('td', { class: 'sticky-r' }, [el('div', { class: 'actions-cell' }, [
            el('button', { type: 'button', class: 'btn person-edit', 'data-id': p.resource_id, text: 'Modifier', onclick: function () { openPersonForm(p); } }),
            el('button', { type: 'button', class: 'btn person-remove', 'data-id': p.resource_id, text: 'Retirer', onclick: function () { removePerson(p); } })])]));
          return el('tr', { 'data-id': p.resource_id }, cells);
        }))])]));
    }
    $('people-note').textContent = 'Pour qu’une personne intervienne : une fiche avec son adresse e-mail professionnelle (créée ici, et seulement ici), puis des rôles posés dans la page WBS. Il n’y a plus de taux journalier : le budget se saisit par équipe (page Budget) et se convertit en jours avec le coût d’un ETP du pays de l’équipe, paramétré par l’administrateur.';
    var tl = $('teams-list'); clear(tl);
    if (!shown.length) tl.appendChild(el('li', {}, [el('span', { class: 'muted', id: 'teams-empty', text: d.teamsMode === 'project' && !state.showAllTeams ? 'Aucune équipe : aucun membre d’une équipe ne participe encore à ce projet.' : 'Aucune équipe.' })]));
    // arbre imbriqué : l'équipe de profondeur k est rangée sous la dernière équipe de profondeur k − 1 (l'ordre du serveur est celui de l'arborescence)
    var stack = [];
    shown.forEach(function (t) {
      var card = el('div', { class: 'team-card' + (state.team === t.id ? ' on' : '') + (t.manager ? '' : ' noboss') + (d.teamsMode === 'project' && !state.showAllTeams && t.context ? ' ctx' : ''), title: t.context && !state.showAllTeams && d.teamsMode === 'project' ? 'Équipe parente : aucun de ses membres directs ne participe à ce projet' : (t.manager ? '' : 'Équipe sans responsable') }, [
        el('button', { type: 'button', class: 't-name', 'aria-pressed': String(state.team === t.id), text: t.name, onclick: function () { state.team = state.team === t.id ? '' : t.id; render(); } }),
        el('small', { text: plural(t.members, 'membre', 'membres') + (d.teamsMode === 'project' && t.participants ? ' · ' + t.participants + ' au projet' : '') + (t.manager ? ' · ' + t.manager : '') + (t.cost_center ? ' · ' + t.cost_center : '') })]);
      if (d.canEdit) card.appendChild(el('div', { class: 't-actions' }, [
        el('button', { type: 'button', class: 'btn team-edit', text: 'Modifier', onclick: function () { openTeamForm(t, null); } }),
        el('button', { type: 'button', class: 'btn team-sub', text: 'Sous-équipe', onclick: function () { openTeamForm(null, t); } }),
        el('button', { type: 'button', class: 'btn team-del', text: 'Supprimer', onclick: function () { deleteTeam(t); } })]));
      var li = el('li', { 'data-team': t.id, 'data-depth': String(t.depth) }, [card]);
      while (stack.length > t.depth) stack.pop();
      (stack.length ? stack[stack.length - 1] : tl).appendChild(li);
      var kids = el('ul', {}); li.appendChild(kids); stack.push(kids);
    });
    Array.prototype.forEach.call(tl.querySelectorAll('ul:empty'), function (u) { u.parentNode.removeChild(u); });
    $('teams-note').textContent = (d.teamsMode === 'project' ? 'Les équipes dont au moins un membre participe à ce projet' + (state.showAllTeams ? ' (toutes les équipes sont affichées).' : ' ; cochez « Toutes les équipes » pour voir les autres.') + ' ' : '') + (d.canEdit ? 'Cliquez sur une équipe pour filtrer les personnes. Une équipe ne se supprime que vide.' : '');
    try { google.script.history.replace(null, { view: 'ressources', project: state.projectId }); } catch (e) { /* hors web app */ }
    var base = BOOT.baseUrl || '';
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (n) {
      var vw = n.getAttribute('data-view');
      if (state.projectId && ['overview', 'gantt', 'structure', 'ressources', 'suivi', 'copilote', 'budget'].indexOf(vw) >= 0) n.setAttribute('href', base + '?view=' + vw + '&project=' + state.projectId);
    });
  }

  // ------------------------------------------------------------ personnes
  function openPersonForm(p) {
    var d = state.data, create = !p;
    p = p || {};
    var fields = [
      { key: 'name', label: 'Nom', value: p.name, maxlength: 120 },
      { key: 'resource_type', label: 'Statut', type: 'select', value: p.resource_type || 'Interne', options: [{ value: 'Interne', label: 'Interne' }, { value: 'Externe', label: 'Externe' }], half: true },
      { key: 'country', label: 'Pays', type: 'select', value: p.country || '', options: [{ value: '', label: '—' }].concat(COUNTRY_LIST.map(function (c) { return { value: c[0], label: c[1] }; })), half: true },
      { key: 'job_function', label: 'Fonction', value: p.job_function, maxlength: 80, half: true },
      { key: 'organization', label: 'Organisation', value: p.organization, maxlength: 80, half: true },
      { key: 'supplier', label: 'Fournisseur (si externe)', value: p.supplier, maxlength: 80, half: true },
      { key: 'team_id', label: 'Équipe', type: 'select', value: p.team_id || '', options: teamOptions('Aucune'), half: true }
    ];
    if (create) fields.splice(1, 0, { key: 'email', label: 'Adresse e-mail (facultative)', value: '', maxlength: 120 });
    openForm({
      title: create ? 'Ajouter une personne' : 'Modifier ' + p.name, ok: create ? 'Ajouter' : 'Enregistrer',
      note: create ? 'L’adresse e-mail professionnelle (domaine : ' + d.domains.join(', ') + ') donne accès à l’outil. Sans rôle, la personne est Reader : elle lit tout et ne modifie rien. Ses rôles se posent ensuite dans la page WBS, sur chaque objet.' : 'L’adresse e-mail ne se modifie que par l’administrateur.',
      fields: fields,
      onSubmit: function (v) {
        var values = { name: v.name, resource_type: v.resource_type, country: v.country, job_function: v.job_function, organization: v.organization, supplier: v.supplier, team_id: v.team_id };
        var req;
        if (create) { if (v.email.trim()) values.email = v.email.trim(); req = call('resources.create', { values: values }, true); }
        else req = call('resources.update', { id: p.resource_id, version: p.version, patch: values }, true);
        return req.then(function () { toast(create ? 'Personne ajoutée.' : 'Fiche enregistrée.'); return load(); });
      }
    });
  }

  function removePerson(p) {
    call('people.remove', { id: p.resource_id, dryRun: true }).then(function (s) {
      var parts = [];
      if (s.roles) parts.push(plural(s.roles, 'rôle terminé', 'rôles terminés'));
      if (s.teams) parts.push(plural(s.teams, 'équipe sans responsable', 'équipes sans responsable'));
      if (s.wps) parts.push(plural(s.wps, 'workpackage', 'workpackages') + ' à réattribuer');
      if (s.items) parts.push(plural(s.items, 'livrable ou jalon', 'livrables et jalons') + ' à réattribuer');
      openConfirm('Retirer ' + s.name + ' ?', s.name + ' ne sera plus dans les listes' + (parts.length ? ' : ' + parts.join(', ') : '') + '. La fiche reste dans l’historique.', 'Retirer', function () {
        return call('people.remove', { id: p.resource_id, version: p.version }, true).then(function () { toast(s.name + ' retiré(e).'); return load(); });
      });
    }).catch(fail);
  }

  // ------------------------------------------------------------ équipes
  function openTeamForm(team, parent) {
    var d = state.data, create = !team;
    openForm({
      title: create ? (parent ? 'Nouvelle sous-équipe de « ' + parent.name + ' »' : 'Nouvelle équipe') : 'Modifier l’équipe', ok: create ? 'Créer' : 'Enregistrer',
      fields: [
        { key: 'name', label: 'Nom', value: team ? team.name : '', maxlength: 80 },
        { key: 'parent_team_id', label: 'Équipe parente', type: 'select', value: team ? team.parent_team_id : (parent ? parent.id : ''),
          options: [{ value: '', label: 'Aucune (racine)' }].concat(d.allTeams.filter(function (t) { return !team || t.id !== team.id; }).map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; })) },
        { key: 'manager_resource_id', label: 'Responsable', type: 'select', value: team ? team.manager_id : '', options: [{ value: '', label: '—' }].concat(d.people.filter(function (p) { return p.resource_type === 'Interne'; }).map(function (p) { return { value: p.resource_id, label: p.name }; })) },
        { key: 'cost_center', label: 'Centre de coût', value: team ? team.cost_center : '', maxlength: 40, half: true },
        { key: 'country', label: 'Pays (conversion en jours)', type: 'select', value: team ? (team.country || '') : '', options: [{ value: '', label: 'France (par défaut)' }].concat(d.countries.map(function (c) { return { value: c, label: c }; })), half: true }
      ],
      onSubmit: function (v) {
        var req = create ? call('teams.create', { values: v }, true) : call('teams.update', { id: team.id, version: team.version, patch: v }, true);
        return req.then(function () {
          if (create && state.data.teamsMode === 'project') state.showAllTeams = true;   // une équipe toute neuve n'a encore aucun participant : on affiche toutes les équipes pour la voir
          toast(create ? 'Équipe créée.' + (state.data.teamsMode === 'project' ? ' Elle apparaîtra parmi les équipes du projet quand un de ses membres y participera.' : '') : 'Équipe enregistrée.'); return load();
        });
      }
    });
  }
  function deleteTeam(t) {
    openConfirm('Supprimer l’équipe ?', 'L’équipe « ' + t.name + ' » sera supprimée. Elle doit être vide : ni membres ni sous-équipes.', 'Supprimer', function () {
      return call('teams.delete', { id: t.id, version: t.version }, true).then(function () { toast('Équipe supprimée.'); if (state.team === t.id) state.team = ''; return load(); });
    });
  }

  // ------------------------------------------------------------ importer la structure des équipes (classeur Google Sheet dédié)
  /**
   * Les équipes sont communes à tous les projets : on les décrit une fois dans un classeur à part. (1) créer le classeur modèle, prérempli avec les équipes actuelles (c'est aussi un export) ;
   * (2) coller le lien du classeur rempli et « Analyser » (un rapport, rien n'est écrit) ; (3) « Importer », seulement sans erreur, par lots. Rien n'est supprimé ni écrasé.
   */
  var timp = { report: null, book: '', busy: false, backup: null };
  function timpBusy(on, msg) {
    timp.busy = on;
    ['timp-template', 'timp-analyze', 'timp-run'].forEach(function (id) { var b = $(id); if (b) b.disabled = on || (id === 'timp-run' && !(timp.report && timp.report.ok && !timp.report.nothing_to_do)); });
    var st = $('timp-status'); if (st) st.textContent = msg || '';
  }
  function timpCounts(c) {
    var t = c.teams, m = c.members;
    return [t.create + t.update + t.same ? 'Équipes : ' + t.create + ' à créer, ' + t.update + ' à compléter, ' + t.same + ' inchangée' + (t.same > 1 ? 's' : '') : '',
      m.create + m.assign + m.same ? 'Personnes : ' + m.create + ' à créer, ' + m.assign + ' à rattacher à leur équipe, ' + m.same + ' déjà en place' : ''].filter(Boolean);
  }
  function timpRender() {
    var box = $('timp-report'), rep = timp.report;
    clear(box);
    if (!rep) return;
    box.appendChild(el('p', { class: 'imp-head ' + (rep.ok ? 'ok' : 'bad'), id: 'timp-head', role: 'status', text: rep.ok ? (rep.nothing_to_do ? 'Rien à importer : le classeur correspond déjà aux équipes de l’outil.' : 'Analyse sans erreur : voici ce qui sera fait.') : 'Le classeur a ' + rep.errors_count + (rep.errors_count > 1 ? ' erreurs' : ' erreur') + ' : corrigez-les dans le classeur, puis relancez « Analyser ». Rien n’a été écrit.' }));
    if (rep.ok) box.appendChild(el('ul', { class: 'imp-counts', id: 'timp-counts' }, timpCounts(rep.counts).map(function (t) { return el('li', { text: t }); })));
    var list = function (title, items, id) {
      if (!items.length) return;
      box.appendChild(el('h3', { class: 'imp-sub', text: title }));
      box.appendChild(el('ul', { class: 'imp-list', id: id }, items.map(function (x) { return el('li', {}, [el('strong', { text: x.tab + (x.row ? ', ligne ' + x.row : '') + ' — ' }), x.message]); })));
    };
    list('Erreurs (' + rep.errors_count + ')', rep.errors, 'timp-errors');
    list('À savoir (' + rep.warnings_count + ')', rep.warnings, 'timp-warnings');
  }
  function timpReset() { timp.report = null; timpRender(); timpBusy(false, ''); }
  function openTeamImport() {
    timp.report = null; timp.book = ''; timp.backup = null;
    var body = $('timp-body'); clear(body);
    body.appendChild(el('p', { class: 'note', text: 'Les équipes sont communes à tous les projets : décrivez-les une fois dans un classeur Google Sheet (onglet Équipes : la structure ; onglet Membres : qui est dans quelle équipe). L’import crée ce qui manque, ne supprime rien et n’écrase rien ; il enregistre une copie de sécurité avant de modifier des équipes ou des personnes existantes.' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '1. Le classeur modèle' }),
      el('p', { class: 'note', text: 'Créé dans Drive et partagé avec vous, prérempli avec les équipes actuelles : c’est aussi un export.' }),
      el('button', { type: 'button', class: 'btn', id: 'timp-template', text: 'Créer le classeur modèle', onclick: timpTemplate }), el('div', { id: 'timp-template-out' })]));
    var input = el('input', { type: 'text', id: 'timp-book', placeholder: 'https://docs.google.com/spreadsheets/d/…', autocomplete: 'off', 'aria-label': 'Lien du classeur à importer' });
    input.addEventListener('input', function () { timp.book = input.value; timpReset(); });
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '2. Analyser' }), el('label', { class: 'lbl' }, ['Lien du classeur rempli', input]),
      el('button', { type: 'button', class: 'btn', id: 'timp-analyze', text: 'Analyser', onclick: timpAnalyze })]));
    body.appendChild(el('div', { id: 'timp-report' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '3. Importer' }),
      el('button', { type: 'button', class: 'btn primary', id: 'timp-run', text: 'Importer', disabled: true, onclick: timpRun }),
      el('span', { class: 'note', id: 'timp-status', role: 'status', 'aria-live': 'polite' }), el('div', { id: 'timp-backup' })]));
    openDialog($('timp'));
  }
  function timpError(e) { timpBusy(false, ''); toast(ppmErrorText(e), true); }
  function timpTemplate() {
    timpBusy(true, 'Création du classeur…');
    call('teams.import.template', {}, true).then(function (t) {
      timp.book = t.url; $('timp-book').value = t.url;
      var out = $('timp-template-out'); clear(out);
      out.appendChild(el('p', {}, [el('a', { href: t.url, target: '_blank', rel: 'noopener', id: 'timp-template-link', text: 'Ouvrir « ' + t.name + ' »' }), ' — ' + plural(t.prefilled.equipes, 'équipe', 'équipes') + ', ' + plural(t.prefilled.membres, 'membre', 'membres') + '.']));
      (t.warnings || []).forEach(function (w) { out.appendChild(el('p', { class: 'note', text: w })); });
      timpBusy(false, '');
    }).catch(timpError);
  }
  function timpAnalyze() {
    if (!String(timp.book || '').trim()) { toast('Collez d’abord le lien du classeur.', true); return; }
    timpBusy(true, 'Analyse…');
    call('teams.import.analyze', { book: timp.book }).then(function (rep) { timp.report = rep; timpRender(); timpBusy(false, ''); }).catch(timpError);
  }
  function timpRun() {
    if (!timp.report || !timp.report.ok) return;
    var lot = 0, total = null;
    var next = function () {
      lot++;
      timpBusy(true, 'Import en cours — lot ' + lot + (total === null ? '' : ', reste ' + total + ' opération(s)') + '…');
      return call('teams.import.run', { book: timp.book, resume: lot > 1 }, true).then(function (r) {
        if (r.backup) { timp.backup = r.backup; var b = $('timp-backup'); clear(b); b.appendChild(el('p', { class: 'note' }, ['Copie de sécurité enregistrée avant l’import : ', el('a', { href: r.backup.url, target: '_blank', rel: 'noopener', id: 'timp-backup-link', text: r.backup.name })])); }
        total = r.remaining;
        if (r.done) return r;
        if (lot >= 60) throw new Error('Import interrompu après 60 lots : relancez-le pour continuer.');
        return next();
      });
    };
    next().then(function () {
      timp.report = null; timpRender(); timpBusy(false, 'Import terminé.'); $('timp-run').disabled = true;
      toast('Structure des équipes importée.');
      return load();
    }).catch(timpError);
  }

  // ------------------------------------------------------------ démarrage
  $('res-search').addEventListener('input', function () { render(); });
  $('type-filter').addEventListener('change', function () { render(); });
  $('team-filter').addEventListener('change', function () { state.team = this.value; render(); });
  $('picker').addEventListener('change', function () { state.projectId = this.value; load(); });
  $('person-add').addEventListener('click', function () { openPersonForm(null); });
  $('team-add').addEventListener('click', function () { openTeamForm(null, null); });
  $('teams-import').addEventListener('click', openTeamImport);
  $('timp-close').addEventListener('click', function () { closeDialog($('timp')); });
  $('teams-all').addEventListener('change', function () { state.showAllTeams = this.checked; render(); });
  $('gf-form').addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  $('gf-cancel').addEventListener('click', function () { closeDialog($('genform')); });
  $('confirm-cancel').addEventListener('click', function () { closeDialog($('confirm')); });
  $('confirm-ok').addEventListener('click', function () { if (state.confirmAction) state.confirmAction(); });

  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var sel = $('picker'); clear(sel);
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    cat.projects.slice().sort(sortCode).forEach(function (p) { sel.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
    state.projectId = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id || '';
    sel.value = state.projectId;
    return load();
  }).catch(function (e) { $('people').appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Chargement impossible.' }), el('span', { text: (e && e.message) || '' })])); });

  window.__ppm = { state: state };
})();
</script>
</body>
