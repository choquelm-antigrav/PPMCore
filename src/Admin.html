<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.19.0">
<?!= include('Style') ?>
<?!= include('Common') ?>
<style>
  .box { margin: 0 0 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel { padding: 8px 24px 32px; max-width: 1100px; }
  .box h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
  .form { display: grid; gap: 12px; max-width: 560px; }
  .grp { display: grid; gap: 12px; margin: 0; padding: 0; border: 0; min-width: 0; }
  .grp h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .grp + .grp { padding-top: 16px; border-top: 1px solid var(--rule); }
  /* réglages sur toute la largeur : les groupes de champs se disposent en colonnes, l'erreur et le bouton restent sur toute la largeur */
  #panel-reglages .form { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px 32px; align-items: start; }
  #panel-reglages .form > .grp + .grp { padding-top: 0; border-top: 0; }
  #panel-reglages .form > .late, #panel-reglages .form > .row { grid-column: 1 / -1; }
  .form label.lbl { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .form input[type=text], .form input[type=password], .form input[type=number], .form textarea, .editor textarea, .inline input {
    padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink); background: var(--surface); }
  .form textarea { min-height: 84px; resize: vertical; font-family: inherit; }
  .opt { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .readonly { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .readonly dd { overflow-wrap: anywhere; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
  .card.ok .v { color: var(--green); }
  .checks { margin: 0 0 16px; padding-left: 20px; }
  .checks li { margin: 4px 0; color: var(--alert-ink); }
  .editor { margin-top: 16px; }
  .editor textarea { width: 100%; min-height: 220px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  @media (max-width: 700px) { .panel { padding: 8px 12px 24px; } .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } }
  /* export et import de projets */
  #cell-donnees, #panel-donnees { min-width: 0; max-width: 100%; }
  .pf-step { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; }
  .pf-group { margin: 8px 0 10px; }
  .pf-program { display: block; margin-bottom: 4px; }
  .pf-project { display: block; margin: 2px 0 2px 24px; font-size: 14px; }
  .pf-head.ok { color: var(--ok-ink); font-weight: 600; } .pf-head.bad { color: var(--alert-ink); font-weight: 600; }
  .pf-counts { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }
  .pf-list { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; max-height: 240px; overflow: auto; }
  .pf-list.bad li::marker { color: var(--alert-ink); } .pf-list.warn li::marker { color: var(--warn-ink); }
  #panel-donnees input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  /* tableau des droits par niveau */
  #cell-droits, #panel-droits { min-width: 0; max-width: 100%; }   /* le tableau défile dans son cadre au lieu d'élargir la page (téléphone) */
  #panel-droits .table-wrap { max-width: 100%; }
  @media (max-width: 600px) { #rights-table td.right-name { min-width: 150px; font-size: 13.5px; } #rights-table th.lvl, #rights-table td.lvl { width: 48px; } }
  #rights-table { border-collapse: separate; border-spacing: 0; min-width: 760px; width: 100%; }
  #rights-table th.lvl, #rights-table td.lvl { text-align: center; width: 64px; white-space: nowrap; position: relative; }   /* relative : le texte caché « oui/non » reste dans sa cellule, donc dans le cadre qui défile */
  #rights-table td.right-name { min-width: 280px; }
  #rights-table td.right-name small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  #rights-table tr.grp th { text-align: left; background: var(--tint); color: var(--ink); font-size: 13px; letter-spacing: .3px; padding: 6px 12px; }
  #rights-table td.yes { color: var(--ok-ink); background: var(--ok-bg); font-weight: 700; }
  #rights-table td.no { color: var(--muted); }
  #rights-table th.right-name, #rights-table td.right-name { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  #rights-table tr.grp th { position: static; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #panel-droits .lbl input { display: block; margin-top: 4px; width: min(420px, 100%); padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  #panel-droits h3.sub { margin: 18px 0 6px; font-size: 15px; }
  #panel-droits ul.rules { margin: 4px 0 0; padding-left: 20px; font-size: 14px; max-width: 90ch; }
  #panel-droits ul.rules li { margin: 3px 0; }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title"><h1 id="title">Administration</h1></div>
</header>

<main class="zones" style="--cell-min: 460px; --max-cols: 2">
  <div class="cell wide" id="cell-reglages">
    <div class="zone" id="zone-reglages"><h2 class="sec">Réglages</h2></div>
    <section class="panel" id="panel-reglages" aria-label="Réglages"></section>
  </div>
  <div class="cell" id="cell-sante">
    <div class="zone" id="zone-sante"><h2 class="sec">Santé de l’installation</h2></div>
    <section class="panel" id="panel-sante" aria-label="Santé"></section>
  </div>
  <div class="cell" id="cell-feries">
    <div class="zone" id="zone-feries"><h2 class="sec">Jours fériés</h2></div>
    <section class="panel" id="panel-feries" aria-label="Jours fériés"></section>
  </div>
  <div class="cell wide" id="cell-budget">
    <div class="zone" id="zone-budget"><h2 class="sec">Budget : exercices et coût d’un ETP</h2></div>
    <section class="panel" id="panel-budget" aria-label="Budget : exercices et coût d’un ETP"></section>
  </div>
  <div class="cell wide" id="cell-donnees">
    <div class="zone" id="zone-donnees"><h2 class="sec">Projets : export et import</h2></div>
    <section class="panel" id="panel-donnees" aria-label="Projets : export et import"></section>
  </div>
  <div class="cell wide" id="cell-droits">
    <div class="zone" id="zone-droits"><h2 class="sec">Droits par niveau</h2></div>
    <section class="panel" id="panel-droits" aria-label="Droits par niveau"></section>
  </div>
  <div class="cell wide" id="cell-journaux">
    <div class="zone" id="zone-journaux"><h2 class="sec">Journaux</h2></div>
    <section class="panel" id="panel-journaux" aria-label="Journaux"></section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, frDate = ppm.frDate;

  var state = { cfg: null, health: null, holidays: null, budget: null, confirm: '', logs: null, rights: null, catalog: null, pf: { book: '', report: null, busy: false, backup: null }, editing: '' };
  var $ = function (id) { return document.getElementById(id); };
  var COUNTRY_NAMES = { FR: 'France', DE: 'Allemagne', UK: 'Royaume-Uni', IN: 'Inde' };
  var STEP_LABELS = { reconcile: 'Réconciliation du journal', rules: 'Moteur de règles', workspace: 'Agenda et Drive', directory: 'Annuaire', backup: 'Sauvegarde des classeurs' };
  var MODES = [['off', 'Désactivé'], ['manual', 'Texte à coller dans Gemini'], ['api', 'Gemini : clé personnelle de chaque compte (accord de la DSI requis)']];

  // ------------------------------------------------------------ outils
  function loading(p) { clear(p); p.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(p, title, text) { clear(p); p.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text || '' })])); }
  function frDateTime(s) {
    if (!s) return '—';
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    var z = function (n) { return (n < 10 ? '0' : '') + n; };
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function seconds(ms) { return ms < 1000 ? '< 1 s' : Math.round(ms / 100) / 10 + ' s'; }
  function box(title, children) { return el('div', { class: 'box' }, [el('h2', { text: title })].concat(children)); }
  function card(k, v, s, tone) { return el('div', { class: 'card' + (tone ? ' ' + tone : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]); }
  function table(head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { return el('th', { scope: 'col', text: h }); }))]), el('tbody', {}, rows)])]);
  }
  function field(label, input) { return el('label', { class: 'lbl' }, [label, input]); }

  // ------------------------------------------------------------ navigation
  /** Plus d'onglets : toutes les rubriques se chargent et s'affichent ensemble. */
  function render() {
    renderSettings();
    loadHealth();
    loadHolidays();
    loadBudgetParams();
    loadPortfolio();
    loadRights();
    loadLogs();
  }
  function failed(p, e) { empty(p, 'Chargement impossible.', (e && e.message) || 'Erreur inconnue.'); }

  // ------------------------------------------------------------ Réglages
  function renderSettings() {
    var panel = $('panel-reglages'), c = state.cfg;
    clear(panel);
    var admins = el('textarea', { id: 'f-admins', 'aria-label': 'Administrateurs' });
    admins.value = c.admins.join('\n');
    var mode = el('select', { id: 'f-mode', 'aria-label': 'Mode du copilote' }, MODES.map(function (m) { return el('option', { value: m[0], text: m[1] }); }));
    mode.value = c.ai_mode;
    var model = el('input', { type: 'text', id: 'f-model', maxlength: '80', value: c.ai_model, placeholder: 'nom du modèle validé' });
    var quota = el('input', { type: 'number', id: 'f-quota', min: '1', max: '500', step: '1', value: String(c.ai_quota) });
    var protectOn = el('input', { type: 'checkbox', id: 'f-sheet-protect' });
    protectOn.checked = !!c.sheet_protect;
    var sheetOn = el('input', { type: 'checkbox', id: 'f-sheet-share' });
    sheetOn.checked = !!c.sheet_share;
    var copilotOn = el('input', { type: 'checkbox', id: 'f-copilot' });
    copilotOn.checked = !!c.copilot_enabled;
    var remOn = el('input', { type: 'checkbox', id: 'f-reminder-on' });
    remOn.checked = !!c.reminder_on;
    var remDays = el('input', { type: 'number', id: 'f-reminder-days', min: '1', max: '60', step: '1', value: String(c.reminder_days) });
    var initialDomains = String(c.domain || '');
    var domainsInput = el('input', { type: 'text', id: 'f-domains', 'aria-label': 'Domaines autorisés', autocomplete: 'off' });
    domainsInput.value = initialDomains;
    var appsheet = el('input', { type: 'text', id: 'f-appsheet', value: c.appsheet_url, placeholder: 'https://…' });
    var logo = el('input', { type: 'text', id: 'f-logo', value: c.logo_url, placeholder: 'https://… (logo officiel, portail de marque)' });
    var folder = el('input', { type: 'text', id: 'f-folder', value: c.projects_folder_id, placeholder: 'identifiant du dossier Drive' });
    var save = el('button', { type: 'submit', class: 'btn primary', id: 'save-cfg', text: 'Enregistrer les réglages' });
    var form = el('form', { class: 'form', onsubmit: function (e) {
      e.preventDefault();
      var values = {
        admins: admins.value.split(/[\s,;]+/).filter(Boolean), ai_mode: mode.value, ai_model: model.value, ai_quota: Number(quota.value),
        appsheet_url: appsheet.value, logo_url: logo.value, projects_folder_id: folder.value,
        reminder_on: remOn.checked, reminder_days: Number(remDays.value), copilot_enabled: copilotOn.checked, sheet_share: sheetOn.checked, sheet_protect: protectOn.checked
      };
      if (domainsInput.value.trim() !== initialDomains.trim()) values.domains = domainsInput.value;
      save.disabled = true;
      call('admin.set', { values: values }, true).then(function (r) {
        state.cfg = r;
        toast(r.changed.length ? plural(r.changed.length, 'réglage enregistré', 'réglages enregistrés') + '.' : 'Aucun changement.');
        renderSettings();
      }).catch(function (err) {
        save.disabled = false;
        var m = $('cfg-error'); m.textContent = err.message || 'Enregistrement impossible.'; m.hidden = false;
        toast(err.message || 'Enregistrement impossible.', true);
      });
    } }, [
      el('p', { class: 'late', id: 'cfg-error', role: 'alert', hidden: 'hidden' }),
      el('section', { class: 'grp' }, [el('h3', { text: 'Classeur de données (Google Sheets)' }),
        c.sheet_url ? el('p', {}, [el('a', { id: 'sheet-link', href: c.sheet_url, target: '_blank', rel: 'noopener noreferrer', text: 'Ouvrir le classeur Google Sheets ↗' })]) : el('p', { class: 'note', id: 'sheet-missing', text: 'Classeur introuvable : exécutez A1_INSTALLER_PPM.' }),
        el('label', { class: 'opt' }, [sheetOn, el('span', { text: 'Partager le classeur, en modification, avec toutes les personnes invitées' })]),
        el('p', { class: 'note', id: 'sheet-note', text: 'Chaque personne ayant une fiche avec une adresse du domaine reçoit l’accès (un courriel de partage de Google lui est envoyé) et voit le lien dans « Mon compte ». Modifier le classeur directement contourne les règles de l’outil : droits, historique, contrôle de version. Décocher retire les accès que l’outil a accordés (jamais ceux que vous avez donnés à la main). ' + (c.sheet_granted || 0) + ' accès accordé(s) par l’outil.' }),
        el('div', { class: 'row' }, [el('button', { type: 'button', class: 'btn', id: 'sheet-sync', text: 'Partager maintenant avec toutes les personnes invitées', onclick: function () {
          var out = document.getElementById('sheet-sync-result'); out.textContent = 'Partage en cours…'; out.hidden = false;
          call('admin.sheet.sync', {}, true).then(function (r) {
            out.textContent = !r.enabled ? 'Le partage est désactivé : cochez d’abord la case, puis enregistrez.' : r.granted + ' accès accordé(s), ' + r.already + ' déjà en place, ' + r.revoked + ' retiré(s)' + (r.failed.length ? ', ' + r.failed.length + ' en échec : ' + r.failed.map(function (f) { return f.email + ' (' + f.reason + ')'; }).join(' ; ') : '') + (r.partial ? ' — interrompu avant la limite de temps : relancez.' : '.');
          }).catch(function (e) { out.textContent = ppmErrorText(e); });
        } })]),
        el('p', { class: 'note', id: 'sheet-sync-result', hidden: 'hidden' })]),
      el('section', { class: 'grp' }, [el('h3', { text: 'Protection du classeur, déduite des rôles' }),
        el('label', { class: 'opt' }, [protectOn, el('span', { text: 'Verrouiller en modification les feuilles sensibles du classeur, selon les rôles' })]),
        el('div', { id: 'protect-groups' }, (c.sheet_protect_groups || []).map(function (g) {
          return el('div', { class: 'prot-group', 'data-group': g.key }, [el('strong', { text: g.label }),
            el('p', { class: 'note', text: 'Feuilles : ' + g.tables.join(', ') + '. Modifiable par : administrateurs, ' + g.roles.join(', ') + ' (' + plural(g.editors.length, 'personne', 'personnes') + ').' }),
            el('details', {}, [el('summary', { text: 'Voir les adresses' }), el('p', { class: 'note', text: g.editors.join(', ') || '—' })])]);
        })),
        el('p', { class: 'note', id: 'protect-note', text: 'Aucune adresse à gérer : la liste se déduit des rôles actifs (un chef de projet, un DPL ou un PL, où que ce soit) et se met à jour seule quand un rôle ou une fiche change, puis chaque nuit. La protection n’interdit que la MODIFICATION : toute personne qui ouvre le classeur peut encore LIRE ces feuilles (rôles, taux journaliers, budgets). Le propriétaire du script, donc l’outil, peut toujours écrire ; les protections posées à la main ne sont pas touchées.' }),
        el('div', { class: 'row' }, [el('button', { type: 'button', class: 'btn', id: 'protect-now', text: 'Appliquer les protections maintenant', onclick: function () {
          var out = document.getElementById('protect-result'); out.textContent = 'Application en cours…'; out.hidden = false;
          call('admin.sheet.protect', {}, true).then(function (r) {
            var n = r.groups.reduce(function (s, g) { return s + g.protectedSheets.length; }, 0), skipped = r.skipped.filter(function (e, i, a) { return a.indexOf(e) === i; });
            out.textContent = !r.ready ? 'Le classeur n’est pas joignable : exécutez A1_INSTALLER_PPM.' : !r.enabled ? r.removedProtections + ' protection(s) retirée(s) : la protection est coupée.'
              : n + ' feuille(s) protégée(s), ' + r.created + ' protection(s) posée(s)' + (r.failed.length ? ', ' + r.failed.length + ' en échec : ' + r.failed.map(function (f) { return f.table + ' (' + f.reason + ')'; }).join(' ; ') : '') + (skipped.length ? ' ; pas encore éditeurs, faute d’accès au classeur : ' + skipped.join(', ') : '') + '.';
          }).catch(function (e) { out.textContent = ppmErrorText(e); });
        } })]),
        el('p', { class: 'note', id: 'protect-result', hidden: 'hidden' })]),
      el('section', { class: 'grp' }, [el('h3', { text: 'Administrateurs' }), field('Une adresse par ligne ; vous devez rester dans la liste', admins)]),
      el('section', { class: 'grp' }, [el('h3', { text: 'Accès à l’outil' }),
        field('Domaines autorisés, séparés par une virgule (au plus cinq ; vous ne pouvez pas retirer le vôtre)', domainsInput)]),
      el('section', { class: 'grp' }, [el('h3', { text: 'Copilote' }),
        el('label', { class: 'opt' }, [copilotOn, el('span', { text: 'Activer le Copilote : chaque personne y enregistre sa propre clé Gemini (page Copilote)' })]),
        el('p', { class: 'note', id: 'copilot-note', text: 'Avec une clé gratuite, Google peut utiliser les données envoyées pour améliorer ses produits ; n’activer qu’avec l’accord de votre entreprise. Le lien « Copilote » apparaît dans la barre du haut après rechargement de la page.' })]),
      c.copilot_enabled ? el('section', { class: 'grp' }, [el('h3', { text: 'Copilote IA' }),
        field('Mode', mode), field('Modèle Gemini', model), field('Quota : demandes par personne et par jour', quota),
        el('p', { class: 'note', id: 'key-note', text: 'La clé Gemini est strictement personnelle : chaque personne enregistre la sienne dans la page Copilote. L’administrateur n’en saisit pas, et rien n’est partagé.' })]) : null,
      el('section', { class: 'grp' }, [el('h3', { text: 'Rappels avant livraison' }),
        el('label', { class: 'opt' }, [remOn, el('span', { text: 'Ajouter un rappel dans l’agenda du responsable de chaque livrable' })]),
        field('Délai par défaut, en jours ouvrés avant la livraison (chacun peut régler le sien)', remDays)]),
      el('section', { class: 'grp' }, [el('h3', { text: 'Adresses (facultatives)' }),
        field('Application AppSheet', appsheet), field('Logo Airbus', logo), field('Dossier Drive des projets', folder)]),
      el('div', { class: 'row' }, [save])
    ]);
    panel.appendChild(box('Réglages de l’outil', [form,
      el('p', { class: 'note', text: 'Le mode « api » envoie des données de projet à Gemini : ne l’activez qu’avec l’accord de la DSI. La clé n’est stockée que dans les propriétés du script.' })]));
    var ro = el('dl', { class: 'readonly' });
    [['Domaines autorisés', c.domain], ['Adresse de l’application', c.webapp_url || 'inconnue : ouvrir l’application une fois'], ['Dossier des sauvegardes', c.backup_folder_id || 'pas encore créé']].forEach(function (x) {
      ro.appendChild(el('dt', { class: 'muted', text: x[0] })); ro.appendChild(el('dd', { text: x[1] }));
    });
    panel.appendChild(box('Lecture seule', [ro, el('p', { class: 'note', text: 'Le manifeste, le déploiement et les autorisations se gèrent dans l’éditeur Apps Script.' })]));
  }

  // ------------------------------------------------------------ Santé
  function loadHealth() {
    var panel = $('panel-sante');
    loading(panel);
    call('admin.health', {}).then(function (h) { state.health = h; renderHealth(); }).catch(function (e) { failed(panel, e); });
  }
  function renderHealth() {
    var panel = $('panel-sante'), h = state.health, n = h.night;
    clear(panel);
    var cards = el('div', { class: 'cards' });
    cards.appendChild(card('Installation', h.ok ? 'Conforme' : plural(h.checks.length, 'point à corriger', 'points à corriger'), 'version ' + h.version, h.ok ? 'ok' : 'alert'));
    cards.appendChild(card('Dernière nuit', n ? (n.ok ? 'Réussie' : 'Échec') : 'Jamais exécutée', n ? frDateTime(n.endedAt) : 'lancer nightlyRun ou installTriggers', n && !n.ok ? 'alert' : (n ? 'ok' : '')));
    cards.appendChild(card('Dernier récapitulatif', h.digest ? plural(h.digest.sent, 'mail', 'mails') : '—', h.digest ? frDateTime(h.digest.at) + (h.digest.skipped ? ', ' + h.digest.skipped + ' reporté(s)' : '') : 'pas encore envoyé'));
    if (h.copilot_enabled) cards.appendChild(card('Copilote', h.ai.mode === 'api' ? h.ai.used_today + ' demandes' : 'IA ' + (h.ai.mode === 'off' ? 'désactivée' : 'en copier-coller'), h.ai.mode === 'api' ? 'aujourd’hui, limite ' + h.ai.per_person_limit + ' par personne' : ''));
    if (h.mail_quota !== null) cards.appendChild(card('Mails restants', String(h.mail_quota), 'quota du jour', h.mail_quota < 50 ? 'alert' : ''));
    cards.appendChild(card('Cache des lectures', h.cache ? 'Actif' : 'Inactif', h.cache ? 'les tables ne sont relues que si elles ont changé' : 'chaque page relit les feuilles'));

      } })])]));
    // ---- coût d'un ETP
    var etp = b.etp, ctry = el('select', { id: 'etp-country', 'aria-label': 'Pays', style: 'padding:8px 10px;border:1px solid var(--rule);border-radius:6px' }, etp.countries.map(function (c) { return el('option', { value: c, text: (COUNTRY_NAMES[c] || c) + ' (' + c + ')' }); }));
    var eyear = el('input', { type: 'number', id: 'etp-year', min: '2000', max: '2100', 'aria-label': 'Année', value: String(new Date().getFullYear() + 1), style: 'padding:8px 10px;border:1px solid var(--rule);border-radius:6px;width:110px' });
    var cost = el('input', { type: 'number', id: 'etp-cost', min: '0', step: 'any', 'aria-label': 'Coût annuel d’un ETP (€)', placeholder: 'coût annuel (€)', style: 'padding:8px 10px;border:1px solid var(--rule);border-radius:6px;width:160px' });
    var erows = etp.costs.map(function (r) {
      return el('tr', { 'data-etp': r.id }, [el('td', { text: (COUNTRY_NAMES[r.country] || r.country) + ' (' + r.country + ')' }), el('td', { text: String(r.year) }), el('td', { class: 'num', text: eur0(r.annual_cost) }),
        el('td', { class: 'num', text: r.day_cost === null ? '—' : eur0(r.day_cost) + ' (' + r.working_days + ' j ouvrés)' }),
        el('td', {}, [el('button', { type: 'button', class: 'btn etp-del', 'data-id': r.id, text: 'Supprimer', onclick: function () {
          call('etp.delete', { id: r.id, version: r.version }, true).then(function () { toast('Coût supprimé.'); loadBudgetParams(); }).catch(fail);
        } })])]);
    });
    panel.appendChild(box('Coût annuel d’un ETP', [
      el('p', { class: 'note', text: 'Plus aucun taux journalier : le seul paramètre de coût du personnel est le coût annuel d’un ETP par pays et par année. Un montant se convertit en jours par : montant ÷ (coût annuel ÷ jours ouvrés de l’année dans le pays de l’équipe). Sans coût paramétré pour un pays et une année, la page affiche « à paramétrer » au lieu d’un chiffre.' }),
      etp.costs.length ? table(['Pays', 'Année', 'Coût annuel d’un ETP', 'Un jour ouvré', ''], erows) : el('p', { class: 'muted', id: 'etp-empty', text: 'Aucun coût paramétré pour l’instant.' }),
      el('div', { class: 'row', style: 'margin-top:12px' }, [ctry, eyear, cost, el('button', { type: 'button', class: 'btn', id: 'etp-save', text: 'Enregistrer le coût', onclick: function () {
        call('etp.set', { values: { country: ctry.value, year: eyear.value, annual_cost: cost.value } }, true).then(function () { toast('Coût enregistré.'); loadBudgetParams(); }).catch(fail);
      } })])]));
  }

  // ------------------------------------------------------------ Journaux
  function loadLogs() {
    var panel = $('panel-journaux');
    loading(panel);
    call('admin.logs', {}).then(function (l) { state.logs = l; renderLogs(); }).catch(function (e) { failed(panel, e); });
  }
  function renderLogs() {
    var panel = $('panel-journaux'), l = state.logs;
    clear(panel);
    panel.appendChild(el('h2', { style: 'font-size:16px;margin:8px 0', text: 'Derniers changements' }));
    if (!l.changes.length) panel.appendChild(el('p', { class: 'note', text: 'Aucun changement enregistré.' }));
    else panel.appendChild(table(['Quand', 'Qui', 'Quoi', 'Champ', 'Avant → Après', 'Origine'], l.changes.map(function (e) {
      return el('tr', {}, [el('td', { text: frDateTime(e.at) }), el('td', { text: e.actor }), el('td', { text: e.what }), el('td', { text: e.field }),
        el('td', { text: (e.old_value || '∅') + ' → ' + (e.new_value || '∅') }), el('td', { text: e.source })]);
    })));
    if (l.copilot_enabled) panel.appendChild(el('h2', { style: 'font-size:16px;margin:24px 0 8px', text: 'Échanges avec le copilote' }));
    if (!l.copilot_enabled) { /* copilote en suspens : pas d'échanges à montrer */ } else if (!l.ai.length) panel.appendChild(el('p', { class: 'note', text: 'Aucun échange enregistré.' }));
    else panel.appendChild(table(['Quand', 'Qui', 'Objet', 'Mode', 'Chiffres non vérifiés', 'Avis', 'Extrait'], l.ai.map(function (x) {
      return el('tr', {}, [el('td', { text: frDateTime(x.at) }), el('td', { text: x.actor }), el('td', { text: x.purpose }), el('td', { text: x.mode }),
        el('td', {}, [x.unverified ? el('span', { class: 'badge warn', text: x.unverified }) : '—']), el('td', { text: x.feedback || '—' }), el('td', { text: x.excerpt })]);
    })));
  }

  // ------------------------------------------------------------ démarrage
  if (!BOOT.isAdmin) {
    ['sante', 'feries', 'budget', 'donnees', 'droits', 'journaux'].forEach(function (t) { $('panel-' + t).hidden = true; $('zone-' + t).hidden = true; });
    $('zone-reglages').hidden = true;
    empty($('panel-reglages'), 'Réservé aux administrateurs.', 'Vos réglages personnels sont dans « Mon compte ».');
  } else {
    call('admin.get', {}).then(function (c) { state.cfg = c; render(); }).catch(function (e) { failed($('panel-reglages'), e); });
  }

  window.__ppm = { state: state, render: render };
})();
</script>
</body>
</html>
