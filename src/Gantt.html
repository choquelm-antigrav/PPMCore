<style>
  /* ---- Frappe Gantt : couleurs à la manière d'un écran de cockpit ---- */

  .linking .bar-wrapper { cursor: pointer; }

  .gantt .grid-background { fill: var(--surface); }

  .gantt .weekends rect { fill: var(--ink); opacity: .03; pointer-events: none; }
  .gantt .today-line { stroke: var(--red); stroke-width: 1.5; stroke-opacity: .85; pointer-events: none; }

  .gantt .handle.progress { display: none; }
  .gantt .bar-wrapper.is-locked .handle, .gantt .bar-wrapper.is-wp .handle { display: none; }
  /* couleur d'une barre : --bs (statut) ; --b (affichée) peut être remplacée par le chemin critique ou un retard */

  .gantt :is(.bar-wrapper, .milestone-mark).is-late { --b: var(--red); }
  .gantt :is(.bar-wrapper, .milestone-mark).is-done { --b: var(--green); }
  .gantt .bar-wrapper:is(.is-wp, .is-project).is-late { --b: var(--bs); }

  .gantt .bar-wrapper.is-wp .bar-label { transform: translateY(-8px); font-weight: 600; }
  /* jalon : le losange est dessiné par la page ; la barre, invisible, ne sert qu'à recevoir le clic et le glisser */

  #chips:empty { display: none; }

  #today-btn { padding: 5px 12px; font-size: 13px; }

  .tip { position: fixed; z-index: 60; max-width: 320px; padding: 10px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .22); font-size: 13px; pointer-events: none; }

  .tip .tip-row { display: flex; gap: 10px; justify-content: space-between; padding: 1px 0; }
  .tip .tip-k { color: var(--muted); } .tip .tip-v { text-align: right; font-weight: 500; }
  .tip .tip-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tip .tip-badge { padding: 1px 8px; border-radius: 999px; background: var(--tint); font-size: 12px; }
  .tip .tip-badge.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .tip .tip-badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  /* chargement : des barres fantômes plutôt qu'une ligne de texte */
  .skeleton { display: grid; gap: 14px; padding: 18px 16px; }
  .sk-row { height: 26px; }
  .sk-bar { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--tint) 25%, var(--hover) 50%, var(--tint) 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  /* légende */
  .swatch.todo { background: var(--muted); opacity: .75; } .swatch.doing { background: var(--accent); }

  .swatch.today { width: 3px; height: 14px; border-radius: 2px; background: var(--red); }
  /* ---- liste de gauche, recherche et filtres, entête de dates qui reste visible (0.15.2) ---- */
  .plan-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 0 0 10px; }

  :root.dark .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #031126; }
  .pl-count { color: var(--muted); font-size: 13px; }
  .plan { position: relative; overflow: auto; max-height: 78vh; min-height: 240px; }
  .plan-inner { display: flex; align-items: flex-start; width: max-content; min-width: 100%; }

  .plan-left { position: sticky; left: 0; z-index: 6; flex: 0 0 var(--lw, 340px); width: var(--lw, 340px); background: var(--surface); border-right: 1px solid var(--rule); box-shadow: 6px 0 10px -8px rgba(0, 0, 0, .3); font-size: 13px; }
  .list-off .plan-left { display: none; }
  .pl-head, .pl-row { display: flex; align-items: center; box-sizing: border-box; padding-right: 8px; }
  .pl-head { position: sticky; top: 0; z-index: 7; height: 57px; align-items: flex-end; padding-bottom: 8px; background: var(--surface); border-bottom: 1px solid var(--rule); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }

  .gantt .bar-wrapper.row-hover .bar { fill-opacity: .34; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .3)); }

    .status { flex-wrap: nowrap; overflow-x: auto; }

</style>

<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, frDate = function (s) { return ppm.frDate(s, '—'); };

  var state = { link: null, mode: 'project', projectId: '', programId: '', data: null, catalog: null,
    viewMode: 'Week', gantt: null, lastDrag: 0,
    collapsed: {}, filter: 'all', q: '', listOpen: window.innerWidth >= 700, activeId: '', keepView: null,
    epoch: 0, pendingWrites: 0, chain: Promise.resolve(), afterReload: [] };
  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------ outils
  // Frappe Gantt insère les libellés en HTML : on les échappe pour qu'un nom reste du texte.
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ymd(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function isWeekend(s) { var d = new Date(s + 'T12:00:00'); return d.getDay() === 0 || d.getDay() === 6; }



  function updateNav() {
    var base = BOOT.baseUrl || '';
    var scope = state.mode === 'program' ? (state.programId ? '&program=' + state.programId : '') : '&project=' + state.projectId;

    var d = state.data;
    var wp = d.rows.filter(function (x) { return x.kind === 'wp' && x.wp_id === r.wp_id; })[0];
    var nodes = [el('h2', { text: r.name }), el('p', { class: 'kind', text: r.item_type + (wp ? ' du workpackage ' + wp.name : '') })];
    if (r.late) nodes.push(el('p', { class: 'flag alert', text: 'Fin prévue le ' + frDate(r.finish) + ', dépassée.' }));
    var ft = floatText(r);
    if (ft) nodes.push(el('p', { class: 'flag' + (ft.alert ? ' alert' : ''), text: ft.text }));
    if (d.baseline && r.added) nodes.push(el('p', { class: 'flag', text: 'Ajouté depuis la baseline ' + d.baseline.label + '.' }));
    if (d.baseline && r.slip > 0) nodes.push(el('p', { class: 'flag alert', text: 'Finit ' + plural(r.slip, 'jour ouvré', 'jours ouvrés') + ' après la baseline ' + d.baseline.label + '.' }));
    if (d.baseline && r.slip < 0) nodes.push(el('p', { class: 'flag', text: 'Finit ' + plural(-r.slip, 'jour ouvré', 'jours ouvrés') + ' avant la baseline ' + d.baseline.label + '.' }));
    nodes.push(facts([
      ['Responsable', r.owner || 'À désigner'],
      ['Début', r.item_type === 'Jalon' ? null : frDate(r.start)],
      [r.item_type === 'Jalon' ? 'Date' : 'Fin', frDate(r.finish)],
      ['Avancement', r.item_type === 'Livrable' ? r.progress + ' %' : null],
      ['Statut', r.status],
      ['Marge', r.float > 0 ? plural(r.float, 'jour ouvré', 'jours ouvrés') : null],
      ['Fin au plus tard', r.late_finish ? frDate(r.late_finish) : null],
      ['Baseline', r.baseline_finish ? (r.item_type === 'Jalon' || r.baseline_start === r.baseline_finish ? frDate(r.baseline_finish)
        : frDate(r.baseline_start) + ' → ' + frDate(r.baseline_finish)) : null]
    ]));
    var related = d.violations.filter(function (v) { return v.successor_id === r.id || v.predecessor_id === r.id; });
    related.forEach(function (v) {
      nodes.push(el('p', { class: 'flag alert', text: v.predecessor_name + ' → ' + v.successor_name + ' (' + v.dep_type + ') : il manque ' +
        plural(v.gap_days, 'jour ouvré', 'jours ouvrés') + ', date requise le ' + frDate(v.required) + '.' }));
    });
    nodes.push(depsSection(r));
    if (r.canDeclare && r.status !== 'Terminé') nodes.push(declareForm(r));
    if (BOOT.appsheetUrl) nodes.push(el('div', { class: 'links' }, [el('a', { class: 'btn', href: BOOT.appsheetUrl, target: '_blank', rel: 'noopener', text: 'Modifier dans AppSheet' })]));
    openDetails(nodes);
  }

  function declareForm(r) {
    var input = el('input', { type: 'number', min: '0', max: '100', step: '5', value: String(r.progress || 0), id: 'pct', required: 'required' });
    var comment = el('textarea', { id: 'pct-comment', placeholder: 'Ce qui a avancé, ce qui bloque (facultatif)' });
    var submit = el('button', { type: 'submit', class: 'btn primary', text: 'Déclarer l’avancement' });
    return el('form', { class: 'declare', onsubmit: function (e) {
      e.preventDefault();
      var v = Number(input.value);
      if (!(v >= 0 && v <= 100)) { toast('L’avancement doit être compris entre 0 et 100 %.', true); return; }
      submit.disabled = true;
      var old = { progress: r.progress, status: r.status }, text = comment.value.trim();
      r.progress = v;
      redrawKeep(r.id); toast('Avancement déclaré : ' + v + ' %.');
      write({
        run: function () { return call('progress.declare', { planItemId: r.id, progressPct: v, comment: text }, true); },
        revert: function (err) { r.progress = old.progress; r.status = old.status; redrawKeep(r.id); toast(err.message || 'Déclaration impossible.', true); }
      });
    } }, [
      el('h3', { text: 'Déclarer l’avancement' }),
      el('div', { class: 'row' }, [el('label', { for: 'pct', text: 'Avancement' }), input, document.createTextNode('%')]),
      el('label', { for: 'pct-comment', text: 'Commentaire' }), comment, submit
    ]);
  }

  // ------------------------------------------------------------ liens de dépendance
  var DEP_TYPES = [['FS', 'Fin → Début (le plus courant)'], ['SS', 'Début → Début'], ['FF', 'Fin → Fin'], ['SF', 'Début → Fin']];
  var DEP_SHORT = { FS: 'Fin → Début', SS: 'Début → Début', FF: 'Fin → Fin', SF: 'Début → Fin' };
  var DEP_WORDS = { FS: ['doit être fini avant que', 'commence'], SS: ['doit avoir commencé avant que', 'commence'], FF: ['doit être fini avant que', 'finisse'], SF: ['doit avoir commencé avant que', 'finisse'] };
  function depName(id) { var r = findRow(id); return r ? (r.kind === 'external' ? '[' + r.project_code + '] ' : '') + r.name : 'élément'; }
  function lagText(n) { return n ? ', ' + (n > 0 ? '+' : '−') + Math.abs(n) + ' j' : ''; }
  function canEditRow(id) { var r = findRow(id); return !!(r && r.kind === 'item' && r.canEdit); }

  function depsSection(r) {
    var d = state.data, all = d.dependencies || [];
    var preds = all.filter(function (x) { return x.to === r.id; }), succs = all.filter(function (x) { return x.from === r.id; });
    var canPred = !!r.canEdit;
    var canSucc = !!(r.canEdit || d.canEditProject || d.rows.some(function (x) { return x.kind === 'item' && x.canEdit; }));
    var box = el('section', { class: 'deps', id: 'deps', 'aria-label': 'Dépendances' }, [el('h3', { text: 'Dépendances' })]);
    var block = function (title, items, other, listId) {
      box.appendChild(el('p', { class: 'dep-title', text: title }));
      if (!items.length) { box.appendChild(el('p', { class: 'note', text: 'Aucun.' })); return; }
      var ul = el('ul', { class: 'deps-list', id: listId });
      items.forEach(function (x) {
        var li = el('li', { class: x.violated ? 'alert' : '', 'data-dep': x.id }, [
          el('button', { type: 'button', class: 'dep-name', text: depName(x[other]), title: 'Ouvrir cet élément', onclick: function () { onBarClick(x[other]); } }),
          document.createTextNode(' '), // l'espace compte pour la lecture à voix haute et le copier-coller
          el('span', { class: 'dep-meta', text: DEP_SHORT[x.type] + lagText(x.lag) + (x.violated ? ' — non respecté' : '') })]);
        if (canEditRow(x.to)) { li.appendChild(document.createTextNode(' ')); li.appendChild(removeButton(x, r)); }
        ul.appendChild(li);
      });
      box.appendChild(ul);
    };
    block('Doit attendre', preds, 'from', 'deps-preds');
    block('Bloque', succs, 'to', 'deps-succs');
    var actions = el('div', { class: 'dep-actions' });
    if (canPred) actions.appendChild(el('button', { type: 'button', class: 'btn', id: 'dep-add-pred', text: '+ Doit attendre…', title: 'Choisir ce que cet élément doit attendre', onclick: function () { startLink(r, 'pred'); } }));
    if (canSucc) actions.appendChild(el('button', { type: 'button', class: 'btn', id: 'dep-add-succ', text: '+ Bloque…', title: 'Choisir ce qui doit attendre cet élément', onclick: function () { startLink(r, 'succ'); } }));
    if (actions.childNodes.length) box.appendChild(actions);
    box.appendChild(el('div', { id: 'dep-form-host' }));
    return box;
  }

  /** Retrait en deux temps : un premier clic arme le bouton (quatre secondes), le second retire le lien. */
  function removeButton(x, r) {
    var b = el('button', { type: 'button', class: 'dep-remove', text: 'Retirer', 'aria-label': 'Retirer ce lien' }), timer = null;
    b.addEventListener('click', function () {
      if (!timer) {
        b.textContent = 'Confirmer le retrait'; b.classList.add('armed');
        timer = setTimeout(function () { timer = null; b.textContent = 'Retirer'; b.classList.remove('armed'); }, 4000);
        return;
      }
      clearTimeout(timer); b.disabled = true;
      var all = state.data.dependencies, idx = all.indexOf(x);
      if (idx >= 0) all.splice(idx, 1);
      redrawKeep(r.id); toast('Lien retiré.');
      write({
        run: function () { return call('dependencies.delete', { id: x.id, version: x.version }, true); },
        revert: function (err) {
          all.splice(Math.min(Math.max(idx, 0), all.length), 0, x); redrawKeep(r.id);
          toast(err.code === 'CONFLICT' ? 'Ce lien a été modifié entre-temps : le planning est rechargé.' : (err.message || 'Retrait impossible.'), true);
        }
      });
    });
    return b;
  }

  /** mode « pred » : l'élément ouvert doit attendre un autre ; mode « succ » : un autre doit attendre l'élément ouvert. */
  function startLink(r, mode, prefill) {
    endLink(true);
    var host = $('dep-form-host'); clear(host);
    var sel = el('select', { id: 'dep-pick', 'aria-label': mode === 'pred' ? 'Élément à attendre' : 'Élément qui attendra' }, [el('option', { value: '', text: 'Chargement de la liste…' })]);
    var type = el('select', { id: 'dep-type', 'aria-label': 'Type de lien' }, DEP_TYPES.map(function (t) { return el('option', { value: t[0], text: t[1] }); }));
    var lag = el('input', { type: 'number', id: 'dep-lag', min: '-365', max: '365', step: '1', value: '0', 'aria-label': 'Décalage en jours ouvrés' });
    var submit = el('button', { type: 'submit', class: 'btn primary', id: 'dep-submit', text: 'Créer le lien', disabled: 'disabled' });
    var sentence = el('p', { class: 'dep-sentence', id: 'dep-sentence' });
    var update = function () {
      submit.disabled = !sel.value;
      Array.prototype.forEach.call(document.querySelectorAll('.link-target'), function (n) { n.classList.remove('link-target'); });
      if (!sel.value) { sentence.textContent = ''; return; }
      var g = document.querySelector('.bar-wrapper[data-id="' + cssEscape(sel.value) + '"]'); if (g) g.classList.add('link-target');
      var pred = mode === 'pred' ? sel.value : r.id, succ = mode === 'pred' ? r.id : sel.value, w = DEP_WORDS[type.value], n = lag.value === '' ? 0 : Number(lag.value);
      sentence.textContent = '« ' + depName(pred) + ' » ' + w[0] + ' « ' + depName(succ) + ' » ' + w[1] + (n ? ' (' + (n > 0 ? '+' : '−') + plural(Math.abs(n), 'jour ouvré', 'jours ouvrés') + ')' : '') + '.';
      var f = document.getElementById('dep-form'); // la phrase allonge le formulaire : le bouton « Créer le lien » doit rester à l'écran
      if (f && typeof f.scrollIntoView === 'function') f.scrollIntoView({ block: 'nearest' });
    };
    sel.addEventListener('change', update); type.addEventListener('change', update); lag.addEventListener('input', update);
    var form = el('form', { class: 'dep-form', id: 'dep-form', onsubmit: function (e) {
      e.preventDefault();
      if (!sel.value) return;
      submit.disabled = true;
      var pred = mode === 'pred' ? sel.value : r.id, succ = mode === 'pred' ? r.id : sel.value, chosen = sel.value;
      var t = type.value, n = lag.value === '' ? 0 : Number(lag.value);
      var temp = { id: 'tmp:' + Date.now() + ':' + pred + ':' + succ, version: 1, from: pred, to: succ, type: t, lag: n, violated: false };
      state.data.dependencies.push(temp);
      endLink(true);
      redrawKeep(r.id); toast('Lien créé : ' + depName(pred) + ' → ' + depName(succ) + '.');
      state.afterReload.push(function () {
        var v = (state.data.violations || []).filter(function (x) { return x.predecessor_id === pred && x.successor_id === succ; })[0];
        if (v) toast('Lien créé, mais non respecté par les dates actuelles : il manque ' + plural(v.gap_days, 'jour ouvré', 'jours ouvrés') + ' (date requise le ' + frDate(v.required) + '). Décalez l’un des deux éléments.', true);
      });
      write({
        run: function () {
          return call('dependencies.create', { values: { predecessor_id: pred, successor_id: succ, dep_type: t, lag_days: n } }, true)
            .then(function (created) { temp.id = created.id; temp.version = created.version; });
        },
        revert: function (err) {
          var i = state.data.dependencies.indexOf(temp); if (i >= 0) state.data.dependencies.splice(i, 1);
          redrawKeep(r.id);
          var row = findRow(r.id);
          if (row && row.kind === 'item') startLink(row, mode, { pick: chosen, type: t, lag: n }); // le formulaire revient avec le même choix, à corriger
          toast(err.message || 'Création impossible.', true);
        }
      });
    } }, [
      el('h4', { text: mode === 'pred' ? '« ' + r.name + ' » doit attendre…' : '« ' + r.name + ' » bloque…' }),
      el('p', { class: 'note', text: 'Choisissez dans la liste, ou cliquez sur la barre de l’élément dans le diagramme.' }),
      sel, sentence,
      el('details', {}, [el('summary', { text: 'Options : type de lien, décalage' }),
        el('div', { class: 'row' }, [el('label', { for: 'dep-type', text: 'Type' }), type]),
        el('div', { class: 'row' }, [el('label', { for: 'dep-lag', text: 'Décalage' }), lag, document.createTextNode('jours ouvrés (négatif : chevauchement)')])]),
      el('div', { class: 'row' }, [submit, el('button', { type: 'button', class: 'btn', id: 'dep-cancel', text: 'Annuler', onclick: function () { endLink(); } })])
    ]);
    host.appendChild(form);
    if (typeof form.scrollIntoView === 'function') form.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); // le formulaire s'ouvre sous le pli du panneau : on l'amène à l'écran
    state.link = { itemId: r.id, mode: mode, form: form, sel: sel, loading: true };
    $('main').classList.add('linking');
    call('deps.item', { itemId: r.id }).then(function (info) {
      if (!state.link || state.link.form !== form) return;
      var cands = info.candidates.filter(function (c) { return mode === 'pred' ? true : c.can_edit; });
      clear(sel);
      sel.appendChild(el('option', { value: '', text: cands.length ? 'Choisir un livrable ou un jalon…' : 'Aucun élément disponible' }));
      var groups = {}, order = [];
      cands.forEach(function (c) {
        var key = (c.project_id === r.project_id ? '' : '[' + c.project_code + '] ') + (c.wp || 'Sans workpackage');
        if (!groups[key]) { groups[key] = el('optgroup', { label: key }); order.push(key); }
        groups[key].appendChild(el('option', { value: c.id, text: c.name + (c.item_type === 'Jalon' ? ' (jalon)' : '') + (c.finish ? ' — ' + frDate(c.finish) : '') }));
      });
      order.forEach(function (k) { sel.appendChild(groups[k]); });
      state.link.loading = false;
      if (prefill && sel.querySelector('option[value="' + cssEscape(prefill.pick) + '"]')) { sel.value = prefill.pick; type.value = prefill.type; lag.value = String(prefill.lag); update(); }
      if (!cands.length) sentence.textContent = mode === 'pred' ? 'Tous les éléments sont déjà liés à celui-ci.' : 'Aucun élément déjà lié ou que vous puissiez modifier : rien à ajouter ici.';
      else if (info.truncated) sentence.textContent = 'Liste limitée aux 400 premiers éléments.';
    }).catch(function (err) { endLink(true); toast(err.message || 'Liste des éléments indisponible.', true); });
  }

  /** Quitte le mode lien : formulaire retiré, curseur et surbrillance rétablis. */
  function endLink() {
    if (!state.link) return;
    var l = state.link; state.link = null;
    $('main').classList.remove('linking');
    Array.prototype.forEach.call(document.querySelectorAll('.link-target'), function (n) { n.classList.remove('link-target'); });
    if (l.form && l.form.parentNode) l.form.parentNode.removeChild(l.form);
  }

  /** Un clic sur une barre pendant la création d'un lien choisit cet élément (au lieu d'ouvrir son détail). Vrai si le clic est traité. */
  function pickFromChart(id) {
    var l = state.link;
    if (!l) return false;
    if (id === l.itemId) return true;
    if (l.loading) { toast('La liste des éléments se charge : un instant.', true); return true; }
    var opt = l.sel.querySelector('option[value="' + cssEscape(id) + '"]');
    if (!opt) { toast('Cet élément ne peut pas être lié ici (déjà lié, ou vous ne pouvez pas le modifier). Choisissez-en un autre.', true); return true; }
    l.sel.value = id; l.sel.dispatchEvent(new window.Event('change'));
    return true;
  }

  function showWp(r) {
    var nodes = [el('h2', { text: (r.wbs_code ? r.wbs_code + ' ' : '') + r.name }), el('p', { class: 'kind', text: r.level ? 'Sous-workpackage' : 'Workpackage' })];
    if (r.late) nodes.push(el('p', { class: 'flag alert', text: 'Au moins un élément de ce workpackage est en retard.' }));
    if (r.critical) nodes.push(el('p', { class: 'flag', text: 'Ce workpackage contient des éléments du chemin critique.' }));
    nodes.push(facts([['Responsable', r.owner || 'À désigner'], ['Début', frDate(r.start)], ['Fin', frDate(r.finish)], ['Avancement', r.progress + ' %'],
      ['Baseline', r.baseline_finish ? frDate(r.baseline_start) + ' → ' + frDate(r.baseline_finish) : null]]));
    openDetails(nodes);
  }

  function showExternal(r) {
    openDetails([
      el('h2', { text: r.name }),
      el('p', { class: 'kind', text: r.item_type + ' du projet ' + r.project_code + ', lié à ce planning' }),
      facts([['Début', frDate(r.start)], ['Fin', frDate(r.finish)], ['Statut', r.status]]),
      el('div', { class: 'links' }, [el('button', { type: 'button', class: 'btn', text: 'Ouvrir le planning ' + r.project_code, onclick: function () { loadProject(r.project_id); } })])
    ]);
  }

  function showProject(p) {
    var nodes = [el('h2', { text: p.code + ' ' + p.name }), el('p', { class: 'kind', text: 'Projet' + (p.status ? ', ' + p.status.toLowerCase() : '') })];
    if (p.late) nodes.push(el('p', { class: 'flag alert', text: plural(p.late, 'élément en retard', 'éléments en retard') + '.' }));
    if (p.violations) nodes.push(el('p', { class: 'flag alert', text: plural(p.violations, 'dépendance non respectée', 'dépendances non respectées') + '.' }));
    nodes.push(facts([
      ['Chef de projet', p.manager || 'À désigner'], ['Début', frDate(p.start)], ['Fin prévue', frDate(p.finish)],
      ['Fin visée', p.end_date ? frDate(p.end_date) : null], ['Avancement', p.progress + ' %'],
      ['Éléments', p.items], ['Critiques', p.critical]
    ]));
    nodes.push(el('div', { class: 'links' }, [el('button', { type: 'button', class: 'btn primary', text: 'Ouvrir le planning', onclick: function () { loadProject(p.id); } })]));
    openDetails(nodes);
  }

  function onBarClick(id) {
    if (Date.now() - state.lastDrag < 400) return;
    if (!state.link) { state.activeId = id; markActive(); }
    if (state.mode === 'program') {
      if (id.indexOf('prj:') === 0) {
        var p = state.data.projects.filter(function (x) { return 'prj:' + x.id === id; })[0];
        if (p) showProject(p);
      } else {
        var owner = state.data.projects.filter(function (x) { return x.milestones.some(function (m) { return m.id === id; }); })[0];
        if (owner) showProject(owner);
      }
      return;
    }
    if (pickFromChart(id)) return;
    var r = findRow(id);
    if (!r) return;
    if (r.kind === 'wp') showWp(r); else if (r.kind === 'external') showExternal(r); else showItem(r);
  }

  // ------------------------------------------------------------ événements
  $('host').addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('.bar-wrapper');
    if (g && g.getAttribute('data-id')) onBarClick(g.getAttribute('data-id'));
  });
  $('picker').addEventListener('change', function () {
    var v = this.value.split(':');
    if (v[0] === 'program') loadProgram(v[1] === 'none' ? '' : v[1]); else loadProject(v[1]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      state.viewMode = b.getAttribute('data-mode');
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (state.gantt) { state.gantt.change_view_mode(state.viewMode); rerender(); }
    });
  });
  $('critical').addEventListener('change', function () { $('main').classList.toggle('critical-off', !this.checked); });
  $('baseline').addEventListener('change', function () { $('main').classList.toggle('baseline-off', !this.checked); });
  $('reload').addEventListener('click', function () { reload(); });
  $('today-btn').addEventListener('click', function () { scrollToToday(true); });
  var qTimer = null;
  $('pl-q').addEventListener('input', function () {
    var v = this.value; clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = v; keepView(true); rerender(); }, 150);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#plan-tools .pill'), function (b) {
    b.addEventListener('click', function () { state.filter = b.getAttribute('data-filter'); keepView(true); rerender(); });
  });
  $('pl-collapse').addEventListener('click', function () {
    (state.data.rows || []).forEach(function (r) { if (r.kind === 'wp' && r.level === 0) state.collapsed[r.id] = true; });
    keepView(true); rerender();
  });
  $('pl-expand').addEventListener('click', function () { state.collapsed = {}; keepView(false); rerender(); });
  $('pl-list').addEventListener('click', function () { state.listOpen = !state.listOpen; keepView(false); syncTools(); rerender(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (state.link) { endLink(); return; } // d'abord abandonner le lien en cours : le détail reste ouvert
    if (!$('details').hidden) closeDetails();
  });

  // ------------------------------------------------------------ démarrage
  showLoading(); // des barres fantômes dès l'ouverture, avant l'arrivée des données
  ppmPopover($('info-btn'), $('info-pop'));
  ppmPopover($('legend-btn'), $('legend-pop'));
  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    fillPicker();
    if (BOOT.program) return loadProgram(BOOT.program === 'none' ? '' : BOOT.program);
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { showEmpty('Aucun projet pour l’instant.', 'Créez un projet dans l’application AppSheet, puis revenez ici.'); return; }
    return loadProject(first);
  }).catch(showError);

  window.__ppm = { state: state, onBarClick: onBarClick, onDateChange: onDateChange, moveItem: moveItem, write: write, silentReload: silentReload, hideUndo: hideUndo, todayX: todayX, scrollToToday: scrollToToday, updateLabels: updateLabels, showLoading: showLoading };
})();
</script>
</body>
</html>
