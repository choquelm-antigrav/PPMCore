<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.11.0">
<?!= include('Style') ?>
<style>
  .panel { padding: 8px 24px 32px; max-width: 1240px; }
  .panel[hidden] { display: none; }
  .box { margin: 0 0 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
  h2.sec { margin: 24px 0 12px; font-size: 16px; font-weight: 600; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 76ch; }
  .muted { color: var(--muted); }
  .late { color: var(--red); font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0 0 16px; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
  .card .k { margin: 0; color: var(--muted); font-size: 13px; }
  .card .v { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  .card .s { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card.alert .v { color: var(--red); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12.5px; background: var(--tint); color: var(--ink); white-space: nowrap; }
  .badge.alert { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.late { color: var(--red); font-weight: 500; }
  td.nowrap { white-space: nowrap; }
  tr.total td { font-weight: 600; background: var(--tint); }
  td small { display: block; color: var(--muted); }
  td small.late { color: var(--red); }
  select.inline, input.inline { padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions-cell .btn { padding: 3px 10px; font-size: 13.5px; }
  #genform { width: min(560px, calc(100% - 32px)); max-width: none; }
  #po-dialog { width: min(680px, calc(100% - 32px)); max-width: none; max-height: calc(100vh - 32px); overflow: auto; }
  .ed-grid { display: grid; gap: 12px; }
  .ed-grid label.lbl { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .ed-grid input, .ed-grid select, .ed-grid textarea { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
  .ed-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ed-error { margin: 12px 0 0; color: var(--red); font-weight: 500; }
  .btn.danger { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .plink { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; align-items: center; margin-top: 6px; }
  .plink-sum { margin: 6px 0 0; font-size: 14px; }
  .plink-sum.late { color: var(--red); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  @media (max-width: 700px) { .panel { padding: 8px 12px 24px; } .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } .ed-row2, .plink { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title">
    <h1 id="title">Budget</h1>
    <span id="cpn-chip" class="badge" hidden></span>
    <button type="button" class="btn" id="cpn-edit" hidden>CPN</button>
  </div>
  <div class="controls"><select id="picker" aria-label="Projet"></select></div>
</header>

<div class="zone" id="zone-bilan" hidden><h2 class="sec">Bilan par CPN</h2></div>
<section class="panel" id="panel-bilan" aria-label="Bilan par CPN" hidden></section>
<div class="zone" id="zone-po" hidden><h2 class="sec">Achats (PO)</h2></div>
<section class="panel" id="panel-po" aria-label="Achats" hidden></section>
<div class="zone" id="zone-budget" hidden><h2 class="sec">Budget par livrable</h2></div>
<section class="panel" id="panel-budget" aria-label="Budget" hidden></section>

<dialog id="genform" aria-labelledby="gf-title">
  <form id="gf-form" novalidate>
    <h2 id="gf-title"></h2>
    <div class="ed-grid" id="gf-body"></div>
    <p class="ed-error" id="gf-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="gf-extra" hidden></button>
      <button type="button" class="btn" id="gf-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="gf-ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="po-dialog" aria-labelledby="po-title">
  <form id="po-form" novalidate>
    <h2 id="po-title"></h2>
    <div class="ed-grid" id="po-body"></div>
    <p class="ed-error" id="po-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="po-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="po-save">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <p class="ed-error" id="confirm-error" role="alert" hidden></p>
  <div class="actions">
    <button type="button" class="btn" id="confirm-cancel">Annuler</button>
    <button type="button" class="btn danger" id="confirm-ok">Supprimer</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';

  var TABS = ['bilan', 'po', 'budget'];
  var ACCESS_KEY = { bilan: 'all', po: 'po', budget: 'budget' };
  var state = { projectId: '', catalog: null, access: null, balance: null, po: null, budget: null, rates: null, people: null, outside: null, resources: null, seq: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var STATUS_TONE = { 'À faire': '', 'Lancée': 'warn', 'GR': 'ok', 'Terminée': 'ok' };
  var STATUSES = ['À faire', 'Lancée', 'GR', 'Terminée'];

  // ------------------------------------------------------------ outils
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function uuid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
  var toastTimer = null;
  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isError ? 8000 : 3500);
  }
  function call(action, params, write) {
    var pre = window.ppmPreloaded && window.ppmPreloaded(action, params, write);
    if (pre) return pre;
    return new Promise(function (resolve, reject) {
      document.body.classList.add('busy');
      google.script.run
        .withSuccessHandler(function (res) {
          document.body.classList.remove('busy');
          if (res && res.ok) resolve(res.data); else reject(res && res.error ? res.error : { code: 'INTERNAL', message: 'Réponse inattendue du serveur.' });
        })
        .withFailureHandler(function (err) {
          document.body.classList.remove('busy');
          reject({ code: 'NETWORK', message: 'Le serveur ne répond pas. Vérifiez la connexion puis rechargez la page.', details: String(err) });
        })
        .uiCall(action, params || {}, write ? uuid() : null);
    });
  }
  function eur(n) { return n === null || n === undefined ? '' : Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
  function eur2(n) { return Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function frDate(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function frMonth(m) { var p = String(m).split('-'); return p[1] + '/' + p[0]; }
  function plural(n, one, many) { return n + ' ' + (Math.abs(n) > 1 ? many : one); }
  function loading(p) { clear(p); p.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(p, title, text) { p.hidden = false; clear(p); p.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text || '' })])); }
  function card(k, v, s, tone) { return el('div', { class: 'card' + (tone ? ' ' + tone : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]); }
  function table(id, head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', { id: id }, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { var num = typeof h === 'object'; return el('th', { scope: 'col', class: num ? 'num' : '', text: num ? h.t : h }); }))]),
      el('tbody', {}, rows)])]);
  }
  function cell(content, cls) { return el('td', { class: cls || '' }, [].concat(content)); }
  function openDialog(d) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  function closeDialog(d) { if (d.close) d.close(); else d.removeAttribute('open'); }
  function fail(e) { toast(window.ppmErrorText ? ppmErrorText(e) : (e && e.message) || 'Opération impossible.', true); }
  function failed(p, e) { empty(p, 'Chargement impossible.', (e && e.message) || 'Erreur inconnue.'); }

  // ------------------------------------------------------------ formulaire générique et confirmation
  function fillSelect(sel, options, value) {
    clear(sel);
    options.forEach(function (o) { sel.appendChild(el('option', { value: o.value, text: o.label })); });
    sel.value = value === undefined || value === null ? (options[0] ? options[0].value : '') : value;
  }
  function openForm(spec) {
    $('gf-title').textContent = spec.title;
    var body = $('gf-body'); clear(body);
    var inputs = {}, pending = null;
    var flush = function () { if (pending) { body.appendChild(el('div', { class: 'ed-row2' }, pending)); pending = null; } };
    spec.fields.forEach(function (f) {
      var c;
      if (f.type === 'select') { c = el('select', { id: 'gf-' + f.key }); fillSelect(c, f.options || [], f.value); }
      else if (f.type === 'textarea') { c = el('textarea', { id: 'gf-' + f.key, rows: '8' }); c.value = f.value || ''; }
      else {
        var a = { type: f.type || 'text', id: 'gf-' + f.key, autocomplete: 'off' };
        if (f.maxlength) a.maxlength = String(f.maxlength);
        if (f.placeholder) a.placeholder = f.placeholder;
        if (f.list) a.list = f.list;
        if (f.type === 'number') { a.min = '0'; a.step = 'any'; }
        c = el('input', a); c.value = f.value === undefined || f.value === null ? '' : f.value;
      }
      inputs[f.key] = c;
      var lab = el('label', { class: 'lbl' }, [f.label, c]);
      if (f.half) { pending = pending || []; pending.push(lab); if (pending.length === 2) flush(); } else { flush(); body.appendChild(lab); }
    });
    flush();
    (spec.datalists || []).forEach(function (d) { body.appendChild(el('datalist', { id: d.id }, d.values.map(function (v) { return el('option', { value: v }); }))); });
    if (spec.note) body.appendChild(el('p', { class: 'note', text: spec.note }));
    if (spec.after) spec.after(inputs);
    var extra = $('gf-extra');
    extra.hidden = !spec.extra;
    if (spec.extra) { extra.textContent = spec.extra.label; extra.onclick = function () { spec.extra.run(inputs); }; }
    state.gform = { spec: spec, inputs: inputs };
    $('gf-error').hidden = true; $('gf-ok').textContent = spec.ok || 'Enregistrer'; $('gf-ok').disabled = false;
    openDialog($('genform'));
    var first = body.querySelector('input, select, textarea'); if (first) first.focus();
  }
  function submitForm() {
    var g = state.gform;
    if (!g) return;
    var values = {};
    Object.keys(g.inputs).forEach(function (k) { values[k] = g.inputs[k].value; });
    $('gf-ok').disabled = true;
    Promise.resolve().then(function () { return g.spec.onSubmit(values); }).then(function () { closeDialog($('genform')); }).catch(function (err) {
      $('gf-ok').disabled = false;
      var m = $('gf-error'); m.textContent = err && err.code === 'CONFLICT' ? 'Modifié entre-temps par quelqu’un d’autre : fermez, actualisez puis recommencez.' : ppmErrorText(err); m.hidden = false;
    });
  }
  function openConfirm(title, text, okLabel, action) {
    $('confirm-title').textContent = title; $('confirm-text').textContent = text;
    $('confirm-ok').textContent = okLabel; $('confirm-error').hidden = true; $('confirm-ok').disabled = false;
    state.confirmAction = function () {
      $('confirm-ok').disabled = true;
      return action().then(function () { closeDialog($('confirm')); }).catch(function (err) { $('confirm-ok').disabled = false; var m = $('confirm-error'); m.textContent = ppmErrorText(err); m.hidden = false; });
    };
    openDialog($('confirm'));
  }

  // ------------------------------------------------------------ navigation et chargement
  /** Plus d'onglets : les zones auxquelles on a droit s'affichent ensemble, chacune avec son titre. */
  function syncZones() {
    var a = state.access || {};
    TABS.forEach(function (t) { var on = !!a[ACCESS_KEY[t]]; $('panel-' + t).hidden = !on; $('zone-' + t).hidden = !on; });
    try { google.script.history.replace(null, { view: 'budget', project: state.projectId }); } catch (e) { /* hors web app */ }
    var base = BOOT.baseUrl || '';
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (n) {
      var v = n.getAttribute('data-view');
      if (['gantt', 'structure', 'suivi', 'copilote', 'budget'].indexOf(v) >= 0 && state.projectId) n.setAttribute('href', base + '?view=' + v + '&project=' + state.projectId);
    });
  }
  function loadAll() {
    var a = state.access || {}, jobs = [];
    if (a.all) jobs.push(loadBalance());
    if (a.po) jobs.push(loadPo());
    if (a.budget) jobs.push(loadBudget());
    return Promise.all(jobs);
  }
  function invalidate() { state.balance = null; state.po = null; state.budget = null; state.outside = null; }
  function renderHeader() {
    var p = state.access.project;
    $('title').textContent = p.code + ' ' + p.name;
    var chip = $('cpn-chip');
    chip.hidden = false;
    chip.textContent = p.cpn ? p.cpn + (p.cpn_label ? ' — ' + p.cpn_label : '') : 'Pas de CPN';
    chip.className = 'badge' + (p.cpn ? '' : ' warn');
    $('cpn-edit').hidden = !state.access.cpn;
    $('cpn-edit').textContent = p.cpn ? 'Modifier le CPN' : 'Définir le CPN';
  }
  function loadProject(id) {
    state.projectId = id; invalidate(); state.rates = null; state.people = null;
    $('picker').value = id;
    var ticket = ++state.seq;
    return call('budget.access', { projectId: id }).then(function (a) {
      if (ticket !== state.seq) return;
      state.access = a;
      renderHeader();
      if (!TABS.some(function (t) { return a[ACCESS_KEY[t]]; })) {
        syncZones(); $('panel-bilan').hidden = false;
        empty($('panel-bilan'), 'Accès réservé.', 'Le budget et les achats sont réservés aux personnes internes nommées dans l’équipe du projet.');
        return;
      }
      syncZones();
      return loadAll();
    }).catch(function (e) { failed($('panel-bilan'), e); });
  }
  function reload() { invalidate(); return loadAll(); }

  // ------------------------------------------------------------ CPN du projet
  function editCpn() {
    var p = state.access.project;
    openForm({
      title: 'CPN du projet', ok: 'Enregistrer', note: 'Un CPN ne couvre qu’un seul projet. Les commandes d’achat qui portent ce CPN pèsent sur le budget de ce projet.',
      fields: [{ key: 'cpn', label: 'CPN', value: p.cpn, maxlength: 30 }, { key: 'cpn_label', label: 'Désignation du CPN', value: p.cpn_label, maxlength: 120 }],
      onSubmit: function (v) {
        return call('cpn.set', { projectId: p.id, cpn: v.cpn, cpn_label: v.cpn_label, version: p.version }, true).then(function () {
          toast('CPN enregistré.');
          return call('budget.access', { projectId: p.id }).then(function (a) { state.access = a; renderHeader(); return reload(); });
        });
      }
    });
  }

  // ------------------------------------------------------------ Bilan par CPN
  function loadBalance() {
    var panel = $('panel-bilan');
    if (state.balance) { renderBalance(); return Promise.resolve(); }
    loading(panel);
    return call('budget.balance', { projectId: state.projectId }).then(function (b) { state.balance = b; renderBalance(); }).catch(function (e) { failed(panel, e); });
  }
  function renderBalance() {
    var panel = $('panel-bilan'), b = state.balance, t = b.totals;
    clear(panel);
    var cards = el('div', { class: 'cards' });
    cards.appendChild(card('Budget', eur(t.budget.total), 'dont ' + eur(t.budget.external) + ' externe, ' + eur(t.budget.internal) + ' interne'));
    cards.appendChild(card('Engagé par les PO', eur(t.po.committed), plural(t.po.count, 'PO', 'PO') + ' au total'));
    cards.appendChild(card('Reste sur le budget externe', eur(t.remaining_external), t.overrun ? 'dépassé' : 'disponible', t.overrun ? 'alert' : ''));
    cards.appendChild(card('PO à faire', eur(t.po.planned), 'prévisionnel, non engagé'));
    panel.appendChild(cards);
    if (!b.cpns.length) { panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Rien à analyser pour l’instant.' }), el('span', { text: 'Définissez le CPN du projet, saisissez le budget, puis les PO.' })])); return; }
    var rows = b.cpns.map(function (g) {
      return el('tr', { 'data-cpn': g.cpn }, [
        cell([g.cpn || 'Sans CPN', g.sources.length ? el('small', { text: g.sources.join(', ') }) : null]), cell(g.label || '—'),
        cell(eur(g.budget.internal), 'num'), cell(eur(g.budget.external), 'num'), cell(eur(g.po.planned), 'num'), cell(eur(g.po.committed), 'num'),
        cell(eur(g.po.received), 'num'), cell(eur(g.po.closed), 'num'),
        cell([eur(g.remaining_external), g.overrun ? el('small', { class: 'late', text: 'dépassé' }) : null], 'num' + (g.overrun ? ' late' : ''))]);
    });
    rows.push(el('tr', { class: 'total' }, [cell('Total'), cell(''), cell(eur(t.budget.internal), 'num'), cell(eur(t.budget.external), 'num'), cell(eur(t.po.planned), 'num'), cell(eur(t.po.committed), 'num'), cell(eur(t.po.received), 'num'), cell(eur(t.po.closed), 'num'), cell(eur(t.remaining_external), 'num' + (t.overrun ? ' late' : ''))]));
    panel.appendChild(table('bal-table', ['CPN', 'Désignation', { t: 'Budget interne' }, { t: 'Budget externe' }, { t: 'PO à faire' }, { t: 'Engagé' }, { t: 'Réceptionné (GR)' }, { t: 'Soldé' }, { t: 'Reste externe' }], rows));
    panel.appendChild(el('p', { class: 'note', text: 'Les analyses se font par CPN. Une PO est engagée en une fois, en totalité, à son lancement : elle vient en déduction du budget externe du CPN qu’elle porte. « À faire » n’est qu’un prévisionnel ; « GR » et « Terminée » indiquent la réception puis le solde.' }));
    if (b.months.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Par mois' }));
      panel.appendChild(table('months-table', ['Mois', { t: 'Budget planifié' }, { t: 'PO engagées' }], b.months.map(function (m) { return el('tr', {}, [cell(frMonth(m.month)), cell(eur(m.planned), 'num'), cell(eur(m.committed), 'num')]); })));
    }
  }

  // ------------------------------------------------------------ Achats (PO)
  function loadPo() {
    var panel = $('panel-po');
    if (state.po) { renderPo(); return Promise.resolve(); }
    loading(panel);
    var reqs = [call('po.list', { projectId: state.projectId }), call('po.list', { scope: 'outside' }).catch(function () { return { orders: [] }; })];
    return Promise.all(reqs).then(function (r) { state.po = r[0]; state.outside = r[1]; renderPo(); }).catch(function (e) { failed(panel, e); });
  }
  function grBadge(o) {
    if (o.gr_flag === 'late') return el('small', { class: 'late', text: 'GR en retard' });
    if (o.gr_flag === 'soon') return el('small', { text: 'GR sous 7 jours' });
    return null;
  }
  function setStatus(o, status) {
    call('po.status', { id: o.id, status: status, version: o.version }, true).then(function () { toast('PO ' + o.po_number + ' : ' + status + '.'); return reload(); }).catch(function (e) { fail(e); return reload(); });
  }
  function orderRow(o, canEdit) {
    var sel = el('select', { class: 'inline po-status', 'data-id': o.id, 'aria-label': 'Statut de la PO ' + o.po_number }, STATUSES.map(function (s) { return el('option', { value: s, text: s }); }));
    sel.value = o.status;
    sel.disabled = !canEdit;
    sel.addEventListener('change', function () { setStatus(o, sel.value); });
    var links = o.links.length ? o.links.map(function (l) { return l.name + ' (' + eur(l.amount) + ')'; }).join(', ') : '—';
    return el('tr', { 'data-po': o.po_number }, [
      cell([o.po_number, o.description ? el('small', { text: o.description }) : null].concat(o.warnings.map(function (w) { return el('small', { class: 'late', text: '⚠ ' + w }); }))),
      cell(o.cpn, 'nowrap'), cell([o.resource.name, o.resource.supplier ? el('small', { text: o.resource.supplier }) : null]), cell(links),
      cell(o.start_date || o.end_date ? frDate(o.start_date) + ' → ' + frDate(o.end_date) : '—'),
      cell(eur(o.amount), 'num'), cell([sel, o.launched_on ? el('small', { text: 'engagée le ' + frDate(o.launched_on) }) : null]),
      cell([o.gr_due_date ? frDate(o.gr_due_date) : '—', grBadge(o), o.owner.name ? el('small', { text: o.owner.name }) : null]),
      cell(canEdit ? el('div', { class: 'actions-cell' }, [
        el('button', { type: 'button', class: 'btn po-edit', 'data-id': o.id, text: 'Modifier', onclick: function () { openPoEditor(o); } }),
        el('button', { type: 'button', class: 'btn po-del', 'data-id': o.id, text: 'Supprimer', onclick: function () { deletePo(o); } })]) : '')
    ]);
  }
  function renderPo() {
    var panel = $('panel-po'), d = state.po;
    clear(panel);
    var count = {}; STATUSES.forEach(function (s) { count[s] = 0; });
    d.orders.forEach(function (o) { count[o.status]++; });
    var bar = el('div', { class: 'row' });
    if (d.canEdit) bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'po-add', text: 'Ajouter une PO', onclick: function () { openPoEditor(null); } }));
    STATUSES.forEach(function (s) { bar.appendChild(el('span', { class: 'badge ' + STATUS_TONE[s], text: s + ' : ' + count[s] })); });
    var late = d.orders.filter(function (o) { return o.gr_flag === 'late'; }).length;
    if (late) bar.appendChild(el('span', { class: 'badge alert', text: plural(late, 'GR en retard', 'GR en retard') }));
    panel.appendChild(bar);
    var head = ['N° PO', 'CPN', 'Ressource externe', 'Livrables', 'Activité', { t: 'Montant' }, 'Statut', 'GR attendue', ''];
    if (!d.orders.length) panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucune PO pour ce projet.' }), el('span', { text: 'Une PO se rattache au projet par son CPN : ' + (d.project.cpn || 'définissez d’abord le CPN du projet') + '.' })]));
    else panel.appendChild(table('po-table', head, d.orders.map(function (o) { return orderRow(o, d.canEdit); })));
    if (d.deliverables.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Consommation du budget externe par livrable' }));
      panel.appendChild(table('deliv-table', ['Livrable', 'CPN', { t: 'Budget externe' }, { t: 'Engagé' }, { t: 'À faire' }, { t: 'Reste' }], d.deliverables.map(function (x) {
        return el('tr', { 'data-deliv': x.id }, [cell([x.name, x.wp ? el('small', { text: x.wp }) : null]), cell(x.cpn || '—'), cell(eur(x.budget_external), 'num'), cell(eur(x.committed), 'num'), cell(eur(x.planned), 'num'), cell(eur(x.remaining), 'num' + (x.overrun ? ' late' : ''))]);
      })));
    }
    if (state.outside && state.outside.orders.length) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Mes PO hors périmètre de l’outil' }));
      panel.appendChild(el('p', { class: 'note', text: 'Leur CPN ne correspond à aucun projet de l’outil : elles n’impactent aucun budget.' }));
      panel.appendChild(table('outside-table', head, state.outside.orders.map(function (o) { return orderRow(o, true); })));
    }
  }
  function deletePo(o) {
    openConfirm('Supprimer la PO ' + o.po_number + ' ?', 'Elle ne comptera plus dans le budget du projet. La suppression est tracée dans le journal.', 'Supprimer', function () {
      return call('po.delete', { id: o.id, version: o.version }, true).then(function () { toast('PO supprimée.'); return reload(); });
    });
  }

  // ---- éditeur de PO : formulaire dédié, avec la répartition par livrable en montants réglables
  function openPoEditor(o) {
    call('po.options', { projectId: state.projectId }).then(function (opt) {
      var create = !o;
      var cur = o || { po_number: '', cpn: state.access.project.cpn, resource: { id: '' }, owner: { id: '' }, description: '', start_date: '', end_date: '', amount: '', status: 'À faire', gr_due_date: '', links: [] };
      $('po-title').textContent = create ? 'Nouvelle commande d’achat' : 'Modifier la PO ' + cur.po_number;
      var body = $('po-body'); clear(body);
      var f = {};
      var input = function (id, type, value, extra) { var i = el('input', Object.assign({ type: type, id: id, autocomplete: 'off' }, extra || {})); i.value = value === undefined || value === null ? '' : value; f[id] = i; return i; };
      var select = function (id, options, value) { var s = el('select', { id: id }); fillSelect(s, options, value); f[id] = s; return s; };
      var row = function (label, c) { return el('label', { class: 'lbl' }, [label, c]); };
      body.appendChild(el('div', { class: 'ed-row2' }, [
        row('N° de PO (Click and Buy)', input('po-number', 'text', cur.po_number, { maxlength: '40' })),
        row('CPN', input('po-cpn', 'text', cur.cpn, { maxlength: '30', list: 'po-cpns' }))]));
      body.appendChild(el('datalist', { id: 'po-cpns' }, opt.cpns.map(function (c) { return el('option', { value: c.cpn, label: c.label }); })));
      body.appendChild(row('Ressource externe', select('po-resource', [{ value: '', label: '—' }].concat(opt.externals.map(function (r) { return { value: r.id, label: r.name + (r.supplier ? ' — ' + r.supplier : '') }; })), cur.resource.id)));
      body.appendChild(row('Description', input('po-desc', 'text', cur.description, { maxlength: '300' })));
      body.appendChild(el('div', { class: 'ed-row2' }, [row('Début d’activité', input('po-start', 'date', cur.start_date)), row('Fin d’activité', input('po-end', 'date', cur.end_date))]));
      body.appendChild(el('div', { class: 'ed-row2' }, [row('Montant (€)', input('po-amount', 'number', cur.amount, { min: '0', step: 'any' })), row('Statut', select('po-status', STATUSES.map(function (s) { return { value: s, label: s }; }), cur.status))]));
      body.appendChild(el('div', { class: 'ed-row2' }, [
        row('Date à laquelle la GR doit être faite', input('po-due', 'date', cur.gr_due_date)),
        row('Responsable de la GR', select('po-owner', [{ value: '', label: 'Moi' }].concat(opt.internals.map(function (r) { return { value: r.id, label: r.name }; })), cur.owner.id))]));
      var box = el('div', { id: 'po-links' });
      var sum = el('p', { class: 'plink-sum', id: 'po-sum' });
      var delivOptions = [{ value: '', label: 'Choisir un livrable' }].concat(opt.deliverables.map(function (x) { return { value: x.id, label: x.name + (x.wp ? ' (' + x.wp + ')' : '') + (x.budget_external ? '' : ' — sans budget externe') }; }));
      var linkValues = function () {
        return Array.prototype.map.call(box.querySelectorAll('.plink'), function (r) { return { deliverable_id: r.querySelector('.pl-deliv').value, amount: r.querySelector('.pl-amount').value }; });
      };
      var updateSum = function () {
        var total = linkValues().reduce(function (acc, l) { return acc + (Number(l.amount) || 0); }, 0), amt = Number(f['po-amount'].value) || 0;
        var n = box.querySelectorAll('.plink').length, off = Math.abs(total - amt) > 0.005;
        sum.textContent = n ? 'Réparti : ' + eur2(total) + ' sur ' + eur2(amt) + (off ? ' — reste ' + eur2(amt - total) : ' — complet') : 'Aucun livrable lié : le montant pèse sur le CPN sans être rattaché à un livrable.';
        sum.className = 'plink-sum' + (n && off ? ' late' : '');
      };
      var addLink = function (deliv, amount) {
        var s = el('select', { class: 'pl-deliv', 'aria-label': 'Livrable' }); fillSelect(s, delivOptions, deliv || '');
        var a = el('input', { type: 'number', class: 'pl-amount', min: '0', step: 'any', 'aria-label': 'Montant du livrable' }); a.value = amount === undefined ? '' : amount;
        var r = el('div', { class: 'plink' }, [s, a, el('button', { type: 'button', class: 'icon-btn', title: 'Retirer', 'aria-label': 'Retirer ce livrable', text: '×', onclick: function () { box.removeChild(r); updateSum(); } })]);
        a.addEventListener('input', updateSum);
        box.appendChild(r);
      };
      f['po-amount'].addEventListener('input', updateSum);
      cur.links.forEach(function (l) { addLink(l.deliverable_id, l.amount); });
      body.appendChild(el('div', {}, [el('strong', { text: 'Répartition entre livrables' }), box, sum,
        el('div', { class: 'row', style: 'margin-top:8px' }, [
          el('button', { type: 'button', class: 'btn', id: 'po-link-add', text: 'Ajouter un livrable', onclick: function () { addLink('', ''); updateSum(); } }),
          el('button', { type: 'button', class: 'btn', id: 'po-split', text: 'Répartir à parts égales', onclick: function () {
            var rows = box.querySelectorAll('.plink'), amt = Number(f['po-amount'].value) || 0;
            if (!rows.length) return;
            var each = Math.floor(amt * 100 / rows.length) / 100, acc = 0;
            Array.prototype.forEach.call(rows, function (r, i) { var v = i === rows.length - 1 ? Math.round((amt - acc) * 100) / 100 : each; acc += v; r.querySelector('.pl-amount').value = v; });
            updateSum();
          } })])]));
      updateSum();
      $('po-error').hidden = true; $('po-save').disabled = false;
      state.poEditor = { cur: cur, create: create, f: f, links: linkValues };
      openDialog($('po-dialog'));
      f['po-number'].focus();
    }).catch(fail);
  }
  function submitPo() {
    var e = state.poEditor;
    if (!e) return;
    var f = e.f, values = {
      po_number: f['po-number'].value, cpn: f['po-cpn'].value, resource_id: f['po-resource'].value, description: f['po-desc'].value,
      start_date: f['po-start'].value, end_date: f['po-end'].value, amount: f['po-amount'].value, status: f['po-status'].value,
      gr_due_date: f['po-due'].value, owner_resource_id: f['po-owner'].value
    };
    $('po-save').disabled = true;
    call('po.save', { id: e.create ? '' : e.cur.id, version: e.create ? undefined : e.cur.version, values: values, links: e.links().filter(function (l) { return l.deliverable_id || l.amount; }) }, true).then(function (v) {
      closeDialog($('po-dialog'));
      toast(e.create ? 'PO ' + v.po_number + ' enregistrée' + (v.project ? ' sur le projet ' + v.project.code + '.' : ' : son CPN ne correspond à aucun projet de l’outil.') : 'PO enregistrée.');
      return reload();
    }).catch(function (err) {
      $('po-save').disabled = false;
      var m = $('po-error'); m.textContent = err && err.code === 'CONFLICT' ? 'Cette PO a été modifiée entre-temps : fermez, actualisez puis recommencez.' : ppmErrorText(err); m.hidden = false;
    });
  }

  // ------------------------------------------------------------ Budget (lignes)
  function loadBudget() {
    var panel = $('panel-budget');
    if (state.budget) { renderBudget(); return Promise.resolve(); }
    loading(panel);
    return call('budget.get', { projectId: state.projectId }).then(function (b) { state.budget = b; renderBudget(); }).catch(function (e) { failed(panel, e); });
  }
  function ensureResources() {
    if (state.resources) return Promise.resolve(state.resources);
    return call('resources.list', { limit: 500 }).then(function (r) { state.resources = r; return r; }).catch(function () { return []; });
  }
  function renderBudget() {
    var panel = $('panel-budget'), b = state.budget;
    clear(panel);
    var cards = el('div', { class: 'cards' });
    cards.appendChild(card(b.partial ? 'Budget de votre périmètre' : 'Budget du projet', eur(b.totals.total), 'dont ' + eur(b.totals.external) + ' externe, ' + eur(b.totals.internal) + ' interne'));
    if (b.missing.deliverables_without_budget) cards.appendChild(card('Livrables sans budget', String(b.missing.deliverables_without_budget), 'à renseigner', 'alert'));
    if (b.missing.undated_lines) cards.appendChild(card('Lignes sans échéancier', String(b.missing.undated_lines), 'livrable sans dates', 'alert'));
    panel.appendChild(cards);
    panel.appendChild(el('div', { class: 'row' }, [el('button', { type: 'button', class: 'btn primary', id: 'line-add', text: 'Ajouter une ligne de budget', onclick: function () { openLineForm(null); } })]));
    if (!b.lines.length) { panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucune ligne de budget.' }), el('span', { text: 'Chaque ligne relie un livrable à une ressource : jours × taux pour un interne, forfait pour un externe.' })])); return; }
    var dById = {}; b.deliverables.forEach(function (d) { dById[d.id] = d; });
    var seeRate = b.lines.some(function (l) { return l.frozen_rate !== null; });
    var head = ['Livrable', 'Ressource', 'Type', { t: 'Jours' }]; if (seeRate) head.push({ t: 'Taux figé' });
    head = head.concat([{ t: 'Montant' }, 'Échéancier', '']);
    var sorted = b.lines.slice().sort(function (x, y) {
      var a = dById[x.deliverable_id] || {}, c = dById[y.deliverable_id] || {};
      return String(a.wp || '').localeCompare(String(c.wp || ''), 'fr', { numeric: true }) || String(a.name || '').localeCompare(String(c.name || ''), 'fr');
    });
    panel.appendChild(table('lines-table', head, sorted.map(function (l) {
      var d = dById[l.deliverable_id] || { name: '(livrable)', wp: '' };
      var cells = [cell([d.name, d.wp ? el('small', { text: d.wp + (d.cpn ? ' · ' + d.cpn : '') }) : null]), cell(l.resource.name), cell(l.cost_type === 'Forfait' ? 'Forfait (externe)' : 'Jours × taux' + (l.external ? ' (externe)' : '')),
        cell(l.planned_days === null ? '—' : String(l.planned_days), 'num')];
      if (seeRate) cells.push(cell(l.frozen_rate === null ? '—' : eur(l.frozen_rate), 'num'));
      cells.push(cell(eur(l.planned_amount), 'num'));
      cells.push(cell([l.phasing.length ? l.phasing.map(function (m) { return frMonth(m.month) + ' ' + eur(m.amount); }).join(' · ') : el('span', { class: 'late', text: 'aucun (livrable sans dates)' }), el('small', { text: l.phasing_mode === 'manuel' ? 'à la main' : 'automatique' })]));
      cells.push(cell(el('div', { class: 'actions-cell' }, [
        el('button', { type: 'button', class: 'btn line-edit', 'data-id': l.id, text: 'Modifier', onclick: function () { openLineForm(l); } }),
        el('button', { type: 'button', class: 'btn line-phase', 'data-id': l.id, text: 'Échéancier', onclick: function () { openPhasing(l); } }),
        el('button', { type: 'button', class: 'btn line-del', 'data-id': l.id, text: 'Supprimer', onclick: function () { deleteLine(l, d); } })])));
      return el('tr', { 'data-line': l.id }, cells);
    })));
    if (b.totals.by_wp.length > 1) {
      panel.appendChild(el('h2', { class: 'sec', text: 'Par workpackage' }));
      panel.appendChild(table('wp-table', ['Workpackage', { t: 'Interne' }, { t: 'Externe' }, { t: 'Total' }], b.totals.by_wp.map(function (w) {
        return el('tr', {}, [cell((w.code ? w.code + ' ' : '') + w.name), cell(eur(w.internal), 'num'), cell(eur(w.external), 'num'), cell(eur(w.total), 'num')]);
      })));
    }
  }
  function openLineForm(l) {
    ensureResources().then(function (people) {
      var create = !l, b = state.budget;
      var typeOf = {}; people.forEach(function (p) { typeOf[p.resource_id] = p.resource_type; });
      openForm({
        title: create ? 'Nouvelle ligne de budget' : 'Modifier la ligne de budget', ok: create ? 'Ajouter' : 'Enregistrer',
        note: 'Interne : jours × taux journalier de sa fiche (Ressources), figé à la création de la ligne. Externe : un forfait, ou des jours × son taux. L’échéancier se calcule seul et reste modifiable.',
        fields: [
          create ? { key: 'deliverable_id', label: 'Livrable', type: 'select', value: '', options: [{ value: '', label: 'Choisir un livrable' }].concat(b.deliverables.map(function (d) { return { value: d.id, label: d.name + (d.wp ? ' (' + d.wp + ')' : '') }; })) }
            : { key: 'deliverable_id', label: 'Livrable', type: 'select', value: l.deliverable_id, options: b.deliverables.filter(function (d) { return d.id === l.deliverable_id; }).map(function (d) { return { value: d.id, label: d.name }; }) },
          { key: 'resource_id', label: 'Ressource', type: 'select', value: create ? '' : l.resource.id, options: [{ value: '', label: 'Choisir une ressource' }].concat(people.map(function (p) { return { value: p.resource_id, label: p.name + ' (' + (p.resource_type === 'Externe' ? 'externe' : 'interne') + ')' }; })) },
          { key: 'planned_days', label: 'Jours prévus', type: 'number', value: create || l.planned_days === null ? '' : l.planned_days, half: true },
          { key: 'fixed_amount', label: 'Forfait en € (externe seulement)', type: 'number', value: create || l.fixed_amount === null ? '' : l.fixed_amount, half: true }
        ],
        after: function (i) {
          var sync = function () {
            var ext = typeOf[i.resource_id.value] === 'Externe', chosen = !!i.resource_id.value;
            i.fixed_amount.parentNode.hidden = chosen && !ext;
          };
          i.resource_id.addEventListener('change', sync); sync();
        },
        onSubmit: function (v) {
          if (create && !v.deliverable_id) return Promise.reject({ message: 'Choisissez un livrable.' });
          if (!v.resource_id) return Promise.reject({ message: 'Choisissez une ressource.' });
          var values = { resource_id: v.resource_id };
          if (typeOf[v.resource_id] === 'Externe' && v.fixed_amount !== '') values.fixed_amount = v.fixed_amount; else values.planned_days = v.planned_days;
          if (create) values.deliverable_id = v.deliverable_id;
          return call('budget.line.save', { id: create ? '' : l.id, version: create ? undefined : l.version, values: values }, true).then(function () { toast(create ? 'Ligne ajoutée.' : 'Ligne enregistrée.'); return reload(); });
        }
      });
    });
  }
  function deleteLine(l, d) {
    openConfirm('Supprimer cette ligne de budget ?', 'La ligne de « ' + l.resource.name + ' » sur « ' + d.name + ' » (' + eur(l.planned_amount) + ') sera supprimée avec son échéancier.', 'Supprimer', function () {
      return call('budget.line.delete', { id: l.id, version: l.version }, true).then(function () { toast('Ligne supprimée.'); return reload(); });
    });
  }
  function openPhasing(l) {
    openForm({
      title: 'Échéancier de la ligne', ok: 'Enregistrer', note: 'Un mois par ligne : AAAA-MM puis le montant. La somme doit égaler ' + eur2(l.planned_amount) + '.',
      fields: [{ key: 'text', label: 'Mois et montants', type: 'textarea', value: l.phasing.map(function (m) { return m.month + ' ' + m.amount; }).join('\n') }],
      extra: { label: 'Revenir au calcul automatique', run: function () {
        call('budget.phasing.set', { lineId: l.id, mode: 'auto' }, true).then(function () { closeDialog($('genform')); toast('Échéancier recalculé.'); return reload(); }).catch(function (e) { var m = $('gf-error'); m.textContent = ppmErrorText(e); m.hidden = false; });
      } },
      onSubmit: function (v) {
        var months = v.text.split('\n').map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) { var p = x.split(/\s+/); return { month: p[0], amount: (p[1] || '').replace(',', '.') }; });
        return call('budget.phasing.set', { lineId: l.id, months: months }, true).then(function () { toast('Échéancier enregistré.'); return reload(); });
      }
    });
  }

  // ------------------------------------------------------------ événements et démarrage
  $('picker').addEventListener('change', function () { loadProject(this.value); });
  $('cpn-edit').addEventListener('click', editCpn);
  $('gf-form').addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  $('gf-cancel').addEventListener('click', function () { closeDialog($('genform')); });
  $('po-form').addEventListener('submit', function (e) { e.preventDefault(); submitPo(); });
  $('po-cancel').addEventListener('click', function () { closeDialog($('po-dialog')); });
  $('confirm-cancel').addEventListener('click', function () { closeDialog($('confirm')); });
  $('confirm-ok').addEventListener('click', function () { if (state.confirmAction) state.confirmAction(); });

  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var sel = $('picker'); clear(sel);
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    cat.projects.slice().sort(sortCode).forEach(function (p) { sel.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { empty($('panel-bilan'), 'Aucun projet pour l’instant.', 'Créez un projet, puis revenez ici.'); return; }
    return loadProject(first);
  }).catch(function (e) { failed($('panel-bilan'), e); });

  window.__ppm = { state: state, reload: reload };
})();
