<style>
  .box { margin: 0 0 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel { padding: 8px 24px 32px; max-width: 1240px; }
  /* onglets : le suivi budgétaire de l'année en cours, l'opération de planification de la suivante, les archives */
  .tabs { display: flex; align-items: flex-end; gap: 4px; margin: 12px 24px 0; padding: 0; border-bottom: 1px solid var(--rule); overflow-x: auto; }
  .tabs[hidden] { display: none; }
  .tab { flex: none; padding: 10px 18px; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent, #1f6feb); }
  .tab:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: -2px; border-radius: 6px; }
  .tabs select { margin: 0 0 6px 8px; }
  .cell[hidden] { display: none; }
  /* sections rétractables : même présentation que la page Actualités */
  .sec-toggle { display: flex; align-items: baseline; gap: 8px; width: 100%; margin: 0; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: inherit; font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
  .sec-toggle:hover { border-color: var(--muted); }
  .sec-toggle:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: 2px; }
  .sec-toggle .chev { flex: none; width: 14px; color: var(--muted); }
  .sec-toggle .sec-sum { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); text-align: right; }
  .sec-toggle.needs .sec-sum { color: var(--warn-ink, #8a5a00); font-weight: 600; }
  h2.sec.collapsible { padding-left: 0; }
  h2.sec.collapsible::before { content: none; }
  .panel.collapsed { display: none; }
  /* versions figées : la liste à gauche, la comparaison à droite */
  .ver-grid { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 20px; align-items: start; }
  .ver-grid .compare-col { min-width: 0; }
  @media (max-width: 900px) { .ver-grid { grid-template-columns: 1fr; } }
  .ver-meta { display: block; color: var(--muted); font-size: 12.5px; }
  /* graphique : histogramme empilé par workpackage, cumul, budget (moderne, thème clair et sombre) */
  #panel-graph, .chart-box { --c1: #3b82f6; --c2: #14b8a6; --c3: #f59e0b; --c4: #a855f7; --c5: #ef4444; --c6: #22c55e; --c7: #0ea5e9; --c8: #ec4899; }
  .chart-box { position: relative; margin: 10px 0 4px; }
  @media (prefers-color-scheme: dark) { #panel-graph, .chart-box { --c1: #60a5fa; --c2: #2dd4bf; --c3: #fbbf24; --c4: #c084fc; --c5: #f87171; --c6: #4ade80; --c7: #38bdf8; --c8: #f472b6; } }
  .chart-box svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-box .ch-axis { stroke: var(--rule); stroke-width: 1; }
  .chart-box .ch-grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 5; opacity: .75; }
  .chart-box text { fill: var(--muted); font-size: 11.5px; font-family: inherit; }
  .chart-box text.ch-cur { fill: var(--ink); font-weight: 600; }
  .chart-box text.ch-right { fill: var(--muted); opacity: .85; }
  .chart-box .bar-seg { transition: opacity .15s, filter .15s; stroke: var(--surface); stroke-width: 1; }
  .chart-box .bar-seg.future { opacity: .5; }
  .chart-box .ch-band { fill: transparent; }
  .chart-box .ch-band:hover { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
  .chart-box .ch-cum { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; opacity: .85; }
  .chart-box .ch-dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .chart-box .ch-dot.now { fill: var(--ink); }
  .chart-box .ch-budget { stroke: var(--alert-ink, #c62828); stroke-width: 1.6; stroke-dasharray: 7 6; }
  .chart-box .ch-budget-label { fill: var(--alert-ink, #c62828); font-weight: 600; }
  .chart-box .ch-now { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
  .ch-tip { position: absolute; z-index: 5; min-width: 200px; max-width: 280px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 6px 22px rgba(0, 0, 0, .18); font-size: 12.5px; pointer-events: none; }
  .ch-tip strong { display: block; margin-bottom: 6px; font-size: 13px; }
  .ch-tip .tip-row, .ch-tip .tip-total { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .ch-tip .tip-row span, .ch-tip .tip-total span { flex: 1; color: var(--muted); }
  .ch-tip .tip-row i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .ch-tip .tip-total { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--rule); }
  .wp-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .wp-legend .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .wp-legend .chip i { width: 10px; height: 10px; border-radius: 3px; }
  .wp-legend .chip:hover { border-color: var(--muted); }
  .wp-legend .chip.off { opacity: .5; text-decoration: line-through; }
  .wp-legend .chip:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: 2px; }
  /* enregistrement explicite : « Valider » en bas de la zone, bleu quand il y a des modifications */
  .save-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); }
  .save-bar .btn:disabled { opacity: .55; cursor: default; }
  .save-hint { margin: 0; color: var(--accent, #1f6feb); font-weight: 600; }
  .env-input.changed { border-color: var(--accent, #1f6feb); box-shadow: 0 0 0 1px var(--accent, #1f6feb); }
  .env-table tr.over td, #env-table tr.over td { background: color-mix(in srgb, var(--red, #c62828) 6%, transparent); }
  #env-table tr.item-row td { background: transparent; }
  #env-table .env-item { color: var(--ink); }
  #env-table .item-ico { color: var(--muted); display: inline-block; width: 14px; }
  #env-table tr.is-milestone td { color: var(--muted); }
  .cost-btn { margin-left: 8px; width: 26px; height: 26px; padding: 0; border: 1px solid var(--rule); border-radius: 50%; background: var(--surface); color: var(--accent, #1f6feb); font: inherit; font-weight: 700; cursor: pointer; line-height: 1; }
  .cost-btn:hover { border-color: var(--accent, #1f6feb); background: color-mix(in srgb, var(--accent, #1f6feb) 8%, var(--surface)); }
  .cost-btn:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: 2px; }
  #cost-dialog { width: min(1000px, calc(100% - 32px)); max-width: none; max-height: 92vh; }
  #cost-dialog .table-wrap { overflow-x: auto; }
  .cost-form { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; }
  .cost-form .row { flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .cost-form select, .cost-form input { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .import-dialog { width: min(760px, 94vw); max-height: 90vh; }
  .imp-step { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; }
  .imp-step .note { margin: 4px 0 8px; }
  .imp-step .lbl { display: block; margin: 8px 0; }
  .imp-step input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .imp-head.ok { color: var(--ok-ink); font-weight: 600; } .imp-head.bad { color: var(--alert-ink); font-weight: 600; }
  .imp-sub { margin: 10px 0 4px; font-size: 14px; }
  .imp-list { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; max-height: 220px; overflow: auto; }
  .imp-counts { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }
  h2.sec { margin: 24px 0 12px; font-size: 16px; font-weight: 600; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 76ch; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.late { color: var(--red); font-weight: 500; }
  td.nowrap { white-space: nowrap; }
  tr.total td { font-weight: 600; background: var(--tint); }
  td small.late { color: var(--red); }
  select.inline, input.inline { padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
  #genform { width: min(560px, calc(100% - 32px)); max-width: none; }
  #po-dialog { width: min(680px, calc(100% - 32px)); max-width: none; max-height: calc(100vh - 32px); overflow: auto; }
  .ed-grid input, .ed-grid select, .ed-grid textarea { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
  .plink { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; align-items: center; margin-top: 6px; }
  .plink-sum { margin: 6px 0 0; font-size: 14px; }
  .plink-sum.late { color: var(--red); }
  @media (max-width: 700px) { .panel { padding: 8px 12px 24px; } .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } .ed-row2, .plink { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title">
    <h1 id="title">Budget</h1>
    <span id="cpn-chip" class="badge" hidden></span>
    <button type="button" class="btn" id="cpn-edit" hidden>CPN</button>
  </div>
  <div class="controls"><select id="picker" aria-label="Projet"></select></div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Suivi budgétaire et opération de planification">
  <button type="button" role="tab" class="tab" id="tab-suivi" data-tab="suivi" aria-selected="true">Suivi budgétaire</button>
  <button type="button" role="tab" class="tab" id="tab-op" data-tab="op" aria-selected="false">OP</button>
  <button type="button" role="tab" class="tab" id="tab-archive" data-tab="archive" aria-selected="false" hidden>Archives</button>
  <select id="archive-picker" class="inline" aria-label="Exercice clos" hidden></select>
</nav>

<main class="zones" style="--cell-min: 820px; --max-cols: 2">
  <div class="cell wide" id="cell-program">
    <div class="zone" id="zone-program" hidden><h2 class="sec">Vue programme : budget et achats de tous les projets</h2></div>
    <section class="panel" id="panel-program" aria-label="Vue programme" hidden></section>
  </div>
  <div class="cell wide" id="cell-enveloppe">
    <div class="zone" id="zone-enveloppe" hidden><h2 class="sec">Décomposition du Budget</h2></div>
    <section class="panel" id="panel-enveloppe" aria-label="Décomposition du Budget" hidden></section>
  </div>
  <div class="cell wide" id="cell-proj">
    <div class="zone" id="zone-proj" hidden><h2 class="sec">Projection de fin d’année</h2></div>
    <section class="panel" id="panel-proj" aria-label="Projection de fin d’année" hidden></section>
  </div>
  <div class="cell wide" id="cell-graph">
    <div class="zone" id="zone-graph" hidden><h2 class="sec">Prévisionnel budgétaire par mois et par workpackage</h2></div>
    <section class="panel" id="panel-graph" aria-label="Prévisionnel budgétaire par mois et par workpackage" hidden></section>
  </div>
  <div class="cell" id="cell-bilan">
    <div class="zone" id="zone-bilan" hidden><h2 class="sec">Bilan par CPN</h2></div>
    <section class="panel" id="panel-bilan" aria-label="Bilan par CPN" hidden></section>
  </div>
  <div class="cell" id="cell-po">
    <div class="zone" id="zone-po" hidden><h2 class="sec">Achats (PO)</h2></div>
    <section class="panel" id="panel-po" aria-label="Achats (PO)" hidden></section>
  </div>
  <div class="cell wide" id="cell-track">
    <div class="zone" id="zone-track" hidden><h2 class="sec">Par équipe : accordé, prévu, avancement</h2></div>
    <section class="panel" id="panel-track" aria-label="Par équipe : accordé, prévu, avancement" hidden></section>
  </div>
  <div class="cell wide" id="cell-exercice">
    <div class="zone" id="zone-exercice" hidden><h2 class="sec">Budget par équipe</h2></div>
    <section class="panel" id="panel-exercice" aria-label="Budget par équipe" hidden></section>
  </div>
</main>

<dialog id="genform" aria-labelledby="gf-title">
  <form id="gf-form" novalidate>
    <h2 id="gf-title"></h2>
    <div class="ed-grid" id="gf-body"></div>
    <p class="ed-error" id="gf-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="gf-extra" hidden></button>
      <button type="button" class="btn" id="gf-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="gf-ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="po-dialog" aria-labelledby="po-title">
  <form id="po-form" novalidate>
    <h2 id="po-title"></h2>
    <div class="ed-grid" id="po-body"></div>
    <p class="ed-error" id="po-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="po-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="po-save">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="eximp" aria-labelledby="eximp-title" class="import-dialog">
  <div class="imp-box">
    <h2 id="eximp-title">Importer l’exercice</h2>
    <div id="eximp-body"></div>
    <div class="actions"><button type="button" class="btn" id="eximp-close">Fermer</button></div>
  </div>
</dialog>

<dialog id="cost-dialog" aria-labelledby="cost-title" class="import-dialog">
  <div class="imp-box">
    <h2 id="cost-title">Coût du livrable</h2>
    <p class="note" id="cost-sub"></p>
    <div id="cost-body"></div>
    <div class="actions"><button type="button" class="btn" id="cost-close">Fermer</button></div>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <p class="ed-error" id="confirm-error" role="alert" hidden></p>
  <div class="actions">
    <button type="button" class="btn" id="confirm-cancel">Annuler</button>
    <button type="button" class="btn danger" id="confirm-ok">Supprimer</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, openDialog = ppm.openDialog, closeDialog = ppm.closeDialog, frDate = ppm.frDate;

  /**
   * Les zones de la page et ce qui les montre : l'onglet (suivi budgétaire de l'année en cours, OP de l'année suivante, archives) et le droit d'accès ; `open` : déployée au départ.
   * Une zone se replie d'un clic sur son titre (même présentation que la page Actualités) ; le choix de la personne est gardé tant que la page reste ouverte.
   */
  var CELLS = [
    { id: 'enveloppe', tabs: ['suivi', 'op', 'archive'], access: 'budget', fixed: true },     // en haut, toujours visible : la décomposition du budget de l'exercice de l'onglet
    { id: 'proj', tabs: ['suivi'], access: 'budget', fixed: true },
    { id: 'graph', tabs: ['suivi'], access: 'budget', fixed: true },
    { id: 'bilan', tabs: ['suivi'], access: 'all', open: false },
    { id: 'po', tabs: ['suivi'], access: 'po', open: false },
    { id: 'track', tabs: ['suivi'], access: 'exercise', open: false },
    { id: 'exercice', tabs: ['op', 'archive'], access: 'exercise', open: true }
  ];
  var state = { projectId: '', catalog: null, access: null, balance: null, po: null, envelope: null, budget: null, exercises: null, exerciseId: '', exercise: null, tracking: null, envDraft: null, exDraft: {}, costData: null, costItem: null, epoch: 0, tab: 'suivi', execEx: null, prepEx: null, closedEx: [], archiveId: '', sections: {}, outside: null, resources: null, seq: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var STATUS_TONE = { 'À faire': '', 'Lancée': 'warn', 'GR': 'ok', 'Terminée': 'ok' };
  var STATUSES = ['À faire', 'Lancée', 'GR', 'Terminée'];

  // ------------------------------------------------------------ outils
  function eur(n) { return n === null || n === undefined ? '' : Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
  function eur2(n) { return Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function frMonth(m) { var p = String(m).split('-'); return p[1] + '/' + p[0]; }
  function loading(p) { clear(p); p.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(p, title, text) { p.hidden = false; clear(p); p.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text || '' })])); }
  function card(k, v, s, tone) { return el('div', { class: 'card' + (tone ? ' ' + tone : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]); }
  function table(id, head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', { id: id }, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { var num = typeof h === 'object'; return el('th', { scope: 'col', class: num ? 'num' : '', text: num ? h.t : h }); }))]),
      el('tbody', {}, rows)])]);
  }
  function cell(content, cls) { return el('td', { class: cls || '' }, [].concat(content)); }
  function fail(e) { toast(window.ppmErrorText ? ppmErrorText(e) : (e && e.message) || 'Opération impossible.', true); }
  function failed(p, e) { empty(p, 'Chargement impossible.', (e && e.message) || 'Erreur inconnue.'); }

  // ------------------------------------------------------------ formulaire générique et confirmation
  var forms = ppm.forms({ $: $, state: state });
  var fillSelect = forms.fillSelect, openForm = forms.openForm, submitForm = forms.submitForm, openConfirm = forms.openConfirm;

  // ------------------------------------------------------------ navigation et chargement
  /** Chaque zone se montre si l'onglet actif la prévoit et si l'on y a droit ; sa déployée ou repliée suit le choix de la personne, sinon sa valeur de départ. */
  function syncZones() {
    var a = state.access || {};
    CELLS.forEach(function (c) {
      var show = c.tabs.indexOf(state.tab) >= 0 && !!a[c.access];
      $('cell-' + c.id).hidden = !show; $('zone-' + c.id).hidden = !show; $('panel-' + c.id).hidden = !show;
      setOpen(c.id, c.id in state.sections ? state.sections[c.id] : c.open);
    });
    try { google.script.history.replace(null, { view: 'budget', project: state.projectId }); } catch (e) { /* hors web app */ }
    var base = BOOT.baseUrl || '';
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (n) {
      var v = n.getAttribute('data-view');
      if (['gantt', 'structure', 'suivi', 'copilote', 'budget'].indexOf(v) >= 0 && state.projectId) n.setAttribute('href', base + '?view=' + v + '&project=' + state.projectId);
    });
  }
  function setOpen(id, open) {
    var btn = $('toggle-' + id), panel = $('panel-' + id);
    if (!btn) return;
    btn.setAttribute('aria-expanded', String(open));
    btn.querySelector('.chev').textContent = open ? '▾' : '▸';
    panel.classList.toggle('collapsed', !open);
  }
  function setSummary(id, text) { var x = $('sum-' + id); if (x) x.textContent = text || ''; }
  function initSections() {
    CELLS.forEach(function (c) {
      if (c.fixed) return;   // une zone fixe n'est pas rétractable : son titre reste un simple titre
      var h2 = $('zone-' + c.id).querySelector('h2'), title = h2.textContent;
      clear(h2); h2.classList.add('collapsible');
      var btn = el('button', { type: 'button', class: 'sec-toggle', id: 'toggle-' + c.id, 'aria-expanded': 'true', 'aria-controls': 'panel-' + c.id }, [el('span', { class: 'chev', 'aria-hidden': 'true', text: '▾' }), el('span', { class: 'sec-title', text: title }), el('span', { class: 'sec-sum', id: 'sum-' + c.id })]);
      btn.addEventListener('click', function () { var open = btn.getAttribute('aria-expanded') !== 'true'; state.sections[c.id] = open; setOpen(c.id, open); });
      h2.appendChild(btn);
    });
  }

  // ------------------------------------------------------------ onglets : suivi budgétaire (année en cours), OP (année suivante), archives
  function tabLabel(t) {
    if (t === 'suivi') return 'Suivi budgétaire' + (state.execEx ? ' ' + state.execEx.year : '');
    if (t === 'op') return 'OP' + (state.prepEx ? ' ' + state.prepEx.year : '');
    return 'Archives';
  }
  function activeExercise() {
    if (state.tab === 'suivi') return state.execEx;
    if (state.tab === 'op') return state.prepEx;
    return (state.closedEx || []).filter(function (e) { return e.id === state.archiveId; })[0] || null;
  }
  function exPanelId() { return 'panel-exercice'; }
  function refreshTabs() {
    ['suivi', 'op', 'archive'].forEach(function (t) { var b = $('tab-' + t); b.textContent = tabLabel(t); b.setAttribute('aria-selected', String(state.tab === t)); });
    $('tab-archive').hidden = !state.closedEx.length;

  // ------------------------------------------------------------ Budget (lignes)
  // ------------------------------------------------------------ enveloppe par workpackage (0.15.3)
  /**
   * Le chef de projet fixe le budget autorisé du projet et le répartit entre les workpackages ; un Workpackage leader répartit le sien entre ses sous-workpackages. Les lignes de
   * budget des livrables donnent le coût prévu, mis en regard : dépasser est signalé, jamais refusé. Vide = pas de plafond.
   */
  function badge(text, tone) { return el('span', { class: 'badge' + (tone ? ' ' + tone : ''), text: text }); }
  // ------------------------------------------------------------ décomposition du budget
  /**
   * La DÉCOMPOSITION DU BUDGET : un seul tableau, comme le WBS (workpackages, sous-workpackages, puis leurs livrables et jalons). L'enveloppe se fixe sur un workpackage (jamais sur un livrable) ; le
   * coût d'un livrable est celui de ses lignes (parts d'équipe, forfaits) : le bouton € de la colonne « Coût prévu » ouvre la fenêtre « Coût du livrable ».
   * Rien ne s'enregistre à chaque frappe : les modifications restent en brouillon jusqu'au bouton « Valider » en bas de la zone, qui devient bleu quand il y a quelque chose à enregistrer.
   * On peut écrire des montants qui dépassent la somme autorisée : l'état devient « En dépassement » (en rouge), rien n'est refusé.
   */
  function loadEnvelope() {
    var panel = $('panel-enveloppe'), epoch = state.epoch, ex = currentExercise();
    if (!ex) {
      // ÉTANCHE : sans exercice pour cet onglet, aucune donnée financière (le budget de l'autre année ne s'affiche jamais ici)

      line({ r: Object.assign({}, r, { expected: r.own.expected, granted: r.own.granted, parts: r.own.parts, gap_expected: r.own.expected === null ? null : Math.round((r.own.expected - r.own.parts) * 100) / 100, gap_granted: r.own.granted === null ? null : Math.round((r.own.granted - r.own.parts) * 100) / 100, clash: r.own.granted !== null && r.own.parts > r.own.granted }), label: r.name + ' (équipe seule)', teamId: r.team_id, indent: 16 });
      r.children.forEach(function (c) {
        line({ r: { expected: c.expected, granted: c.granted, parts: c.parts, gap_expected: c.expected === null ? null : Math.round((c.expected - c.parts) * 100) / 100, gap_granted: c.granted === null ? null : Math.round((c.granted - c.parts) * 100) / 100, clash: c.granted !== null && c.parts > c.granted, team_id: c.team_id }, label: c.name, teamId: c.team_id, indent: 16 });
      });
    });
    if (v.rows.length) {
      panel.appendChild(table('exercise-table', ['Équipe', { t: 'Attendu' }, { t: 'Accordé' }, { t: 'Livrables (parts)' }, { t: 'Écart attendu' }, { t: 'Écart accordé' }], rows));
      if (v.can_edit_expected || v.can_edit_granted) {
        exBar = saveBar('ex', saveExercise, function () { state.exDraft = {}; state.exercise = null; loadExercise(); });
        panel.appendChild(exBar); exBar.sync(exDirty());
      } else exBar = null;
    } else {
      panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucun budget d’équipe pour cet exercice.' }), el('span', { text: v.can_edit ? 'Ajoutez les équipes (3 caractères) et leur budget attendu.' : '' })]));
    }
    // équipes qui ne s'additionnent nulle part
    if (v.orphans.length) panel.appendChild(el('p', { class: 'note late', id: 'exercise-orphans', text: 'Équipes à 4 caractères sans équipe parente à 3 caractères (non additionnées) : ' + v.orphans.map(function (o) { return o.name + ' (attendu ' + (o.expected === null ? '—' : eur(o.expected)) + ', parts ' + eur(o.parts) + ')'; }).join(' ; ') + '.' }));
    if (v.unruled.length) panel.appendChild(el('p', { class: 'note late', id: 'exercise-unruled', text: 'Parts sur des équipes dont le nom n’a pas 3 ou 4 caractères (hors règle, non comptées dans les équipes ci-dessus) : ' + v.unruled.map(function (o) { return o.name + ' ' + eur(o.parts); }).join(' ; ') + '.' }));
    // exporter / importer l'exercice dans un classeur Google Sheet (la préparation se fait dans un tableur)
    if (v.can_edit) panel.appendChild(el('div', { class: 'row' }, [el('button', { type: 'button', class: 'btn', id: 'exercise-import', text: 'Exporter ou importer l’exercice (Google Sheet)', onclick: openExerciseImport })]));
    // ajouter une équipe au tableau
    if (v.can_edit) {
      var inTable = {};
      v.rows.forEach(function (r) { inTable[r.team_id] = true; r.children.forEach(function (c) { inTable[c.team_id] = true; }); });
      var choices = v.teams.filter(function (c) { return !c.orphan && !inTable[c.id]; });
      if (choices.length) {
        var sel = el('select', { id: 'exercise-team-pick', class: 'inline', 'aria-label': 'Équipe à ajouter' }, [el('option', { value: '', text: 'Ajouter une équipe…' })].concat(choices.map(function (c) { return el('option', { value: c.id, text: c.name + (c.level === 4 ? ' (détail de ' + c.parent + ')' : '') + ' · ' + c.country }); })));
        var add = el('button', { type: 'button', class: 'btn', id: 'exercise-team-add', text: 'Ajouter', onclick: function () {
          if (!sel.value) return;
          saveTeamBudget(sel.value, ex.status === 'Préparation' ? 'expected' : 'granted', '0', null, '');
        } });
        panel.appendChild(el('div', { class: 'row' }, [sel, add]));
      }
    }
  }

  // ------------------------------------------------------------ suivi budgétaire : par équipe
  /** « Par équipe » : accordé, prévu, avancement (exercice en exécution). Les écarts s'affichent, rien ne bloque. */
  function signed(n) { return n === null || n === undefined ? '—' : (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + eur(Math.abs(n)); }
  function loadTracking() {
    var ex = state.execEx, box = $('panel-track');
    if (!ex) { clear(box); box.appendChild(el('div', { class: 'empty', id: 'tracking-empty' }, [el('strong', { text: 'Aucun exercice en exécution.' }), el('span', { text: 'Le suivi budgétaire porte sur l’année en cours : l’administrateur passe l’exercice en exécution (page Administration).' })])); setSummary('track', ''); return Promise.resolve(); }
    if (state.tracking) { renderTrackTable(state.tracking); return Promise.resolve(); }
    loading(box);
    var epoch = state.epoch;
    return call('exercise.tracking', { projectId: state.projectId, exerciseId: ex.id }).then(function (d) { if (epoch !== state.epoch) return; state.tracking = d; renderTrackTable(d); }).catch(function (e) { if (epoch === state.epoch) failed(box, e); });
  }
  function renderTrackTable(d) {
    var box = $('panel-track'); clear(box);
    if (!d.teams.length) { box.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucune part de livrable dans l’exercice ' + d.exercise.year + '.' }), el('span', { text: 'Rattachez des livrables à l’exercice et chiffrez leurs parts par équipe.' })])); setSummary('track', ''); return; }
    var rows = d.teams.map(function (t) {
      return el('tr', { 'data-team': t.team_id }, [
        cell([t.name, el('small', { text: t.country })]),
        cell(t.granted !== null ? eur(t.granted) : t.expected !== null ? eur(t.expected) + ' (attendu)' : '—', 'num'),
        cell(eur(t.planned_year), 'num'),
        cell([signed(t.remaining), t.clash ? el('span', { class: 'badge alert', style: 'margin-left:6px', text: 'clash' }) : null], 'num' + (t.clash ? ' late' : '')),
        cell(eur(t.pv), 'num'), cell(eur(t.ev), 'num'), cell(signed(t.ev_gap), 'num' + (t.ev_gap < -0.5 ? ' late' : ''))]);
    });
    var tt = d.totals;
    rows.push(el('tr', { class: 'total' }, [cell('Total'), cell(tt.granted !== null ? eur(tt.granted) : tt.expected !== null ? eur(tt.expected) + ' (attendu)' : '—', 'num'), cell(eur(tt.planned_year), 'num'), cell(signed(tt.remaining), 'num' + (tt.clash ? ' late' : '')), cell(eur(tt.pv), 'num'), cell(eur(tt.ev), 'num'), cell(signed(tt.ev_gap), 'num' + (tt.ev_gap < -0.5 ? ' late' : ''))]));
    box.appendChild(table('track-table', ['Équipe', { t: 'Budget' }, { t: 'Prévu de l’année' }, { t: 'Reste' }, { t: 'Prévu à ce jour' }, { t: 'Valeur acquise' }, { t: 'Écart à ce jour' }], rows));
    var clashes = d.teams.filter(function (t) { return t.clash; }).length;
    setSummary('track', plural(d.teams.length, 'équipe', 'équipes') + (clashes ? ' · ' + plural(clashes, 'clash', 'clashs') : ''));
  }

  // ------------------------------------------------------------ exercice : export et import par classeur Google Sheet
  /**
   * La préparation de l'exercice se fait d'abord dans un tableur. (1) créer le classeur, prérempli avec l'exercice choisi (c'est aussi l'export) ; (2) coller le lien du classeur modifié et « Analyser »
   * (un rapport, rien n'est écrit) ; (3) « Importer », seulement sans erreur, par lots. Les valeurs du classeur sont appliquées ; une cellule vide ne change rien ; rien n'est supprimé.
   */
  var eximp = { report: null, book: '', exerciseId: '', busy: false };
  function eximpBusy(on, msg) {
    eximp.busy = on;
    ['eximp-template', 'eximp-analyze', 'eximp-run'].forEach(function (id) { var b = $(id); if (b) b.disabled = on || (id === 'eximp-run' && !(eximp.report && eximp.report.ok && !eximp.report.nothing_to_do)); });
    var st = $('eximp-status'); if (st) st.textContent = msg || '';
  }
  function eximpCounts(c) {
    var b = c.budgets, p = c.parts;
    return [b.create + b.update + b.same ? 'Budget par équipe : ' + b.create + ' à créer, ' + b.update + ' à modifier, ' + b.same + ' inchangée' + (b.same > 1 ? 's' : '') : '',
      p.create + p.update + p.same ? 'Parts des livrables : ' + p.create + ' à créer, ' + p.update + ' à modifier, ' + p.same + ' inchangée' + (p.same > 1 ? 's' : '') : ''].filter(Boolean);
  }
  function eximpRender() {
    var box = $('eximp-report'), rep = eximp.report;
    clear(box);
    if (!rep) return;
    box.appendChild(el('p', { class: 'imp-head ' + (rep.ok ? 'ok' : 'bad'), id: 'eximp-head', role: 'status', text: rep.ok ? (rep.nothing_to_do ? 'Rien à importer : le classeur correspond déjà à l’exercice.' : 'Analyse sans erreur : voici ce qui sera fait.') : 'Le classeur a ' + rep.errors_count + (rep.errors_count > 1 ? ' erreurs' : ' erreur') + ' : corrigez-les dans le classeur, puis relancez « Analyser ». Rien n’a été écrit.' }));
    if (rep.ok) box.appendChild(el('ul', { class: 'imp-counts', id: 'eximp-counts' }, eximpCounts(rep.counts).map(function (t) { return el('li', { text: t }); })));
    var list = function (title, items, id) {
      if (!items.length) return;
      box.appendChild(el('h3', { class: 'imp-sub', text: title }));
      box.appendChild(el('ul', { class: 'imp-list', id: id }, items.map(function (x) { return el('li', {}, [el('strong', { text: x.tab + (x.row ? ', ligne ' + x.row : '') + ' — ' }), x.message]); })));
    };
    list('Erreurs (' + rep.errors_count + ')', rep.errors, 'eximp-errors');
    list('À savoir (' + rep.warnings_count + ')', rep.warnings, 'eximp-warnings');
  }
  function eximpReset() { eximp.report = null; eximpRender(); eximpBusy(false, ''); }
  function openExerciseImport() {
    var ex = currentExercise();
    if (!ex) { toast('Choisissez d’abord un exercice.', true); return; }
    eximp.report = null; eximp.book = ''; eximp.exerciseId = ex.id;
    $('eximp-title').textContent = 'Exporter ou importer l’exercice ' + ex.year + ' (' + ex.status.toLowerCase() + ')';
    var body = $('eximp-body'); clear(body);
    body.appendChild(el('p', { class: 'note', text: 'La préparation se fait d’abord dans un tableur : budget attendu par équipe et par projet, puis parts des livrables par équipe, puis accordé. Les valeurs du classeur sont appliquées ; une cellule vide ne change rien ; rien n’est supprimé ; une copie de sécurité est enregistrée avant de modifier des valeurs existantes. Les livrables doivent exister déjà (page WBS).' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '1. Le classeur (aussi un export)' }),
      el('p', { class: 'note', text: 'Créé dans Drive et partagé avec vous, prérempli avec l’exercice de vos projets.' }),
      el('button', { type: 'button', class: 'btn', id: 'eximp-template', text: 'Créer le classeur', onclick: eximpTemplate }), el('div', { id: 'eximp-template-out' })]));
    var input = el('input', { type: 'text', id: 'eximp-book', placeholder: 'https://docs.google.com/spreadsheets/d/…', autocomplete: 'off', 'aria-label': 'Lien du classeur à importer' });
    input.addEventListener('input', function () { eximp.book = input.value; eximpReset(); });
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '2. Analyser' }), el('label', { class: 'lbl' }, ['Lien du classeur modifié', input]),
      el('button', { type: 'button', class: 'btn', id: 'eximp-analyze', text: 'Analyser', onclick: eximpAnalyze })]));
    body.appendChild(el('div', { id: 'eximp-report' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '3. Importer' }),
      el('button', { type: 'button', class: 'btn primary', id: 'eximp-run', text: 'Importer', disabled: true, onclick: eximpRun }),
      el('span', { class: 'note', id: 'eximp-status', role: 'status', 'aria-live': 'polite' }), el('div', { id: 'eximp-backup' })]));
    openDialog($('eximp'));
  }
  function eximpError(e) { eximpBusy(false, ''); toast(ppmErrorText(e), true); }
  function eximpTemplate() {
    eximpBusy(true, 'Création du classeur…');
    call('exercise.import.template', { exerciseId: eximp.exerciseId }, true).then(function (t) {
      eximp.book = t.url; $('eximp-book').value = t.url;
      var out = $('eximp-template-out'); clear(out);
      out.appendChild(el('p', {}, [el('a', { href: t.url, target: '_blank', rel: 'noopener', id: 'eximp-template-link', text: 'Ouvrir « ' + t.name + ' »' }), ' — ' + plural(t.prefilled.budgets, 'ligne de budget', 'lignes de budget') + ', ' + plural(t.prefilled.parts, 'part de livrable', 'parts de livrables') + '.']));
      (t.warnings || []).forEach(function (w) { out.appendChild(el('p', { class: 'note', text: w })); });
      eximpBusy(false, '');
    }).catch(eximpError);
  }
  function eximpAnalyze() {
    if (!String(eximp.book || '').trim()) { toast('Collez d’abord le lien du classeur.', true); return; }
    eximpBusy(true, 'Analyse…');
    call('exercise.import.analyze', { exerciseId: eximp.exerciseId, book: eximp.book }).then(function (rep) { eximp.report = rep; eximpRender(); eximpBusy(false, ''); }).catch(eximpError);
  }
  function eximpRun() {
    if (!eximp.report || !eximp.report.ok) return;
    var lot = 0, total = null;
    var next = function () {
      lot++;
      eximpBusy(true, 'Import en cours — lot ' + lot + (total === null ? '' : ', reste ' + total + ' opération(s)') + '…');
      return call('exercise.import.run', { exerciseId: eximp.exerciseId, book: eximp.book, resume: lot > 1 }, true).then(function (r) {
        if (r.backup) { var b = $('eximp-backup'); clear(b); b.appendChild(el('p', { class: 'note' }, ['Copie de sécurité enregistrée avant l’import : ', el('a', { href: r.backup.url, target: '_blank', rel: 'noopener', id: 'eximp-backup-link', text: r.backup.name })])); }
        total = r.remaining;
        if (r.done) return r;
        if (lot >= 60) throw new Error('Import interrompu après 60 lots : relancez-le pour continuer.');
        return next();
      });
    };
    next().then(function () {
      eximp.report = null; eximpRender(); eximpBusy(false, 'Import terminé.'); $('eximp-run').disabled = true;
      toast('Exercice importé.');
      return reload();
    }).catch(eximpError);
  }

  // ------------------------------------------------------------ événements et démarrage
  // vue programme (PL et DPL) : une ligne par projet, reprise de leur bilan ; un clic sur un projet ouvre son budget
  var pv = ppm.programView({
    hide: ['tabs', 'cell-enveloppe', 'cell-proj', 'cell-graph', 'cell-track', 'cell-exercice', 'cell-bilan', 'cell-po'], zone: 'zone-program', panel: 'panel-program', action: 'budget.program',
    render: function (d, host) {
      host.appendChild(el('p', { class: 'program-note', text: 'Programme ' + d.program.code + ' — ' + d.program.name + '. Montants repris du bilan de chaque projet ; cliquez sur un projet pour le détail.' }));
      var open = function (row) { pv.leave(); loadProject(row.id); };
      var cols = [
        { label: 'Projet', link: true, get: function (r) { return r.code + ' ' + r.name; } },
        { label: 'CPN', get: function (r) { return r.cpn || '—'; } },
        { label: 'Budget', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.budget_total); }, total: function (t) { return ppm.eur(t.budget_total); } },
        { label: 'dont interne', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.budget_internal); }, total: function (t) { return ppm.eur(t.budget_internal); } },
        { label: 'dont externe', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.budget_external); }, total: function (t) { return ppm.eur(t.budget_external); } },
        { label: 'Engagé (PO)', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.po_committed); }, total: function (t) { return ppm.eur(t.po_committed); } },
        { label: 'Reçu', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.po_received); }, total: function (t) { return ppm.eur(t.po_received); } },
        { label: 'PO à faire', num: true, get: function (r) { return r.restricted ? '—' : ppm.eur(r.po_planned); }, total: function (t) { return ppm.eur(t.po_planned); } },
        { label: 'Reste externe', num: true, cls: function (r) { return r.overrun ? 'bad' : ''; }, get: function (r) { return r.restricted ? '—' : ppm.eur(r.remaining_external); }, total: function (t) { return ppm.eur(t.remaining_external); } },
        { label: 'Situation', get: function (r) { return r.restricted ? 'Accès restreint' : r.overrun ? 'Dépassement' : r.status === 'Clos' ? 'Clos' : 'Dans le budget'; }, cls: function (r) { return r.overrun ? 'bad' : r.restricted ? 'warn' : 'ok'; },
          total: function (t) { return t.overruns ? plural(t.overruns, 'dépassement', 'dépassements') : ''; } }
      ];
      host.appendChild(ppm.table(cols, d.projects, { open: open, total: d.totals }));
      var ex = state.prepEx || state.execEx;   // la vue programme montre l'exercice de l'année suivante, à défaut celui de l'année en cours
      if (ex) {
        call('exercise.program', { programId: d.program.id, exerciseId: ex.id }).then(function (x) {
          var gap = function (g) { return g === null || g === undefined ? '—' : gapText(g); };
          host.appendChild(el('h2', { class: 'sec', id: 'program-exercise-title', text: 'Exercice ' + ex.year + ' (' + ex.status.toLowerCase() + ') : budget par projet' }));
          host.appendChild(ppm.table([
            { label: 'Projet', get: function (r) { return r.code + ' ' + r.name; } },
            { label: 'Attendu', num: true, get: function (r) { return r.expected === null ? '—' : ppm.eur(r.expected); }, total: function () { return x.totals.expected === null ? '—' : ppm.eur(x.totals.expected); } },
            { label: 'Accordé', num: true, get: function (r) { return r.granted === null ? '—' : ppm.eur(r.granted); }, total: function () { return x.totals.granted === null ? '—' : ppm.eur(x.totals.granted); } },
            { label: 'Livrables (parts)', num: true, get: function (r) { return ppm.eur(r.parts); }, total: function () { return ppm.eur(x.totals.parts); } },
            { label: 'Écart attendu', num: true, get: function (r) { return gap(r.gap_expected); }, total: function () { return gap(x.totals.gap_expected); } },
            { label: 'Écart accordé', num: true, cls: function (r) { return r.clash ? 'bad' : ''; }, get: function (r) { return gap(r.gap_granted) + (r.clash ? ' · clash' : ''); }, total: function () { return gap(x.totals.gap_granted); } }
          ], x.projects, { open: open }));
          host.appendChild(el('h2', { class: 'sec', text: 'Exercice ' + ex.year + ' : budget par équipe, tous projets' }));
          host.appendChild(ppm.table([
            { label: 'Équipe', get: function (r) { return r.name + ' · ' + r.country; } },
            { label: 'Attendu', num: true, get: function (r) { return r.expected === null ? '—' : ppm.eur(r.expected); } },
            { label: 'Accordé', num: true, get: function (r) { return r.granted === null ? '—' : ppm.eur(r.granted); } },
            { label: 'Livrables (parts)', num: true, get: function (r) { return ppm.eur(r.parts); } },
            { label: 'Écart attendu', num: true, get: function (r) { return gap(r.gap_expected); } },
            { label: 'Écart accordé', num: true, cls: function (r) { return r.clash ? 'bad' : ''; }, get: function (r) { return gap(r.gap_granted) + (r.clash ? ' · clash' : ''); } }
          ], x.rows, {}));
        }).catch(function () { /* l'exercice n'est pas lisible : la vue programme reste celle du budget */ });
      }
    },
    onEnter: function (d) { $('title').textContent = 'Budget — Programme ' + d.program.code; $('cpn-chip').hidden = true; $('cpn-edit').hidden = true; try { google.script.history.replace(null, { view: 'budget', program: d.program.id }); } catch (e) { /* hors web app */ } }
  });
  /** Un brouillon non enregistré (décomposition, budget par équipe) ne se perd pas en silence : on demande avant de changer d'onglet ou de projet. */
  function guardDirty(next, undo) {
    if (!anyDirty()) { next(); return; }
    if (undo) undo();
    openConfirm('Abandonner les modifications non enregistrées ?', 'Des modifications de cette page ne sont pas enregistrées (bouton « Valider » en bas de la zone). Si vous continuez, elles seront perdues.', 'Abandonner', function () {
      state.envDraft = null; state.exDraft = {}; next(); return Promise.resolve();
    });
  }
  window.addEventListener('beforeunload', function (e) { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } });
  var shownProject = '';
  $('picker').addEventListener('change', function () {
    var sel = this, wanted = sel.value;
    guardDirty(function () { shownProject = wanted; if (pv.isProgram(wanted)) pv.enter(wanted); else { pv.leave(); loadProject(wanted); } }, function () { sel.value = shownProject || state.projectId || sel.value; });
  });
  ['suivi', 'op', 'archive'].forEach(function (t) { $('tab-' + t).addEventListener('click', function () { if (state.tab !== t) guardDirty(function () { setTab(t); }); }); });
  $('archive-picker').addEventListener('change', function () { var id = this.value; guardDirty(function () { state.archiveId = id; setTab('archive'); }); });
  $('cost-close').addEventListener('click', function () { closeDialog($('cost-dialog')); state.costItem = null; });
  $('eximp-close').addEventListener('click', function () { closeDialog($('eximp')); });
  $('cpn-edit').addEventListener('click', editCpn);
  $('gf-form').addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  $('gf-cancel').addEventListener('click', function () { closeDialog($('genform')); });
  $('po-form').addEventListener('submit', function (e) { e.preventDefault(); submitPo(); });
  $('po-cancel').addEventListener('click', function () { closeDialog($('po-dialog')); });
  $('confirm-cancel').addEventListener('click', function () { closeDialog($('confirm')); });
  $('confirm-ok').addEventListener('click', function () { if (state.confirmAction) state.confirmAction(); });

  initSections();
  call('exercise.list', {}).catch(function () { return { exercises: [] }; }).then(function (r) { fillExercises(r.exercises); return call('planning.catalog', {}); }).then(function (cat) {
    state.catalog = cat;
    var sel = $('picker'); clear(sel);
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    cat.projects.slice().sort(sortCode).forEach(function (p) { sel.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
    pv.fillOptions(sel, cat);
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { empty($('panel-bilan'), 'Aucun projet pour l’instant.', 'Créez un projet, puis revenez ici.'); return; }
    return loadProject(first);
  }).catch(function (e) { failed($('panel-bilan'), e); });

  window.__ppm = { state: state, reload: reload };
})();
