<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.19.3">
<?!= include('Style') ?>
<?!= include('Common') ?>
<?!= include('CommonForms') ?>
<style>
  main { padding: 16px 24px 28px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .box { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .box h2.sec { margin: 0 0 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 12px; }
  .filters input[type=search], .filters select { padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .filters input[type=search] { min-width: 220px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 12px; background: var(--tint); color: var(--ink); white-space: nowrap; }
  .badge.ext { background: var(--warn-bg); color: var(--warn-ink); } .badge.ok { background: var(--ok-bg); color: var(--ok-ink); } .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  td.num { text-align: right; white-space: nowrap; }
  select.inline, input.inline { padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
  input.rate-input { width: 96px; text-align: right; }
  /* organigramme des équipes : chaque équipe est une carte, reliée à son parent par un tronc et un coude */
  #res-table th, #res-table td { padding-left: 8px; padding-right: 8px; } #res-table th { white-space: normal; }
  /* la colonne des boutons reste visible quand le tableau défile (75 % de la largeur : il peut déborder sur un petit écran) */
  #res-table .sticky-r { position: sticky; right: 0; background: var(--surface); box-shadow: -8px 0 8px -8px rgba(0, 0, 0, .25); }
  .stack { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; } /* statut et accès l'un sous l'autre : une colonne de moins */
  .teams, .teams ul { list-style: none; margin: 0; padding: 0; }
  .teams ul { margin-left: 12px; padding-left: 16px; }
  .teams li { position: relative; padding: 8px 0 0; }
  .teams ul > li::before { content: ''; position: absolute; left: -16px; top: 29px; width: 16px; border-top: 2px solid var(--rule-strong, #b9c3d3); }
  .teams ul > li::after { content: ''; position: absolute; left: -16px; top: 0; bottom: 0; border-left: 2px solid var(--rule-strong, #b9c3d3); }
  .teams ul > li:last-child::after { bottom: auto; height: 29px; }
  .teams .team-card { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 6px; padding: 7px 10px; box-shadow: var(--shadow); }
  .teams .team-card.on { background: var(--tint); border-color: var(--accent); }
  .teams .team-card.noboss { border-left-color: var(--amber); }
  .teams .team-card.ctx { opacity: .7; border-left-style: dashed; }
  #teams-all-row { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13.5px; }
  .import-dialog { width: min(760px, 94vw); max-height: 90vh; }
  .imp-step { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; }
  .imp-step .note { margin: 4px 0 8px; }
  .imp-step .lbl { display: block; margin: 8px 0; }
  .imp-step input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .imp-head.ok { color: var(--ok-ink); font-weight: 600; } .imp-head.bad { color: var(--alert-ink); font-weight: 600; }
  .imp-sub { margin: 10px 0 4px; font-size: 14px; }
  .imp-list { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; max-height: 220px; overflow: auto; }
  .imp-counts { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; }
  .teams .t-name { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; overflow-wrap: anywhere; }
  .teams .t-name[aria-pressed="true"] { color: var(--accent); }
  .teams small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .teams .t-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .teams .t-actions .btn { padding: 2px 8px; font-size: 12.5px; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  #genform { width: min(540px, calc(100% - 32px)); max-width: none; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 12px; } .ed-row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title">
    <h1 id="title">Ressources</h1>
    <span class="context" id="context"></span>
  </div>
  <div class="controls">
    <label class="field">Projet <select id="picker" aria-label="Projet"></select></label>
    <button type="button" class="btn" id="teams-import" hidden>Importer des équipes</button>
    <button type="button" class="btn" id="team-add" hidden>Ajouter une équipe</button>
    <button type="button" class="btn primary" id="person-add" hidden>Ajouter une personne</button>
  </div>
</header>

<main>
  <section class="box" aria-label="Personnes">
    <h2 class="sec">Personnes</h2>
    <div class="filters">
      <input type="search" id="res-search" placeholder="Rechercher un nom, une fonction…" aria-label="Rechercher">
      <select id="team-filter" aria-label="Équipe"></select>
      <select id="type-filter" aria-label="Statut"><option value="">Internes et externes</option><option value="Interne">Internes</option><option value="Externe">Externes</option></select>
      <span class="muted" id="count"></span>
    </div>
    <div id="people"></div>
    <p class="note" id="people-note"></p>
  </section>
  <aside class="box" aria-label="Équipes">
    <h2 class="sec">Équipes</h2>
    <label class="toggle" id="teams-all-row" hidden><input type="checkbox" id="teams-all"> Toutes les équipes</label>
    <ul class="teams" id="teams-list"></ul>
    <p class="note" id="teams-note"></p>
  </aside>
</main>

<dialog id="genform" aria-labelledby="gf-title">
  <form id="gf-form" novalidate>
    <h2 id="gf-title"></h2>
    <div class="ed-grid" id="gf-body"></div>
    <p class="ed-error" id="gf-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="gf-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="gf-ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="timp" aria-labelledby="timp-title" class="import-dialog">
  <div class="imp-box">
    <h2 id="timp-title">Importer la structure des équipes</h2>
    <div id="timp-body"></div>
    <div class="actions"><button type="button" class="btn" id="timp-close">Fermer</button></div>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <p class="ed-error" id="confirm-error" role="alert" hidden></p>
  <div class="actions">
    <button type="button" class="btn" id="confirm-cancel">Annuler</button>
    <button type="button" class="btn danger" id="confirm-ok">Retirer</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, openDialog = ppm.openDialog, closeDialog = ppm.closeDialog;

  var state = { data: null, projectId: '', team: '', catalog: null, seq: 0, showAllTeams: false };
  var $ = function (id) { return document.getElementById(id); };
  var COUNTRY_LIST = [['FR', 'France'], ['DE', 'Allemagne'], ['UK', 'Royaume-Uni'], ['IN', 'Inde']];

  // ------------------------------------------------------------ outils
  function fail(e) { toast(ppmErrorText(e), true); }

  // ------------------------------------------------------------ formulaire générique et confirmation
  var forms = ppm.forms({ $: $, state: state });
  var fillSelect = forms.fillSelect, openForm = forms.openForm, submitForm = forms.submitForm, openConfirm = forms.openConfirm;

  // ------------------------------------------------------------ chargement et rendu
  function load() {
    var ticket = ++state.seq;
    return call('ressources.get', { projectId: state.projectId }).then(function (d) {
      if (ticket !== state.seq) return;
      state.data = d; render();
    }).catch(function (e) { var p = $('people'); clear(p); p.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Chargement impossible.' }), el('span', { text: (e && e.message) || 'Erreur inconnue.' })])); });
  }

  /**
   * Les équipes affichées à droite : celles qui ont au moins un membre qui participe au projet (avec leurs parents, en grisé) ; « Toutes les équipes » les montre toutes. Les FORMULAIRES
   * (attribuer une équipe à une personne, choisir l'équipe parente) proposent toujours TOUTES les équipes existantes, importées ou créées à la main.
   */
  function shownTeams() { var d = state.data; return d.teamsMode === 'project' && !state.showAllTeams ? d.teams : d.allTeams; }
  function teamOptions(emptyLabel) {
    return [{ value: '', label: emptyLabel }].concat(state.data.allTeams.map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; }));
  }

  function visiblePeople() {
    var q = $('res-search').value.trim().toLowerCase(), type = $('type-filter').value, team = state.team;
    return state.data.people.filter(function (p) {
      if (type && p.resource_type !== type) return false;
      if (team === '__none') { if (p.team_id) return false; } else if (team && p.team_id !== team) return false;
      return !q || (p.name + ' ' + p.job_function + ' ' + p.organization + ' ' + p.supplier).toLowerCase().indexOf(q) >= 0;
    });
  }

  /** Peut-elle se connecter ? Il faut une adresse e-mail dans un domaine autorisé ; le rôle dit ensuite ce qu'elle peut faire. */
  function accessBadge(p) {
    var d = state.data;
    if (p.access === 'ok') return el('span', { class: 'badge ok', text: 'Peut se connecter', title: p.email });
    if (p.access === 'outside') return el('span', { class: 'badge warn', text: 'Hors domaine', title: p.email + ' : hors des domaines autorisés (' + d.domains.join(', ') + ')' });
    return el('span', { class: 'badge warn', text: 'Sans adresse', title: 'Sans adresse e-mail professionnelle, la personne figure dans les listes mais ne peut pas se connecter.' });
  }

  /** Livrables et jalons dont la personne est responsable, et ce à quoi elle contribue sans en être responsable. */
  function deliverablesCell(p) {
    var own = (p.deliverables || 0) + (p.milestones || 0);
    if (!own && !p.contributes) return el('span', { class: 'muted', text: '—' });
    var detail = [];
    if (p.deliverables) detail.push(p.deliverables + (p.deliverables > 1 ? ' livrables' : ' livrable'));
    if (p.milestones) detail.push(p.milestones + (p.milestones > 1 ? ' jalons' : ' jalon'));
    if (p.contributes) detail.push('contribue à ' + p.contributes);
    return el('div', {}, [el('strong', { class: 'deliv-n', text: String(own) }), el('small', { text: detail.join(' · ') })]);
  }

  /** Les rôles d'une personne dans ce projet, en lecture seule : ils se posent sur chaque objet, dans le WBS. Sans aucun rôle : Reader. */
  function rolesCell(p) {
    if (!p.roles.length) return el('span', {}, [el('span', { class: 'badge', title: 'Rôle par défaut : lit tout, ne modifie rien. Un rôle se pose dans le WBS, sur l’objet concerné.', text: 'Reader' }), ' ']);
    return el('span', { text: p.roles.map(function (r) { return r.label + (r.scope ? ' (' + r.scope + ')' : ''); }).join(', ') });
  }

  function render() {
    var d = state.data;
    $('title').textContent = d.project ? 'Ressources de ' + d.project.name : 'Ressources';
    $('context').textContent = d.project ? d.project.code : '';
    $('person-add').hidden = !d.canEdit; $('team-add').hidden = !d.canEdit; $('teams-import').hidden = !d.canEdit;
    $('teams-all-row').hidden = d.teamsMode !== 'project'; $('teams-all').checked = state.showAllTeams;
    var shown = shownTeams();
    if (state.team && state.team !== '__none' && !shown.some(function (t) { return t.id === state.team; })) state.team = '';
    var tf = $('team-filter'), cur = state.team;
    fillSelect(tf, [{ value: '', label: 'Toutes les équipes' }, { value: '__none', label: 'Sans équipe' }].concat(shown.map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; })), cur);
    var rows = visiblePeople();
    $('count').textContent = plural(rows.length, 'personne', 'personnes');
    var host = $('people'); clear(host);
    if (!rows.length) host.appendChild(el('div', { class: 'empty' }, [el('strong', { text: d.people.length ? 'Aucune personne ne correspond.' : 'Aucune personne pour l’instant.' }), el('span', { text: d.canEdit && !d.people.length ? 'Ajoutez la première avec « Ajouter une personne ».' : '' })]));
    else {
      var head = ['Nom', 'Statut et accès', 'Équipe', 'Livrables', 'Rôles'];
      if (d.canEdit) head.push('');
      host.appendChild(el('div', { class: 'table-wrap' }, [el('table', { id: 'res-table' }, [
        el('thead', {}, [el('tr', {}, head.map(function (h, i) { return el('th', { scope: 'col', class: (h === '' ? ' sticky-r' : ''), text: h }); }))]),
        el('tbody', {}, rows.map(function (p) {
          var cells = [
            el('td', {}, [p.name, el('small', { text: [p.job_function, p.resource_type === 'Externe' ? (p.supplier || p.organization) : p.organization].filter(Boolean).join(' · ') || ' ' })]),
            el('td', {}, [el('div', { class: 'stack' }, [el('span', { class: 'badge' + (p.resource_type === 'Externe' ? ' ext' : ''), text: p.resource_type }), accessBadge(p)])]),
            el('td', { text: p.team || '—' }), el('td', { class: 'deliv' }, [deliverablesCell(p)]),
            el('td', {}, [rolesCell(p), p.unplaced ? el('a', { href: (BOOT.baseUrl || '') + '?view=structure&project=' + state.projectId, title: 'Aucun rôle pour l’instant : un rôle se pose dans le WBS', text: 'poser un rôle' }) : null])
          ];
          if (d.canEdit) cells.push(el('td', { class: 'sticky-r' }, [el('div', { class: 'actions-cell' }, [
            el('button', { type: 'button', class: 'btn person-edit', 'data-id': p.resource_id, text: 'Modifier', onclick: function () { openPersonForm(p); } }),
            el('button', { type: 'button', class: 'btn person-remove', 'data-id': p.resource_id, text: 'Retirer', onclick: function () { removePerson(p); } })])]));
          return el('tr', { 'data-id': p.resource_id }, cells);
        }))])]));
    }
    $('people-note').textContent = 'Pour qu’une personne intervienne : une fiche avec son adresse e-mail professionnelle (créée ici, et seulement ici), puis des rôles posés dans la page WBS. Il n’y a plus de taux journalier : le budget se saisit par équipe (page Budget) et se convertit en jours avec le coût d’un ETP du pays de l’équipe, paramétré par l’administrateur.';
    var tl = $('teams-list'); clear(tl);
    if (!shown.length) tl.appendChild(el('li', {}, [el('span', { class: 'muted', id: 'teams-empty', text: d.teamsMode === 'project' && !state.showAllTeams ? 'Aucune équipe : aucun membre d’une équipe ne participe encore à ce projet.' : 'Aucune équipe.' })]));
    // arbre imbriqué : l'équipe de profondeur k est rangée sous la dernière équipe de profondeur k − 1 (l'ordre du serveur est celui de l'arborescence)
    var stack = [];
    shown.forEach(function (t) {
      var card = el('div', { class: 'team-card' + (state.team === t.id ? ' on' : '') + (t.manager ? '' : ' noboss') + (d.teamsMode === 'project' && !state.showAllTeams && t.context ? ' ctx' : ''), title: t.context && !state.showAllTeams && d.teamsMode === 'project' ? 'Équipe parente : aucun de ses membres directs ne participe à ce projet' : (t.manager ? '' : 'Équipe sans responsable') }, [
        el('button', { type: 'button', class: 't-name', 'aria-pressed': String(state.team === t.id), text: t.name, onclick: function () { state.team = state.team === t.id ? '' : t.id; render(); } }),
        el('small', { text: plural(t.members, 'membre', 'membres') + (d.teamsMode === 'project' && t.participants ? ' · ' + t.participants + ' au projet' : '') + (t.manager ? ' · ' + t.manager : '') + (t.cost_center ? ' · ' + t.cost_center : '') })]);
      if (d.canEdit) card.appendChild(el('div', { class: 't-actions' }, [
        el('button', { type: 'button', class: 'btn team-edit', text: 'Modifier', onclick: function () { openTeamForm(t, null); } }),
        el('button', { type: 'button', class: 'btn team-sub', text: 'Sous-équipe', onclick: function () { openTeamForm(null, t); } }),
        el('button', { type: 'button', class: 'btn team-del', text: 'Supprimer', onclick: function () { deleteTeam(t); } })]));
      var li = el('li', { 'data-team': t.id, 'data-depth': String(t.depth) }, [card]);
      while (stack.length > t.depth) stack.pop();
      (stack.length ? stack[stack.length - 1] : tl).appendChild(li);
      var kids = el('ul', {}); li.appendChild(kids); stack.push(kids);
    });
    Array.prototype.forEach.call(tl.querySelectorAll('ul:empty'), function (u) { u.parentNode.removeChild(u); });
    $('teams-note').textContent = (d.teamsMode === 'project' ? 'Les équipes dont au moins un membre participe à ce projet' + (state.showAllTeams ? ' (toutes les équipes sont affichées).' : ' ; cochez « Toutes les équipes » pour voir les autres.') + ' ' : '') + (d.canEdit ? 'Cliquez sur une équipe pour filtrer les personnes. Une équipe ne se supprime que vide.' : '');
    try { google.script.history.replace(null, { view: 'ressources', project: state.projectId }); } catch (e) { /* hors web app */ }
    var base = BOOT.baseUrl || '';
    Array.prototype.forEach.call(document.querySelectorAll('.ppm-bar [data-view]'), function (n) {
      var vw = n.getAttribute('data-view');
      if (state.projectId && ['overview', 'gantt', 'structure', 'ressources', 'suivi', 'copilote', 'budget'].indexOf(vw) >= 0) n.setAttribute('href', base + '?view=' + vw + '&project=' + state.projectId);
    });
  }

  // ------------------------------------------------------------ personnes
  function openPersonForm(p) {
    var d = state.data, create = !p;
    p = p || {};
    var fields = [
      { key: 'name', label: 'Nom', value: p.name, maxlength: 120 },
      { key: 'resource_type', label: 'Statut', type: 'select', value: p.resource_type || 'Interne', options: [{ value: 'Interne', label: 'Interne' }, { value: 'Externe', label: 'Externe' }], half: true },
      { key: 'country', label: 'Pays', type: 'select', value: p.country || '', options: [{ value: '', label: '—' }].concat(COUNTRY_LIST.map(function (c) { return { value: c[0], label: c[1] }; })), half: true },
      { key: 'job_function', label: 'Fonction', value: p.job_function, maxlength: 80, half: true },
      { key: 'organization', label: 'Organisation', value: p.organization, maxlength: 80, half: true },
      { key: 'supplier', label: 'Fournisseur (si externe)', value: p.supplier, maxlength: 80, half: true },
      { key: 'team_id', label: 'Équipe', type: 'select', value: p.team_id || '', options: teamOptions('Aucune'), half: true }
    ];
    if (create) fields.splice(1, 0, { key: 'email', label: 'Adresse e-mail (facultative)', value: '', maxlength: 120 });
    openForm({
      title: create ? 'Ajouter une personne' : 'Modifier ' + p.name, ok: create ? 'Ajouter' : 'Enregistrer',
      note: create ? 'L’adresse e-mail professionnelle (domaine : ' + d.domains.join(', ') + ') donne accès à l’outil. Sans rôle, la personne est Reader : elle lit tout et ne modifie rien. Ses rôles se posent ensuite dans la page WBS, sur chaque objet.' : 'L’adresse e-mail ne se modifie que par l’administrateur.',
      fields: fields,
      onSubmit: function (v) {
        var values = { name: v.name, resource_type: v.resource_type, country: v.country, job_function: v.job_function, organization: v.organization, supplier: v.supplier, team_id: v.team_id };
        var req;
        if (create) { if (v.email.trim()) values.email = v.email.trim(); req = call('resources.create', { values: values }, true); }
        else req = call('resources.update', { id: p.resource_id, version: p.version, patch: values }, true);
        return req.then(function () { toast(create ? 'Personne ajoutée.' : 'Fiche enregistrée.'); return load(); });
      }
    });
  }

  function removePerson(p) {
    call('people.remove', { id: p.resource_id, dryRun: true }).then(function (s) {
      var parts = [];
      if (s.roles) parts.push(plural(s.roles, 'rôle terminé', 'rôles terminés'));
      if (s.teams) parts.push(plural(s.teams, 'équipe sans responsable', 'équipes sans responsable'));
      if (s.wps) parts.push(plural(s.wps, 'workpackage', 'workpackages') + ' à réattribuer');
      if (s.items) parts.push(plural(s.items, 'livrable ou jalon', 'livrables et jalons') + ' à réattribuer');
      openConfirm('Retirer ' + s.name + ' ?', s.name + ' ne sera plus dans les listes' + (parts.length ? ' : ' + parts.join(', ') : '') + '. La fiche reste dans l’historique.', 'Retirer', function () {
        return call('people.remove', { id: p.resource_id, version: p.version }, true).then(function () { toast(s.name + ' retiré(e).'); return load(); });
      });
    }).catch(fail);
  }

  // ------------------------------------------------------------ équipes
  function openTeamForm(team, parent) {
    var d = state.data, create = !team;
    openForm({
      title: create ? (parent ? 'Nouvelle sous-équipe de « ' + parent.name + ' »' : 'Nouvelle équipe') : 'Modifier l’équipe', ok: create ? 'Créer' : 'Enregistrer',
      fields: [
        { key: 'name', label: 'Nom', value: team ? team.name : '', maxlength: 80 },
        { key: 'parent_team_id', label: 'Équipe parente', type: 'select', value: team ? team.parent_team_id : (parent ? parent.id : ''),
          options: [{ value: '', label: 'Aucune (racine)' }].concat(d.allTeams.filter(function (t) { return !team || t.id !== team.id; }).map(function (t) { return { value: t.id, label: new Array(t.depth + 1).join('— ') + t.name }; })) },
        { key: 'manager_resource_id', label: 'Responsable', type: 'select', value: team ? team.manager_id : '', options: [{ value: '', label: '—' }].concat(d.people.filter(function (p) { return p.resource_type === 'Interne'; }).map(function (p) { return { value: p.resource_id, label: p.name }; })) },
        { key: 'cost_center', label: 'Centre de coût', value: team ? team.cost_center : '', maxlength: 40, half: true },
        { key: 'country', label: 'Pays (conversion en jours)', type: 'select', value: team ? (team.country || '') : '', options: [{ value: '', label: 'France (par défaut)' }].concat(d.countries.map(function (c) { return { value: c, label: c }; })), half: true }
      ],
      onSubmit: function (v) {
        var req = create ? call('teams.create', { values: v }, true) : call('teams.update', { id: team.id, version: team.version, patch: v }, true);
        return req.then(function () {
          if (create && state.data.teamsMode === 'project') state.showAllTeams = true;   // une équipe toute neuve n'a encore aucun participant : on affiche toutes les équipes pour la voir
          toast(create ? 'Équipe créée.' + (state.data.teamsMode === 'project' ? ' Elle apparaîtra parmi les équipes du projet quand un de ses membres y participera.' : '') : 'Équipe enregistrée.'); return load();
        });
      }
    });
  }
  function deleteTeam(t) {
    openConfirm('Supprimer l’équipe ?', 'L’équipe « ' + t.name + ' » sera supprimée. Elle doit être vide : ni membres ni sous-équipes.', 'Supprimer', function () {
      return call('teams.delete', { id: t.id, version: t.version }, true).then(function () { toast('Équipe supprimée.'); if (state.team === t.id) state.team = ''; return load(); });
    });
  }

  // ------------------------------------------------------------ importer la structure des équipes (classeur Google Sheet dédié)
  /**
   * Les équipes sont communes à tous les projets : on les décrit une fois dans un classeur à part. (1) créer le classeur modèle, prérempli avec les équipes actuelles (c'est aussi un export) ;
   * (2) coller le lien du classeur rempli et « Analyser » (un rapport, rien n'est écrit) ; (3) « Importer », seulement sans erreur, par lots. Rien n'est supprimé ni écrasé.
   */
  var timp = { report: null, book: '', busy: false, backup: null };
  function timpBusy(on, msg) {
    timp.busy = on;
    ['timp-template', 'timp-analyze', 'timp-run'].forEach(function (id) { var b = $(id); if (b) b.disabled = on || (id === 'timp-run' && !(timp.report && timp.report.ok && !timp.report.nothing_to_do)); });
    var st = $('timp-status'); if (st) st.textContent = msg || '';
  }
  function timpCounts(c) {
    var t = c.teams, m = c.members;
    return [t.create + t.update + t.same ? 'Équipes : ' + t.create + ' à créer, ' + t.update + ' à compléter, ' + t.same + ' inchangée' + (t.same > 1 ? 's' : '') : '',
      m.create + m.assign + m.same ? 'Personnes : ' + m.create + ' à créer, ' + m.assign + ' à rattacher à leur équipe, ' + m.same + ' déjà en place' : ''].filter(Boolean);
  }
  function timpRender() {
    var box = $('timp-report'), rep = timp.report;
    clear(box);
    if (!rep) return;
    box.appendChild(el('p', { class: 'imp-head ' + (rep.ok ? 'ok' : 'bad'), id: 'timp-head', role: 'status', text: rep.ok ? (rep.nothing_to_do ? 'Rien à importer : le classeur correspond déjà aux équipes de l’outil.' : 'Analyse sans erreur : voici ce qui sera fait.') : 'Le classeur a ' + rep.errors_count + (rep.errors_count > 1 ? ' erreurs' : ' erreur') + ' : corrigez-les dans le classeur, puis relancez « Analyser ». Rien n’a été écrit.' }));
    if (rep.ok) box.appendChild(el('ul', { class: 'imp-counts', id: 'timp-counts' }, timpCounts(rep.counts).map(function (t) { return el('li', { text: t }); })));
    var list = function (title, items, id) {
      if (!items.length) return;
      box.appendChild(el('h3', { class: 'imp-sub', text: title }));
      box.appendChild(el('ul', { class: 'imp-list', id: id }, items.map(function (x) { return el('li', {}, [el('strong', { text: x.tab + (x.row ? ', ligne ' + x.row : '') + ' — ' }), x.message]); })));
    };
    list('Erreurs (' + rep.errors_count + ')', rep.errors, 'timp-errors');
    list('À savoir (' + rep.warnings_count + ')', rep.warnings, 'timp-warnings');
  }
  function timpReset() { timp.report = null; timpRender(); timpBusy(false, ''); }
  function openTeamImport() {
    timp.report = null; timp.book = ''; timp.backup = null;
    var body = $('timp-body'); clear(body);
    body.appendChild(el('p', { class: 'note', text: 'Les équipes sont communes à tous les projets : décrivez-les une fois dans un classeur Google Sheet (onglet Équipes : la structure ; onglet Membres : qui est dans quelle équipe). L’import crée ce qui manque, ne supprime rien et n’écrase rien ; il enregistre une copie de sécurité avant de modifier des équipes ou des personnes existantes.' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '1. Le classeur modèle' }),
      el('p', { class: 'note', text: 'Créé dans Drive et partagé avec vous, prérempli avec les équipes actuelles : c’est aussi un export.' }),
      el('button', { type: 'button', class: 'btn', id: 'timp-template', text: 'Créer le classeur modèle', onclick: timpTemplate }), el('div', { id: 'timp-template-out' })]));
    var input = el('input', { type: 'text', id: 'timp-book', placeholder: 'https://docs.google.com/spreadsheets/d/…', autocomplete: 'off', 'aria-label': 'Lien du classeur à importer' });
    input.addEventListener('input', function () { timp.book = input.value; timpReset(); });
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '2. Analyser' }), el('label', { class: 'lbl' }, ['Lien du classeur rempli', input]),
      el('button', { type: 'button', class: 'btn', id: 'timp-analyze', text: 'Analyser', onclick: timpAnalyze })]));
    body.appendChild(el('div', { id: 'timp-report' }));
    body.appendChild(el('div', { class: 'imp-step' }, [el('strong', { text: '3. Importer' }),
      el('button', { type: 'button', class: 'btn primary', id: 'timp-run', text: 'Importer', disabled: true, onclick: timpRun }),
      el('span', { class: 'note', id: 'timp-status', role: 'status', 'aria-live': 'polite' }), el('div', { id: 'timp-backup' })]));
    openDialog($('timp'));
  }
  function timpError(e) { timpBusy(false, ''); toast(ppmErrorText(e), true); }
  function timpTemplate() {
    timpBusy(true, 'Création du classeur…');
    call('teams.import.template', {}, true).then(function (t) {
      timp.book = t.url; $('timp-book').value = t.url;
      var out = $('timp-template-out'); clear(out);
      out.appendChild(el('p', {}, [el('a', { href: t.url, target: '_blank', rel: 'noopener', id: 'timp-template-link', text: 'Ouvrir « ' + t.name + ' »' }), ' — ' + plural(t.prefilled.equipes, 'équipe', 'équipes') + ', ' + plural(t.prefilled.membres, 'membre', 'membres') + '.']));
      (t.warnings || []).forEach(function (w) { out.appendChild(el('p', { class: 'note', text: w })); });
      timpBusy(false, '');
    }).catch(timpError);
  }
  function timpAnalyze() {
    if (!String(timp.book || '').trim()) { toast('Collez d’abord le lien du classeur.', true); return; }
    timpBusy(true, 'Analyse…');
    call('teams.import.analyze', { book: timp.book }).then(function (rep) { timp.report = rep; timpRender(); timpBusy(false, ''); }).catch(timpError);
  }
  function timpRun() {
    if (!timp.report || !timp.report.ok) return;
    var lot = 0, total = null;
    var next = function () {
      lot++;
      timpBusy(true, 'Import en cours — lot ' + lot + (total === null ? '' : ', reste ' + total + ' opération(s)') + '…');
      return call('teams.import.run', { book: timp.book, resume: lot > 1 }, true).then(function (r) {
        if (r.backup) { timp.backup = r.backup; var b = $('timp-backup'); clear(b); b.appendChild(el('p', { class: 'note' }, ['Copie de sécurité enregistrée avant l’import : ', el('a', { href: r.backup.url, target: '_blank', rel: 'noopener', id: 'timp-backup-link', text: r.backup.name })])); }
        total = r.remaining;
        if (r.done) return r;
        if (lot >= 60) throw new Error('Import interrompu après 60 lots : relancez-le pour continuer.');
        return next();
      });
    };
    next().then(function () {
      timp.report = null; timpRender(); timpBusy(false, 'Import terminé.'); $('timp-run').disabled = true;
      toast('Structure des équipes importée.');
      return load();
    }).catch(timpError);
  }

  // ------------------------------------------------------------ démarrage
  $('res-search').addEventListener('input', function () { render(); });
  $('type-filter').addEventListener('change', function () { render(); });
  $('team-filter').addEventListener('change', function () { state.team = this.value; render(); });
  $('picker').addEventListener('change', function () { state.projectId = this.value; load(); });
  $('person-add').addEventListener('click', function () { openPersonForm(null); });
  $('team-add').addEventListener('click', function () { openTeamForm(null, null); });
  $('teams-import').addEventListener('click', openTeamImport);
  $('timp-close').addEventListener('click', function () { closeDialog($('timp')); });
  $('teams-all').addEventListener('change', function () { state.showAllTeams = this.checked; render(); });
  $('gf-form').addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  $('gf-cancel').addEventListener('click', function () { closeDialog($('genform')); });
  $('confirm-cancel').addEventListener('click', function () { closeDialog($('confirm')); });
  $('confirm-ok').addEventListener('click', function () { if (state.confirmAction) state.confirmAction(); });

  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var sel = $('picker'); clear(sel);
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    cat.projects.slice().sort(sortCode).forEach(function (p) { sel.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
    state.projectId = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id || '';
    sel.value = state.projectId;
    return load();
  }).catch(function (e) { $('people').appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Chargement impossible.' }), el('span', { text: (e && e.message) || '' })])); });

  window.__ppm = { state: state };
})();
</script>
</body>
</html>
