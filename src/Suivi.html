<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.12.2">
<?!= include('Style') ?>
<?!= include('Common') ?>
<style>
  .panel { padding: 16px 24px 32px; }
  .bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin: 0 0 16px; }
  .bar label.field { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .bar select { min-width: 220px; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .early { color: var(--green); }
  .badge.active { background: var(--summary); color: #FFFFFF; }
  .badge.pending { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.refused { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.added { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.removed { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.changed { background: var(--warn-bg); color: var(--warn-ink); }
  td .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  td .btn { padding: 3px 10px; font-size: 13.5px; }
  .note { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
  .table-wrap + .note { margin-top: 10px; }
  .intro { margin: 0 0 16px; max-width: 70ch; }
  .ws { display: grid; gap: 12px; max-width: 720px; }
  .ws .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .ws .row strong { display: block; }
  .report { margin: 0; padding-left: 18px; }
  dialog label.lbl { display: grid; gap: 2px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  dialog input[type=text], dialog textarea { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); }
  dialog textarea { min-height: 76px; resize: vertical; }
  dialog fieldset { margin: 0 0 12px; padding: 0; border: 0; }
  dialog legend { margin: 0 0 4px; font-weight: 600; }
  dialog .opt { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; cursor: pointer; }
  .th-check { width: 32px; }
  @media (max-width: 700px) {
    .panel { padding: 12px; }
    .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .status .seg button { border-left: 0; border-top: 1px solid var(--rule); }
    .status .seg button:nth-child(-n+2) { border-top: 0; }
    .status .seg button:nth-child(even) { border-left: 1px solid var(--rule); }
    #reload { margin-left: 0 !important; }
    .bar select { min-width: 0; width: 100%; }
    .bar label.field { width: 100%; }
  }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title">
    <h1 id="title">Suivi</h1>
    <p class="context" id="context"></p>
  </div>
  <div class="controls">
    <select id="picker" aria-label="Projet"></select>
  </div>
</header>

<div class="status">
  <button type="button" class="icon-btn" id="reload" style="margin-left:auto" aria-label="Actualiser" title="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</div>

<div class="zone" id="zone-ecarts"><h2 class="sec">Écarts à la baseline</h2></div>
<section class="panel" id="panel-ecarts" aria-label="Écarts à la baseline"></section>
<div class="zone" id="zone-changes"><h2 class="sec" id="tab-changes">Changements à valider</h2></div>
<section class="panel" id="panel-changes" aria-label="Changements à valider"></section>
<div class="zone" id="zone-baselines"><h2 class="sec">Baselines</h2></div>
<section class="panel" id="panel-baselines" aria-label="Baselines"></section>
<div class="zone" id="zone-workspace"><h2 class="sec">Agenda et Drive</h2></div>
<section class="panel" id="panel-workspace" aria-label="Agenda et Drive"></section>

<dialog id="form">
  <h2 id="form-title"></h2>
  <p id="form-text"></p>
  <label class="lbl" id="form-label-wrap">Libellé (facultatif)<input type="text" id="form-label" maxlength="60"></label>
  <label class="lbl"><span id="form-reason-label">Justification</span><textarea id="form-reason" maxlength="500"></textarea></label>
  <div class="actions">
    <button type="button" class="btn" id="form-cancel">Annuler</button>
    <button type="button" class="btn primary" id="form-ok">Valider</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, frDate = ppm.frDate;

  var state = { tab: 'ecarts', projectId: '', catalog: null, list: null, diff: null, compare: { base: '', to: '' },
    onlyChanges: true, feed: null, showAll: false, selected: {}, ws: null, wsReport: null, form: null, seq: 0 };
  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------ outils
  function frDateTime(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return frDate(s);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function isoDate(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v)); }
  function days(n) {
    if (n === null || n === undefined) return '';
    if (n === 0) return '=';
    return (n > 0 ? '+' : '−') + plural(Math.abs(n), 'jour', 'jours');
  }
  function euros(n) {
    if (n === null || n === undefined) return '';
    return Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  }
  function loading(panel) { clear(panel); panel.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(panel, title, text, extra) {
    clear(panel);
    panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text }), extra || null]));
  }
  function failed(panel, err) {
    empty(panel, 'Chargement impossible.', (err && err.message) || 'Erreur inconnue.');
  }
  function badge(text, cls) { return el('span', { class: 'badge ' + (cls || ''), text: text }); }
  function card(k, v, s, alert) {
    return el('div', { class: 'card' + (alert ? ' alert' : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]);
  }
  function table(head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { return typeof h === 'string' ? el('th', { scope: 'col', text: h }) : h; }))]),
      el('tbody', {}, rows)
    ])]);
  }

  // ------------------------------------------------------------ navigation
  function remember() {
    var base = BOOT.baseUrl || '';
    $('nav-plan').setAttribute('href', base + '?view=gantt' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-struct').setAttribute('href', base + '?view=structure' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-suivi').setAttribute('href', base + '?view=suivi' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-copilot').setAttribute('href', base + '?view=copilote' + (state.projectId ? '&project=' + state.projectId : ''));
    try { google.script.history.replace(null, { view: 'suivi', project: state.projectId }); } catch (e) { /* hors web app */ }
  }
  function fillPicker() {
    var sel = $('picker'); clear(sel);
    var cat = state.catalog, byProgram = {};
    cat.projects.forEach(function (p) { (byProgram[p.program_id || ''] = byProgram[p.program_id || ''] || []).push(p); });
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    var group = function (label, list) {
      if (!list || !list.length) return;
      var og = el('optgroup', { label: label });
      list.sort(sortCode).forEach(function (p) { og.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
      sel.appendChild(og);
    };
    cat.programs.slice().sort(sortCode).forEach(function (g) { group(g.code + ' ' + g.name, byProgram[g.id]); });
    group('Hors programme', byProgram['']);
    sel.value = state.projectId;
  }
  /** Plus d'onglets : toutes les zones s'affichent ; celle des changements est réservée à ceux qui peuvent les lire. */
  function syncZones() {
    var show = !state.list || !!state.list.canReadFeed;
    $('zone-changes').hidden = !show; $('panel-changes').hidden = !show;
  }
  /** « Voir les écarts » d'une baseline : on règle la comparaison puis on va à la zone des écarts. */
  function showDiff() {
    var p = loadDiff();
    var z = $('zone-ecarts');
    if (z.scrollIntoView) z.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return p;
  }
  // ------------------------------------------------------------ chargement
  function loadProject(id) {
    state.projectId = id; state.selected = {}; state.compare = { base: '', to: '' }; state.wsReport = null;
    $('picker').value = id;
    remember();
    var ticket = ++state.seq;
    ['ecarts', 'changes', 'baselines', 'workspace'].forEach(function (t) { loading($('panel-' + t)); });
    return call('baselines.list', { projectId: id }).then(function (l) {
      if (ticket !== state.seq) return;
      state.list = l;
      renderHeader();
      syncZones(); remember();
      if (l.canReadFeed) refreshPending();
      return loadAll();
    }).catch(function (e) { failed($('panel-ecarts'), e); toast(e.message || 'Erreur.', true); });
  }
  function reloadList() {
    return call('baselines.list', { projectId: state.projectId }).then(function (l) { state.list = l; renderHeader(); syncZones(); });
  }
  function loadAll() {
    if (!state.list) return Promise.resolve();
    renderBaselines();
    var jobs = [loadDiff(), loadWorkspace()];
    if (state.list.canReadFeed) jobs.push(loadFeed());
    return Promise.all(jobs);
  }
  function activeBaseline() { return (state.list.baselines || []).filter(function (b) { return b.status === 'Active'; })[0] || null; }

  function renderHeader() {
    var l = state.list, p = l.project;
    $('title').textContent = p.code + ' ' + p.name;
    var a = activeBaseline();
    var pending = l.baselines.filter(function (b) { return b.status === 'Demandée'; }).length;
    var ctx = $('context'); clear(ctx);
    ctx.appendChild(el('span', { class: 'chip' + (a ? '' : ' warn'), text: a ? a.label + ' active' : 'Pas de baseline',
      title: a ? 'Figée le ' + frDate(a.decided_at) + ' par ' + a.decided_by : '' }));
    if (pending) ctx.appendChild(el('span', { class: 'chip warn', text: plural(pending, 'demande en attente', 'demandes en attente') }));
  }
  function refreshPending() {
    call('changes.feed', { projectId: state.projectId, limit: 1 }).then(function (f) {
      $('tab-changes').textContent = 'Changements à valider' + (f.pending ? ' (' + f.pending + ')' : '');
    }).catch(function () { /* onglet laissé tel quel */ });
  }

  // ------------------------------------------------------------ écarts
  function loadDiff() {
    var panel = $('panel-ecarts');
    var a = activeBaseline();
    if (!a && !state.compare.base) { renderNoBaseline(panel); return Promise.resolve(); }
    loading(panel);
    var params = { projectId: state.projectId };
    if (state.compare.base) params.baselineId = state.compare.base;
    if (state.compare.to) params.compareTo = state.compare.to;
    return call('baselines.diff', params).then(function (d) { state.diff = d; renderDiff(); }).catch(function (e) { failed(panel, e); });
  }
  function renderNoBaseline(panel) {
    var l = state.list, extra = null;
    if (l.canManage) extra = el('p', {}, [el('button', { type: 'button', class: 'btn primary', text: 'Figer la baseline B0', onclick: function () { openCreate(null); } })]);
    else if (l.canRequest) extra = el('p', {}, [el('button', { type: 'button', class: 'btn', text: 'Demander une baseline', onclick: openRequest })]);
    empty(panel, 'Pas encore de baseline pour ce projet.',
      'Une baseline fige les dates, les responsables, le budget et le périmètre du projet ; les écarts se mesurent ensuite par rapport à elle.', extra);
  }
  function renderDiff() {
    var panel = $('panel-ecarts'), d = state.diff, t = d.totals;
    clear(panel);
    var frozen = state.list.baselines.filter(function (b) { return b.status === 'Active' || b.status === 'Archivée'; });
    var baseSel = el('select', { id: 'cmp-base', 'aria-label': 'Baseline de référence' });
    frozen.forEach(function (b) { baseSel.appendChild(el('option', { value: b.id, text: b.label + (b.status === 'Active' ? ' (active)' : '') + ' — ' + frDate(b.decided_at) })); });
    baseSel.value = d.baseline.id;
    var toSel = el('select', { id: 'cmp-to', 'aria-label': 'Comparée à' });
    toSel.appendChild(el('option', { value: '', text: 'Le planning d’aujourd’hui' }));
    frozen.forEach(function (b) { if (b.id !== d.baseline.id) toSel.appendChild(el('option', { value: b.id, text: 'La baseline ' + b.label })); });
    toSel.value = d.compareTo ? d.compareTo.id : '';
    baseSel.addEventListener('change', function () { state.compare.base = baseSel.value; if (state.compare.to === baseSel.value) state.compare.to = ''; loadDiff(); });
    toSel.addEventListener('change', function () { state.compare.to = toSel.value; loadDiff(); });
    var only = el('input', { type: 'checkbox', id: 'only-changes' });
    only.checked = state.onlyChanges;
    only.addEventListener('change', function () { state.onlyChanges = only.checked; renderDiff(); });
    panel.appendChild(el('div', { class: 'bar' }, [
      el('label', { class: 'field' }, ['Référence', baseSel]), el('label', { class: 'field' }, ['Comparée à', toSel]),
      el('label', { class: 'toggle' }, [only, 'Seulement les éléments qui ont changé'])
    ]));

    var cards = el('div', { class: 'cards' });
    cards.appendChild(card('Fin du plan', t.end ? frDate(t.end) : '—',
      t.end_slip === null ? 'Référence : ' + frDate(t.end_base) : (t.end_slip === 0 ? 'Comme la référence' : days(t.end_slip) + ' ouvrés (référence ' + frDate(t.end_base) + ')'), t.end_slip > 0));
    cards.appendChild(card('Éléments glissés', String(t.slipped), t.slipped ? 'jusqu’à ' + plural(t.max_slip, 'jour ouvré', 'jours ouvrés') : (t.advanced ? plural(t.advanced, 'élément avancé', 'éléments avancés') : 'aucun'), t.slipped > 0));
    cards.appendChild(card('Périmètre', (t.added ? '+' + t.added : '0') + ' / ' + (t.removed ? '−' + t.removed : '0'), 'ajoutés / retirés', t.added + t.removed > 0));
    cards.appendChild(card('Responsables changés', String(t.owner_changes), ''));
    var hasBudget = d.seeBudget && (t.budget || t.budget_base);
    if (hasBudget) cards.appendChild(card('Budget prévu', euros(t.budget), t.budget_delta ? (t.budget_delta > 0 ? '+' : '') + euros(t.budget_delta) + ' par rapport à la référence' : 'Comme la référence', t.budget_delta > 0));
    panel.appendChild(cards);

    var items = d.items.filter(function (i) { return !state.onlyChanges || i.state !== 'same'; });
    if (!items.length) {
      panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucun écart.' }), el('span', { text: 'Le planning comparé est identique à la référence.' })]));
      return;
    }
    var stateText = { added: ['Ajouté', 'added'], removed: ['Retiré', 'removed'], changed: ['Modifié', 'changed'], same: ['Identique', ''] };
    var dateCell = function (s, f, type) { return !f ? '—' : (type === 'Jalon' || s === f || !s ? frDate(f) : frDate(s) + ' → ' + frDate(f)); };
    var head = ['Élément', 'Référence', 'Comparé', 'Glissement', 'Responsable'];
    if (hasBudget) head.push('Budget');
    head.push('État');
    var rows = items.map(function (i) {
      var slip = i.slip === null || i.slip === undefined ? '' : days(i.slip);
      var owner = i.owner_changed ? i.base_owner_name + ' → ' + i.owner_name : (i.owner_name || i.base_owner_name || '—');
      var cells = [
        el('td', {}, [i.name, el('div', { class: 'muted', text: i.item_type + (i.wp_name ? ' · WP ' + i.wp_name : '') })]),
        el('td', { text: i.state === 'added' ? '—' : dateCell(i.base_start, i.base_finish, i.item_type) }),
        el('td', { text: i.state === 'removed' ? '—' : dateCell(i.start, i.finish, i.item_type) }),
        el('td', { class: 'num' + (i.slip > 0 ? ' late' : i.slip < 0 ? ' early' : ''), text: slip }),
        el('td', { text: owner })
      ];
      if (hasBudget) cells.push(el('td', { class: 'num', text: i.budget_delta ? (i.budget_delta > 0 ? '+' : '') + euros(i.budget_delta) : (i.budget ? euros(i.budget) : '') }));
      cells.push(el('td', {}, [badge(stateText[i.state][0], stateText[i.state][1])]));
      return el('tr', { 'data-item': i.id }, cells);
    });
    panel.appendChild(table(head, rows));
    panel.appendChild(el('p', { class: 'note', text: 'Glissement de la fin, en jours ouvrés du calendrier du projet : positif = plus tard que la référence.' }));
  }

  // ------------------------------------------------------------ changements à valider
  function loadFeed() {
    var panel = $('panel-changes');
    loading(panel);
    return call('changes.feed', { projectId: state.projectId, all: state.showAll }).then(function (f) {
      state.feed = f; state.selected = {}; renderFeed();
      $('tab-changes').textContent = 'Changements à valider' + (f.pending ? ' (' + f.pending + ')' : '');
    }).catch(function (e) { failed(panel, e); });
  }
  function valueText(v) { return v === '' || v === null || v === undefined ? '(vide)' : isoDate(v) ? frDate(v) : String(v); }
  function renderFeed() {
    var panel = $('panel-changes'), f = state.feed;
    clear(panel);
    if (!f.baseline) {
      empty(panel, 'Pas de baseline active.', 'Le fil des changements démarre quand une baseline est figée : chaque modification des dates, responsables, budget ou périmètre y apparaît jusqu’à sa validation.');
      return;
    }
    if (!f.canAck) panel.appendChild(el('p', { class: 'note', text: 'Lecture seule : le chef de projet et le DPL valident.' }));
    var all = el('input', { type: 'checkbox', id: 'show-all' });
    all.checked = state.showAll;
    all.addEventListener('change', function () { state.showAll = all.checked; loadFeed(); });
    var bar = el('div', { class: 'bar' }, [el('label', { class: 'toggle' }, [all, 'Afficher aussi les changements déjà validés'])]);
    if (f.canAck && f.pending) {
      bar.appendChild(el('button', { type: 'button', class: 'btn', id: 'ack-selected', text: 'Valider la sélection', onclick: ackSelected }));
      bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'ack-all', text: 'Tout valider (' + f.pending + ')', onclick: ackAll }));
    }
    panel.appendChild(bar);
    if (!f.items.length) {
      panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Rien à valider.' }), el('span', { text: 'Aucune modification des données figées depuis la dernière validation.' })]));
      return;
    }
    var head = [];
    if (f.canAck) head.push(el('th', { scope: 'col', class: 'th-check' }, [el('span', { class: 'muted', text: '✓' })]));
    head = head.concat(['Quand', 'Qui', 'Élément', 'Changement', 'État']);
    var rows = f.items.map(function (e) {
      var change;
      if (e.what === 'modification') change = [e.field_label + ' : ', el('span', { class: 'muted', text: valueText(e.old_value) }), ' → ', el('strong', { text: valueText(e.new_value) })];
      else change = [e.what === 'ajout' ? 'Ajouté' : e.what === 'suppression' ? 'Supprimé' : 'Rétabli'];
      var cells = [];
      if (f.canAck) {
        var box = el('input', { type: 'checkbox', 'data-event': e.id, 'aria-label': 'Sélectionner : ' + e.entity });
        box.checked = !!state.selected[e.id];
        box.disabled = e.acknowledged;
        box.addEventListener('change', function () { if (box.checked) state.selected[e.id] = true; else delete state.selected[e.id]; });
        cells.push(el('td', {}, [box]));
      }
      cells.push(el('td', { text: frDateTime(e.at) }), el('td', { text: e.actor_name || e.actor, title: e.actor }), el('td', { text: e.entity }), el('td', {}, change),
        el('td', {}, [e.acknowledged ? badge('Validé' + (e.acknowledged_by ? ' par ' + e.acknowledged_by : '')) : badge('À valider', 'pending')]));
      return el('tr', { 'data-event-row': e.id }, cells);
    });
    panel.appendChild(table(head, rows));
  }
  function ackSelected() {
    var ids = Object.keys(state.selected);
    if (!ids.length) { toast('Cochez d’abord les changements à valider.', true); return; }
    call('changes.ack', { ids: ids }, true).then(function (r) {
      toast(plural(r.acknowledged, 'changement validé', 'changements validés') + '.'); return loadFeed();
    }).catch(function (e) { toast(e.message || 'Validation impossible.', true); });
  }
  function ackAll() {
    call('changes.ack', { projectId: state.projectId, all: true }, true).then(function (r) {
      toast(plural(r.acknowledged, 'changement validé', 'changements validés') + '.'); return loadFeed();
    }).catch(function (e) { toast(e.message || 'Validation impossible.', true); });
  }

  // ------------------------------------------------------------ baselines
  var STATUS = { 'Active': 'active', 'Demandée': 'pending', 'Refusée': 'refused', 'Archivée': '' };
  function renderBaselines() {
    var panel = $('panel-baselines'), l = state.list;
    clear(panel);
    var bar = el('div', { class: 'bar' });
    if (l.canManage) bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'create-btn', text: activeBaseline() ? 'Figer une nouvelle baseline' : 'Figer la baseline B0', onclick: function () { openCreate(null); } }));
    else if (l.canRequest) bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'request-btn', text: 'Demander une nouvelle baseline', onclick: openRequest }));
    panel.appendChild(bar);
    if (!l.baselines.length) {
      panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'Aucune baseline ni demande.' })]));
      return;
    }
    var rows = l.baselines.map(function (b) {
      var actions = el('div', { class: 'actions' });
      if (b.status === 'Demandée' && l.canManage) {
        actions.appendChild(el('button', { type: 'button', class: 'btn primary', text: 'Figer', onclick: function () { openCreate(b); } }));
        actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Refuser', onclick: function () { openRefuse(b); } }));
      }
      if (b.status === 'Archivée' && l.canManage) actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Réactiver', onclick: function () { openActivate(b); } }));
      if (b.status === 'Active' || b.status === 'Archivée') {
        actions.appendChild(el('button', { type: 'button', class: 'btn', text: 'Voir les écarts', onclick: function () {
          state.compare = { base: b.id, to: '' };
          showDiff();
        } }));
      }
      var who = b.status === 'Demandée' ? 'Demandée par ' + b.requested_by + ' le ' + frDate(b.created_at)
        : (b.decided_by ? (b.status === 'Refusée' ? 'Refusée' : 'Figée') + ' par ' + b.decided_by + ' le ' + frDate(b.decided_at) : '');
      return el('tr', { 'data-baseline': b.id }, [
        el('td', {}, [el('strong', { text: b.label || 'Demande' }), b.items ? el('div', { class: 'muted', text: plural(b.items, 'élément figé', 'éléments figés') }) : null]),
        el('td', {}, [badge(b.status, STATUS[b.status])]),
        el('td', { text: b.justification }),
        el('td', { text: who }),
        el('td', {}, [actions])
      ]);
    });
    panel.appendChild(table(['Baseline', 'État', 'Justification', 'Décision', ''], rows));
  }

  // Boîte de saisie commune (figer, demander, refuser, réactiver).
  function openForm(opts) {
    state.form = opts;
    $('form-title').textContent = opts.title;
    $('form-text').textContent = opts.text || '';
    $('form-label-wrap').hidden = !opts.label;
    $('form-label').value = opts.labelValue || '';
    $('form-reason-label').textContent = opts.reasonLabel || 'Justification';
    $('form-reason').value = opts.reasonValue || '';
    $('form-ok').textContent = opts.ok || 'Valider';
    $('form-ok').disabled = false;
    var d = $('form');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
    $('form-reason').focus();
  }
  function closeForm() { state.form = null; var d = $('form'); if (d.open) { if (d.close) d.close(); else d.removeAttribute('open'); } }
  function submitForm() {
    var f = state.form;
    if (!f) return;
    var reason = $('form-reason').value.trim();
    if (!reason && !f.reasonOptional) { toast((f.reasonLabel || 'La justification') + ' est obligatoire.', true); $('form-reason').focus(); return; }
    $('form-ok').disabled = true;
    f.submit(reason, $('form-label').value.trim()).then(function (msg) {
      closeForm(); toast(msg);
      return reloadList().then(loadAll).then(function () { if (state.list.canReadFeed) refreshPending(); });
    }).catch(function (e) { $('form-ok').disabled = false; toast(e.message || 'Opération impossible.', true); });
  }
  function nextLabel() {
    var nums = state.list.baselines.filter(function (b) { return b.number !== null && (b.status === 'Active' || b.status === 'Archivée'); }).map(function (b) { return b.number; });
    return 'B' + (nums.length ? Math.max.apply(null, nums) + 1 : 0);
  }
  function openCreate(request) {
    var label = nextLabel();
    openForm({
      title: 'Figer la baseline ' + label,
      text: request ? 'Demande de ' + request.requested_by + ' : « ' + request.justification + ' ». ' : '',
      label: true, labelValue: label, reasonValue: request ? request.justification : '',
      ok: 'Figer ' + label,
      submit: function (reason, lbl) {
        var params = { projectId: state.projectId, justification: reason, label: lbl };
        if (request) { params.requestId = request.id; params.version = request.version; }
        return call('baselines.create', params, true).then(function (b) {
          state.compare = { base: '', to: '' };
          return 'Baseline ' + b.label + ' figée : ' + plural(b.items, 'élément', 'éléments') + '.';
        });
      }
    });
    $('form-text').textContent += 'Les dates, responsables, budget et périmètre actuels deviennent la référence ; la baseline active actuelle sera archivée.';
  }
  function openRequest() {
    openForm({ title: 'Demander une nouvelle baseline', text: 'Le chef de projet recevra votre demande et décidera de figer ou non une nouvelle référence.',
      ok: 'Envoyer la demande', submit: function (reason) {
        return call('baselines.request', { projectId: state.projectId, justification: reason }, true).then(function () { return 'Demande envoyée.'; });
      } });
  }
  function openRefuse(b) {
    openForm({ title: 'Refuser la demande', text: 'Demande de ' + b.requested_by + ' : « ' + b.justification + ' ».', reasonLabel: 'Motif du refus', ok: 'Refuser',
      submit: function (reason) { return call('baselines.refuse', { id: b.id, reason: reason, version: b.version }, true).then(function () { return 'Demande refusée.'; }); } });
  }
  function openActivate(b) {
    openForm({ title: 'Réactiver ' + b.label, text: 'Elle redevient la référence des écarts ; la baseline active actuelle sera archivée.', reasonLabel: 'Motif', ok: 'Réactiver ' + b.label,
      submit: function (reason) { return call('baselines.activate', { id: b.id, reason: reason, version: b.version }, true).then(function () { return b.label + ' réactivée.'; }); } });
  }

  // ------------------------------------------------------------ agenda et Drive
  function loadWorkspace() {
    var panel = $('panel-workspace');
    loading(panel);
    return call('workspace.status', { projectId: state.projectId }).then(function (st) { state.ws = st; renderWorkspace(); }).catch(function (e) { failed(panel, e); });
  }
  function renderWorkspace() {
    var panel = $('panel-workspace'), st = state.ws;
    clear(panel);
    var box = el('div', { class: 'ws' });
    box.appendChild(el('div', { class: 'row' }, [
      el('div', {}, [el('strong', { text: 'Agenda du projet' }), el('span', { class: 'muted', text: st.calendar_id ? 'En service.' : 'Pas encore créé.' })]),
      st.calendar_url ? el('a', { class: 'btn', href: st.calendar_url, target: '_blank', rel: 'noopener', text: 'Ouvrir l’agenda' }) : null
    ]));
    box.appendChild(el('div', { class: 'row' }, [
      el('div', {}, [el('strong', { text: 'Dossier Drive du projet' }), el('span', { class: 'muted', text: st.drive_folder_id ? 'En service.' : 'Pas encore créé.' })]),
      st.drive_url ? el('a', { class: 'btn', href: st.drive_url, target: '_blank', rel: 'noopener', text: 'Ouvrir le dossier' }) : null
    ]));
    panel.appendChild(box);
    var bar = el('div', { class: 'bar', style: 'margin-top:16px' });
    if (st.canManage && st.available !== false) {
      if (!st.calendar_id || !st.drive_folder_id) bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'ws-enable', text: 'Créer l’agenda et le dossier du projet', onclick: function () { runWorkspace('workspace.enable'); } }));
      else bar.appendChild(el('button', { type: 'button', class: 'btn', id: 'ws-sync', text: 'Synchroniser maintenant', onclick: function () { runWorkspace('workspace.sync'); } }));
    } else if (!st.canManage) {
      bar.appendChild(el('p', { class: 'note', text: 'Seuls le chef de projet, le DPL et le Program Leader activent l’agenda et le dossier.' }));
    }
    panel.appendChild(bar);
    if (state.wsReport) {
      var r = state.wsReport, lines = [];
      lines.push(plural(r.created, 'événement créé', 'événements créés') + ', ' + plural(r.updated, 'mis à jour', 'mis à jour') + ', ' + plural(r.removed, 'retiré', 'retirés') + '.');
      lines.push(plural(r.folders, 'dossier créé ou renommé', 'dossiers créés ou renommés') + '.');
      lines.push('Partagés avec les ' + plural(r.members || 0, 'membre', 'membres') + ' du projet' + (r.shared ? ' (' + plural(r.shared, 'nouvel accès', 'nouveaux accès') + ')' : '') + '.');
      var list = el('ul', { class: 'report', id: 'ws-report' }, lines.map(function (t) { return el('li', { text: t }); }));
      r.errors.forEach(function (e) { list.appendChild(el('li', { class: 'late', text: e })); });
      panel.appendChild(list);
    }
  }
  function runWorkspace(action) {
    var btn = $('ws-enable') || $('ws-sync');
    if (btn) btn.disabled = true;
    call(action, { projectId: state.projectId }, true).then(function (st) {
      state.wsReport = st.report;
      toast(action === 'workspace.enable' ? 'Agenda et dossier en service.' : 'Synchronisation terminée.');
      return loadWorkspace();
    }).catch(function (e) { if (btn) btn.disabled = false; toast(e.message || 'Opération impossible.', true); });
  }

  // ------------------------------------------------------------ événements
  $('picker').addEventListener('change', function () { loadProject(this.value); });
  $('reload').addEventListener('click', function () { loadProject(state.projectId); });
  $('form-ok').addEventListener('click', submitForm);
  $('form-cancel').addEventListener('click', closeForm);
  $('form').addEventListener('cancel', function (e) { e.preventDefault(); closeForm(); });

  // ------------------------------------------------------------ démarrage
  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { empty($('panel-ecarts'), 'Aucun projet pour l’instant.', 'Créez un projet dans l’application AppSheet, puis revenez ici.'); return; }
    state.projectId = first;
    fillPicker();
    return loadProject(first);
  }).catch(function (e) { failed($('panel-ecarts'), e); });

  window.__ppm = { state: state, loadProject: loadProject };
})();
</script>
</body>
</html>
