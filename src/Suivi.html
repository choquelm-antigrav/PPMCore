<!DOCTYPE html>
<html lang="fr" data-theme="<?= theme ?>">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="ppm-version" content="0.20.0">
<?!= include('Style') ?>
<?!= include('Common') ?>
<?!= include('CommonProgram') ?>
<style>
  .panel { padding: 16px 24px 32px; }
  .bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin: 0 0 16px; }
  .bar label.field { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .bar select { min-width: 220px; }
  .card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .early { color: var(--green); }
  /* la carte des baselines : un arbre de périmètres, des baselines en chaîne, « Aujourd'hui » au bout */
  .bmap { margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
  .bm-help { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .bm-lane { display: flex; align-items: center; gap: 14px; padding: 8px 0 8px calc(var(--depth, 0) * 22px); border-top: 1px solid var(--rule); }
  .bm-lane:first-of-type { border-top: 0; }
  .bm-lane.lane-a { background: color-mix(in srgb, var(--accent, #1f6feb) 5%, transparent); border-radius: 8px; }
  .bm-scope { flex: 0 0 190px; font-weight: 600; font-size: 14px; position: relative; padding-left: 14px; }
  .bm-scope::before { content: ''; position: absolute; left: 0; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--muted); opacity: .55; }
  .bm-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .bm-arrow { color: var(--muted); font-size: 18px; line-height: 1; }
  .bm-none { color: var(--muted); font-size: 13px; font-style: italic; }
  .bm-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; }
  .bm-chip small { color: var(--muted); font-size: 11.5px; }
  .bm-chip:hover:not([aria-disabled="true"]) { border-color: var(--accent, #1f6feb); }
  .bm-chip:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: 2px; }
  .bm-chip.active { background: var(--summary, #00205b); color: #fff; border-color: var(--summary, #00205b); }
  .bm-chip.active small { color: rgba(255, 255, 255, .75); }
  .bm-chip.archived { border-style: solid; }
  .bm-chip.request { border-style: dashed; color: var(--warn-ink, #8a5a00); cursor: default; }
  .bm-chip.now { border-style: dashed; font-weight: 600; }
  .bm-chip.is-a { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #1f6feb) 35%, transparent); border-color: var(--accent, #1f6feb); }
  .bm-chip.is-b { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-ink, #1a7f4b) 35%, transparent); border-color: var(--ok-ink, #1a7f4b); }
  .bm-chip[aria-disabled="true"] { opacity: .38; cursor: not-allowed; }
  .bm-tag { font-style: normal; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent, #1f6feb); }
  .bm-chip.is-b .bm-tag { color: var(--ok-ink, #1a7f4b); }
  .bm-chip.active .bm-tag { color: #fff; }
  .bm-warn { color: var(--warn-ink, #8a5a00); font-size: 12px; }
  .bm-sentence { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent, #1f6feb) 8%, var(--surface)); font-size: 14.5px; }
  .bm-tools { margin-top: 8px; }
  .who-pending { margin-top: 4px; font-size: 12.5px; color: var(--warn-ink, #8a5a00); }
  .decomp { margin: 0 0 14px; }
  .sec-toggle { display: flex; align-items: baseline; gap: 8px; width: 100%; margin: 0; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: inherit; font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
  .sec-toggle:hover { border-color: var(--muted); }
  .sec-toggle:focus-visible { outline: 2px solid var(--accent, #1f6feb); outline-offset: 2px; }
  .sec-toggle .chev { flex: none; width: 14px; color: var(--muted); }
  .sec-toggle .sec-sum { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); text-align: right; }
  #decomp-body { margin-top: 10px; }
  .badge.active { background: var(--summary); color: #FFFFFF; }
  .badge.pending { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.refused { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.added { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.removed { background: var(--alert-bg); color: var(--alert-ink); }
  .badge.changed { background: var(--warn-bg); color: var(--warn-ink); }
  td .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  td .btn { padding: 3px 10px; font-size: 13.5px; }
  .note { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
  .table-wrap + .note { margin-top: 10px; }
  .intro { margin: 0 0 16px; max-width: 70ch; }
  .ws { display: grid; gap: 12px; max-width: 720px; }
  .ws .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .ws .row strong { display: block; }
  .report { margin: 0; padding-left: 18px; }
  dialog label.lbl { display: grid; gap: 2px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  dialog input[type=text], dialog textarea { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); }
  dialog textarea { min-height: 76px; resize: vertical; }
  dialog fieldset { margin: 0 0 12px; padding: 0; border: 0; }
  dialog legend { margin: 0 0 4px; font-weight: 600; }
  dialog .opt { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; cursor: pointer; }
  .th-check { width: 32px; }
  .scope-tag { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .baseline-text { font-size: 13.5px; }
  td button[data-reject] { display: block; margin-top: 6px; padding: 4px 10px; font-size: 13px; }
  @media (max-width: 700px) {
    .panel { padding: 12px; }
    .status .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .status .seg button { border-left: 0; border-top: 1px solid var(--rule); }
    .status .seg button:nth-child(-n+2) { border-top: 0; }
    .status .seg button:nth-child(even) { border-left: 1px solid var(--rule); }
    #reload { margin-left: 0 !important; }
    .bar select { min-width: 0; width: 100%; }
    .bar label.field { width: 100%; }
  }
</style>
</head>
<body>
<?!= include('Header') ?>
<header>
  <div class="title">
    <h1 id="title">Suivi</h1>
    <p class="context" id="context"></p>
  </div>
  <div class="controls">
    <select id="picker" aria-label="Projet"></select>
  </div>
</header>

<div class="status">
  <button type="button" class="icon-btn" id="reload" style="margin-left:auto" aria-label="Actualiser" title="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</div>

<div class="zone" id="zone-program" hidden><h2 class="sec">Vue programme : le suivi de tous les projets</h2></div>
<section class="panel" id="panel-program" aria-label="Vue programme" hidden></section>

<div class="zone" id="zone-ecarts"><h2 class="sec">Écarts à la baseline</h2></div>
<section class="panel" id="panel-ecarts" aria-label="Écarts à la baseline"></section>
<div class="zone" id="zone-changes"><h2 class="sec" id="tab-changes">Changements à valider</h2></div>
<section class="panel" id="panel-changes" aria-label="Changements à valider"></section>
<div class="zone" id="zone-baselines"><h2 class="sec">Baselines</h2></div>
<section class="panel" id="panel-baselines" aria-label="Baselines"></section>
<div class="zone" id="zone-workspace"><h2 class="sec">Agenda et Drive</h2></div>
<section class="panel" id="panel-workspace" aria-label="Agenda et Drive"></section>

<dialog id="form">
  <h2 id="form-title"></h2>
  <p id="form-text"></p>
  <label class="lbl"><span id="form-reason-label">Justification</span><textarea id="form-reason" maxlength="500"></textarea></label>
  <div class="actions">
    <button type="button" class="btn" id="form-cancel">Annuler</button>
    <button type="button" class="btn primary" id="form-ok">Valider</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
var BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';
  var el = ppm.el, clear = ppm.clear, uuid = ppm.uuid, plural = ppm.plural, toast = ppm.toast, call = ppm.call, frDate = ppm.frDate;

  var state = { tab: 'ecarts', projectId: '', catalog: null, list: null, diff: null, pick: 'to', compare: { base: '', to: '' },
    onlyChanges: true, feed: null, showAll: false, selected: {}, ws: null, wsReport: null, form: null, seq: 0, scope: null, ref: 'scope' };
  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------ outils
  function frDateTime(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return frDate(s);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function isoDate(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v)); }
  function days(n) {
    if (n === null || n === undefined) return '';
    if (n === 0) return '=';
    return (n > 0 ? '+' : '−') + plural(Math.abs(n), 'jour', 'jours');
  }
  function euros(n) {
    if (n === null || n === undefined) return '';
    return Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  }
  function loading(panel) { clear(panel); panel.appendChild(el('p', { class: 'loading', text: 'Chargement…' })); }
  function empty(panel, title, text, extra) {
    clear(panel);
    panel.appendChild(el('div', { class: 'empty' }, [el('strong', { text: title }), el('span', { text: text }), extra || null]));
  }
  function failed(panel, err) {
    empty(panel, 'Chargement impossible.', (err && err.message) || 'Erreur inconnue.');
  }
  function badge(text, cls) { return el('span', { class: 'badge ' + (cls || ''), text: text }); }
  function card(k, v, s, alert) {
    return el('div', { class: 'card' + (alert ? ' alert' : '') }, [el('p', { class: 'k', text: k }), el('p', { class: 'v', text: v }), s ? el('p', { class: 's', text: s }) : null]);
  }
  function table(head, rows) {
    return el('div', { class: 'table-wrap' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map(function (h) { return typeof h === 'string' ? el('th', { scope: 'col', text: h }) : h; }))]),
      el('tbody', {}, rows)
    ])]);
  }

  // ------------------------------------------------------------ navigation
  function remember() {
    var base = BOOT.baseUrl || '';
    $('nav-plan').setAttribute('href', base + '?view=gantt' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-struct').setAttribute('href', base + '?view=structure' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-suivi').setAttribute('href', base + '?view=suivi' + (state.projectId ? '&project=' + state.projectId : ''));
    $('nav-copilot').setAttribute('href', base + '?view=copilote' + (state.projectId ? '&project=' + state.projectId : ''));
    try { google.script.history.replace(null, { view: 'suivi', project: state.projectId }); } catch (e) { /* hors web app */ }
  }
  function fillPicker() {
    var sel = $('picker'); clear(sel);
    var cat = state.catalog, byProgram = {};
    cat.projects.forEach(function (p) { (byProgram[p.program_id || ''] = byProgram[p.program_id || ''] || []).push(p); });
    var sortCode = function (a, b) { return String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }); };
    var group = function (label, list) {
      if (!list || !list.length) return;
      var og = el('optgroup', { label: label });
      list.sort(sortCode).forEach(function (p) { og.appendChild(el('option', { value: p.id, text: p.code + ' ' + p.name + (p.status === 'Clos' ? ' (clos)' : '') })); });
      sel.appendChild(og);
    };
    cat.programs.slice().sort(sortCode).forEach(function (g) { group(g.code + ' ' + g.name, byProgram[g.id]); });
    group('Hors programme', byProgram['']);
    pv.fillOptions(sel, cat);
    sel.value = state.projectId;
  }
  /** Plus d'onglets : toutes les zones s'affichent ; celle des changements est réservée à ceux qui peuvent les lire. */
  function syncZones() {
    var show = !state.list || !!state.list.canReadFeed;
    $('zone-changes').hidden = !show; $('panel-changes').hidden = !show;
  }
  /** « Voir les écarts » d'une baseline : on règle la comparaison puis on va à la zone des écarts. */
  function showDiff() {
    var p = loadDiff();
    var z = $('zone-ecarts');
    if (z.scrollIntoView) z.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return p;
  }
  // ------------------------------------------------------------ chargement
  function loadProject(id) {
    state.projectId = id; state.selected = {}; state.compare = { base: '', to: '' }; state.wsReport = null; state.scope = null; state.ref = 'scope';
    $('picker').value = id;
    remember();
    var ticket = ++state.seq;
    ['ecarts', 'changes', 'baselines', 'workspace'].forEach(function (t) { loading($('panel-' + t)); });
    return call('baselines.list', { projectId: id }).then(function (l) {
      if (ticket !== state.seq) return;
      state.list = l;
      renderHeader();
      syncZones(); remember();
      if (l.canReadFeed) refreshPending();
      return loadAll();
    }).catch(function (e) { failed($('panel-ecarts'), e); toast(e.message || 'Erreur.', true); });
  }
  function reloadList() {
    return call('baselines.list', { projectId: state.projectId }).then(function (l) { state.list = l; renderHeader(); syncZones(); });
  }
  function loadAll() {
    if (!state.list) return Promise.resolve();
    renderBaselines();
    var jobs = [loadDiff(), loadWorkspace()];
    if (state.list.canReadFeed) jobs.push(loadFeed());
    return Promise.all(jobs);
  }
  // ------------------------------------------------------------ périmètres (0.15.5)
  /**
   * Une baseline porte sur un périmètre : le projet, un workpackage ou un sous-workpackage, jamais un livrable. Il y en a une active par périmètre, en parallèle : celle du projet
   * n'est jamais remplacée par celle d'un workpackage. Les écarts d'un workpackage se lisent contre sa baseline ou contre celle du projet.
   */
  function sameScope(b, s) { return b.scope_type === s.type && String(b.scope_id) === String(s.id); }
  function viewScope() { return state.scope || { type: 'project', id: state.list.project.id }; }
  function scopeInfo(s) { return (state.list.scopes || []).filter(function (x) { return x.type === s.type && String(x.id) === String(s.id); })[0] || null; }
  function scopeCan(b) { var s = scopeInfo({ type: b.scope_type, id: b.scope_id }); return !!(s && s.canCreate); }
  function indent(s) { return new Array(s.depth + 1).join('\u00a0\u00a0'); }
  function activeIn(scope) { return (state.list.baselines || []).filter(function (b) { return b.status === 'Active' && sameScope(b, scope); })[0] || null; }
  function activeBaseline() { return activeIn(viewScope()); }
  function projectBaseline() { return activeIn({ type: 'project', id: state.list.project.id }); }
  function pickScope(v) { var i = v.indexOf(':'); state.scope = { type: v.slice(0, i), id: v.slice(i + 1) }; state.compare = { base: '', to: '' }; state.ref = 'scope'; }
  // ------------------------------------------------------------ la carte des baselines
  /**
   * LA CARTE DES BASELINES (0.19.3) remplace le double menu « référence » / « périmètre ». Un arbre : une ligne par périmètre (le projet, ses workpackages, leurs sous-workpackages), et sur chaque ligne ses
   * baselines dans l'ordre où elles ont été figées, puis « Aujourd'hui » (l'état actuel de ce périmètre). On clique d'abord la baseline de RÉFÉRENCE, puis ce qui doit lui être comparé : une autre
   * baseline DU MÊME PÉRIMÈTRE, ou « Aujourd'hui ». Ce qui n'est pas comparable est grisé et dit pourquoi ; une phrase résume la comparaison. Seul cas entre deux périmètres : l'état d'aujourd'hui d'un
   * workpackage contre la baseline ACTIVE du projet (ses écarts à la référence du projet).
   */
  function frozenOf(scope) { return state.list.baselines.filter(function (b) { return (b.status === 'Active' || b.status === 'Archivée') && sameScope(b, scope); }).sort(function (a, b) { return (a.number || 0) - (b.number || 0); }); }
  function findBaseline(id) { return state.list.baselines.filter(function (b) { return b.id === id; })[0] || null; }
  function refBaseline() {
    var cur = viewScope(), vsProject = state.ref === 'project' && cur.type === 'workpackage';
    if (vsProject) return projectBaseline();
    return state.compare.base ? findBaseline(state.compare.base) : activeBaseline();
  }
  function toBaseline() { return state.compare.to ? findBaseline(state.compare.to) : null; }
  function chooseRef(b) { state.scope = { type: b.scope_type, id: b.scope_id }; state.ref = 'scope'; state.compare = { base: b.id, to: '' }; state.pick = 'to'; afterPick(); }
  function chooseTo(b) { state.compare.to = b.id; afterPick(); }
  function chooseNow(sc) {
    var a = refBaseline();
    if (a && sameScope(a, sc)) { state.compare.to = ''; state.ref = 'scope'; }
    else { state.scope = { type: sc.type, id: sc.id }; state.ref = 'project'; state.compare = { base: '', to: '' }; }
    afterPick();
  }
  function afterPick() { renderBaselines(); if (state.diffShown !== false) loadDiff(); }
  function baselineMap() {
    var l = state.list, cur = viewScope(), a = refBaseline(), b2 = toBaseline(), vsProject = state.ref === 'project' && cur.type === 'workpackage';
    var pb = projectBaseline(), pickRef = state.pick === 'ref' || !a;
    var box = el('div', { class: 'bmap', id: 'baseline-map', role: 'group', 'aria-label': 'Carte des baselines : choisissez la référence puis ce qu’on lui compare' });
    box.appendChild(el('p', { class: 'bm-help', id: 'bm-help', text: pickRef ? '1. Cliquez la baseline qui sert de RÉFÉRENCE.' : '2. Cliquez ce qu’on lui compare : une autre baseline du même périmètre, ou « Aujourd’hui ». Pour changer de référence : « Changer la référence ».' }));
    (l.scopes || []).forEach(function (sc) {
      var sameLaneAsA = a && sameScope(a, sc), isCur = sc.type === cur.type && String(sc.id) === String(cur.id);
      var chips = el('div', { class: 'bm-chips' });
      var frozen = frozenOf(sc);
      frozen.forEach(function (b, i) {
        var isA = a && a.id === b.id, isB = b2 && b2.id === b.id;
        var canClick = pickRef || (!sameLaneAsA ? true : !isA);   // hors de la voie de la référence : on repart de cette baseline ; dans sa voie : on la compare
        var why = '';
        var role = pickRef || !sameLaneAsA ? 'ref' : (isA ? 'is-a' : 'to');
        var chip = el('button', { type: 'button', class: 'bm-chip' + (b.status === 'Active' ? ' active' : ' archived') + (isA ? ' is-a' : '') + (isB ? ' is-b' : ''), 'data-baseline': b.id, 'data-role': role, 'aria-pressed': String(isA || isB),
          title: b.label + ' · ' + (b.status === 'Active' ? 'active' : 'archivée') + ' · figée le ' + frDate(b.decided_at) + ' par ' + b.decided_by + (b.validation === 'pending' ? ' · à valider par ' + (b.validators || []).join(', ') : ''),
          onclick: function () { if (pickRef || !sameLaneAsA) chooseRef(b); else if (!isA) chooseTo(b); } },
          [el('span', { class: 'bm-name', text: b.label }), el('small', { text: frDate(b.decided_at) }), isA ? el('em', { class: 'bm-tag', text: 'Référence' }) : isB ? el('em', { class: 'bm-tag', text: 'Comparée' }) : null, b.validation === 'pending' ? el('span', { class: 'bm-warn', title: 'À valider', 'aria-label': 'À valider', text: '⚠' }) : null]);
        if (i > 0) chips.appendChild(el('span', { class: 'bm-arrow', 'aria-hidden': 'true', text: '›' }));
        chips.appendChild(chip);
      });
      if (!frozen.length) chips.appendChild(el('span', { class: 'bm-none', text: 'aucune baseline' }));
      (l.baselines || []).filter(function (x) { return x.status === 'Demandée' && sameScope(x, sc); }).forEach(function (x) { chips.appendChild(el('span', { class: 'bm-chip request', title: 'Demande de ' + x.requested_by + ' en attente', text: 'demande' })); });
      // « Aujourd'hui » : comparable dans la voie de la référence, ou (workpackage) contre la baseline active du projet
      var nowOk = !pickRef && (sameLaneAsA || (sc.type === 'workpackage' && pb && a && a.id === pb.id));
      var isNow = !pickRef && ((sameLaneAsA && !b2) || (vsProject && isCur));
      var nowWhy = pickRef ? 'Choisissez d’abord la référence.' : (nowOk ? '' : 'Pas comparable : la référence est dans un autre périmètre (seul un workpackage se compare à la baseline active du projet).');
      if (frozen.length || nowOk) chips.appendChild(el('span', { class: 'bm-arrow', 'aria-hidden': 'true', text: '›' }));
      chips.appendChild(el('button', { type: 'button', class: 'bm-chip now' + (isNow ? ' is-b' : ''), 'data-now': sc.type + ':' + sc.id, 'aria-pressed': String(isNow), 'aria-disabled': String(!nowOk), title: nowOk ? 'L’état d’aujourd’hui de ce périmètre' + (sameLaneAsA ? '' : ' contre la baseline active du projet') : nowWhy,
        onclick: function () { if (nowOk) chooseNow(sc); } }, [el('span', { class: 'bm-name', text: 'Aujourd’hui' }), isNow ? el('em', { class: 'bm-tag', text: 'Comparé' }) : null]));
      box.appendChild(el('div', { class: 'bm-lane' + (sameLaneAsA ? ' lane-a' : ''), 'data-scope': sc.type + ':' + sc.id, style: '--depth:' + sc.depth }, [el('div', { class: 'bm-scope', text: sc.label }), chips]));
    });
    box.appendChild(el('div', { class: 'bm-sentence', id: 'bm-sentence', role: 'status', 'aria-live': 'polite' }, sentenceNodes(a, b2, vsProject, cur)));

          renderBaselines();
          showDiff();
        } }));
      }
      var who = b.status === 'Demandée' ? 'Demandée par ' + b.requested_by + ' le ' + frDate(b.created_at)
        : (b.decided_by ? (b.status === 'Refusée' ? 'Refusée' : 'Figée') + ' par ' + b.decided_by + ' le ' + frDate(b.decided_at) : '');
      return el('tr', { 'data-baseline': b.id }, [
        el('td', {}, [el('strong', { text: b.label || 'Demande' }), b.scope_type === 'workpackage' ? el('div', { class: 'scope-tag', text: b.scope_label }) : null, b.items ? el('div', { class: 'muted', text: plural(b.items, 'élément figé', 'éléments figés') }) : null]),
        el('td', {}, [badge(b.status, STATUS[b.status]), b.validation === 'pending' ? badge('À valider', 'pending') : b.validation === 'validated' ? badge('Validée', 'ok') : null,
          b.validation === 'pending' ? el('div', { class: 'who-pending', 'data-pending': 'baseline', text: 'À valider par : ' + b.validators.join(', ') }) : null,
          b.pending_changes && b.pending_changes.count ? el('div', { class: 'who-pending', 'data-pending': 'changes', text: plural(b.pending_changes.count, 'changement à valider', 'changements à valider') + ' par : ' + b.pending_changes.validators.join(', ') }) : null]),
        el('td', { text: b.justification }),
        el('td', { text: who }),
        el('td', {}, [actions])
      ]);
    });
    panel.appendChild(table(['Baseline', 'État', 'Justification', 'Décision', ''], rows));
  }

  // Boîte de saisie commune (figer, demander, refuser, réactiver).
  function openForm(opts) {
    state.form = opts;
    $('form-title').textContent = opts.title;
    $('form-text').textContent = opts.text || '';
    $('form-reason-label').textContent = opts.reasonLabel || 'Justification';
    $('form-reason').value = opts.reasonValue || '';
    $('form-ok').textContent = opts.ok || 'Valider';
    $('form-ok').disabled = false;
    var d = $('form');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
    $('form-reason').focus();
  }
  function closeForm() { state.form = null; var d = $('form'); if (d.open) { if (d.close) d.close(); else d.removeAttribute('open'); } }
  function submitForm() {
    var f = state.form;
    if (!f) return;
    var reason = $('form-reason').value.trim();
    if (!reason && !f.reasonOptional) { toast((f.reasonLabel || 'La justification') + ' est obligatoire.', true); $('form-reason').focus(); return; }
    $('form-ok').disabled = true;
    f.submit(reason).then(function (msg) {
      closeForm(); toast(msg);
      return reloadList().then(loadAll).then(function () { if (state.list.canReadFeed) refreshPending(); });
    }).catch(function (e) { $('form-ok').disabled = false; toast(e.message || 'Opération impossible.', true); });
  }
  /** Le nom d'une baseline se crée seul : code du projet, code du workpackage, code du sous-workpackage, numéro (0 pour la première). Même règle que le serveur (`baselineAutoLabel_`). */
  function nextLabel(scope) {
    var nums = state.list.baselines.filter(function (b) { return b.number !== null && (b.status === 'Active' || b.status === 'Archivée') && sameScope(b, scope); }).map(function (b) { return b.number; });
    var info = scopeInfo(scope);
    return (info && info.prefix ? info.prefix : state.list.project.code) + '_' + (nums.length ? Math.max.apply(null, nums) + 1 : 0);
  }
  function scopeParams(scope) { return scope.type === 'workpackage' ? { scopeType: 'workpackage', scopeId: scope.id } : {}; }
  function openCreate(request, scope) {
    scope = scope || { type: 'project', id: state.list.project.id };
    var label = nextLabel(scope), info = scopeInfo(scope), isWp = scope.type === 'workpackage';
    openForm({
      title: 'Figer la baseline ' + label + (isWp && info ? ' — ' + info.label : ''),
      text: request ? 'Demande de ' + request.requested_by + ' : « ' + request.justification + ' ». ' : '',
      reasonValue: request ? request.justification : '',
      ok: 'Figer ' + label,
      submit: function (reason) {
        var params = Object.assign({ projectId: state.projectId, justification: reason }, scopeParams(scope));
        if (request) { params.requestId = request.id; params.version = request.version; }
        return call('baselines.create', params, true).then(function (b) {
          state.scope = { type: b.scope_type, id: b.scope_id }; state.ref = 'scope'; state.compare = { base: '', to: '' };
          return 'Baseline ' + b.label + ' figée : ' + plural(b.items, 'élément', 'éléments') + '.' + (isWp ? ' Elle est à valider par le niveau du dessus.' : '');
        });
      }
    });
    $('form-text').textContent += isWp
      ? 'Les dates, responsables et budget actuels de ce périmètre (sous-workpackages compris) deviennent sa référence locale ; la baseline du projet n’est pas modifiée. Le niveau du dessus sera informé et pourra la valider ou la refuser.'
      : 'Les dates, responsables, budget et périmètre actuels deviennent la référence ; la baseline active actuelle sera archivée.';
  }
  function openRequest(scope) {
    scope = scope || { type: 'project', id: state.list.project.id };
    var info = scopeInfo(scope);
    openForm({ title: 'Demander une nouvelle baseline' + (scope.type === 'workpackage' && info ? ' — ' + info.label : ''),
      text: scope.type === 'workpackage' ? 'Le responsable de ce périmètre recevra votre demande et décidera de figer ou non une nouvelle référence.' : 'Le chef de projet recevra votre demande et décidera de figer ou non une nouvelle référence.',
      ok: 'Envoyer la demande', submit: function (reason) {
        return call('baselines.request', Object.assign({ projectId: state.projectId, justification: reason }, scopeParams(scope)), true).then(function () { return 'Demande envoyée.'; });
      } });
  }
  function openReject(e) {
    openForm({ title: 'Refuser la baseline', text: e.entity + ' — ' + e.new_value, reasonLabel: 'Motif du refus', ok: 'Refuser la baseline',
      submit: function (reason) { return call('changes.reject', { id: e.id, reason: reason }, true).then(function () { return 'Baseline refusée : la précédente redevient la référence de ce périmètre.'; }); } });
  }
  function openRefuse(b) {
    openForm({ title: 'Refuser la demande', text: 'Demande de ' + b.requested_by + ' : « ' + b.justification + ' ».', reasonLabel: 'Motif du refus', ok: 'Refuser',
      submit: function (reason) { return call('baselines.refuse', { id: b.id, reason: reason, version: b.version }, true).then(function () { return 'Demande refusée.'; }); } });
  }
  function openActivate(b) {
    openForm({ title: 'Réactiver ' + b.label, text: 'Elle redevient la référence des écarts ; la baseline active actuelle sera archivée.', reasonLabel: 'Motif', ok: 'Réactiver ' + b.label,
      submit: function (reason) { return call('baselines.activate', { id: b.id, reason: reason, version: b.version }, true).then(function () { return b.label + ' réactivée.'; }); } });
  }

  // ------------------------------------------------------------ agenda et Drive
  function loadWorkspace() {
    var panel = $('panel-workspace');
    loading(panel);
    return call('workspace.status', { projectId: state.projectId }).then(function (st) { state.ws = st; renderWorkspace(); }).catch(function (e) { failed(panel, e); });
  }
  function renderWorkspace() {
    var panel = $('panel-workspace'), st = state.ws;
    clear(panel);
    var box = el('div', { class: 'ws' });
    box.appendChild(el('div', { class: 'row' }, [
      el('div', {}, [el('strong', { text: 'Agenda du projet' }), el('span', { class: 'muted', text: st.calendar_id ? 'En service.' : 'Pas encore créé.' })]),
      st.calendar_url ? el('a', { class: 'btn', href: st.calendar_url, target: '_blank', rel: 'noopener', text: 'Ouvrir l’agenda' }) : null
    ]));
    box.appendChild(el('div', { class: 'row' }, [
      el('div', {}, [el('strong', { text: 'Dossier Drive du projet' }), el('span', { class: 'muted', text: st.drive_folder_id ? 'En service.' : 'Pas encore créé.' })]),
      st.drive_url ? el('a', { class: 'btn', href: st.drive_url, target: '_blank', rel: 'noopener', text: 'Ouvrir le dossier' }) : null
    ]));
    panel.appendChild(box);
    var bar = el('div', { class: 'bar', style: 'margin-top:16px' });
    if (st.canManage && st.available !== false) {
      if (!st.calendar_id || !st.drive_folder_id) bar.appendChild(el('button', { type: 'button', class: 'btn primary', id: 'ws-enable', text: 'Créer l’agenda et le dossier du projet', onclick: function () { runWorkspace('workspace.enable'); } }));
      else bar.appendChild(el('button', { type: 'button', class: 'btn', id: 'ws-sync', text: 'Synchroniser maintenant', onclick: function () { runWorkspace('workspace.sync'); } }));
    } else if (!st.canManage) {
      bar.appendChild(el('p', { class: 'note', text: 'Seuls le chef de projet, le DPL et le Program Leader activent l’agenda et le dossier.' }));
    }
    panel.appendChild(bar);
    if (state.wsReport) {
      var r = state.wsReport, lines = [];
      lines.push(plural(r.created, 'événement créé', 'événements créés') + ', ' + plural(r.updated, 'mis à jour', 'mis à jour') + ', ' + plural(r.removed, 'retiré', 'retirés') + '.');
      lines.push(plural(r.folders, 'dossier créé ou renommé', 'dossiers créés ou renommés') + '.');
      lines.push('Partagés avec les ' + plural(r.members || 0, 'membre', 'membres') + ' du projet' + (r.shared ? ' (' + plural(r.shared, 'nouvel accès', 'nouveaux accès') + ')' : '') + '.');
      var list = el('ul', { class: 'report', id: 'ws-report' }, lines.map(function (t) { return el('li', { text: t }); }));
      r.errors.forEach(function (e) { list.appendChild(el('li', { class: 'late', text: e })); });
      panel.appendChild(list);
    }
  }
  function runWorkspace(action) {
    var btn = $('ws-enable') || $('ws-sync');
    if (btn) btn.disabled = true;
    call(action, { projectId: state.projectId }, true).then(function (st) {
      state.wsReport = st.report;
      toast(action === 'workspace.enable' ? 'Agenda et dossier en service.' : 'Synchronisation terminée.');
      return loadWorkspace();
    }).catch(function (e) { if (btn) btn.disabled = false; toast(e.message || 'Opération impossible.', true); });
  }

  // ------------------------------------------------------------ événements
  // vue programme (PL et DPL) : baseline active, dérives, demandes et changements de chaque projet ; un clic ouvre le suivi du projet
  var pv = ppm.programView({
    hide: ['ecarts', 'changes', 'baselines', 'workspace'].reduce(function (a, z) { return a.concat(['zone-' + z, 'panel-' + z]); }, []),
    zone: 'zone-program', panel: 'panel-program', action: 'suivi.program',
    render: function (d, host) {
      var open = function (row) { pv.leave(); loadProject(row.id); };
      host.appendChild(el('p', { class: 'program-note', text: 'Programme ' + d.program.code + ' — ' + d.program.name + '. Les écarts sont ceux de la baseline active de chaque projet ; cliquez sur un projet pour le détail.' }));
      var jours = function (n) { return n ? '+' + n + (n > 1 ? ' jours' : ' jour') : '—'; };
      host.appendChild(ppm.table([
        { label: 'Projet', link: true, get: function (r) { return r.code + ' ' + r.name; } },
        { label: 'Baseline active', get: function (r) { return r.baseline || 'Aucune'; }, cls: function (r) { return r.baseline ? '' : 'warn'; }, total: function (t) { return t.without_baseline ? plural(t.without_baseline, 'projet sans baseline', 'projets sans baseline') : ''; } },
        { label: 'Éléments comparés', num: true, get: function (r) { return r.baseline ? String(r.compared) : '—'; }, total: function (t) { return String(t.compared); } },
        { label: 'En dérive', num: true, cls: function (r) { return r.slipped ? 'bad' : ''; }, get: function (r) { return r.baseline ? String(r.slipped) : '—'; }, total: function (t) { return String(t.slipped); } },
        { label: 'Pire glissement', num: true, cls: function (r) { return r.max_slip ? 'bad' : ''; }, get: function (r) { return r.baseline ? jours(r.max_slip) : '—'; }, total: function (t) { return jours(t.max_slip); } },
        { label: 'Fin du projet', get: function (r) { return r.baseline && r.end ? ppm.frDate(r.end) + (r.end_slip ? ' (' + jours(r.end_slip) + ')' : '') : '—'; }, cls: function (r) { return r.end_slip ? 'bad' : ''; } },
        { label: 'Changements à valider', num: true, cls: function (r) { return r.pending_changes ? 'warn' : ''; }, get: function (r) { return r.baseline ? String(r.pending_changes) : '—'; }, total: function (t) { return String(t.pending_changes); } },
        { label: 'Demandes de baseline', num: true, cls: function (r) { return r.requested ? 'warn' : ''; }, get: function (r) { return String(r.requested); }, total: function (t) { return String(t.requested); } }
      ], d.projects, { open: open, total: d.totals }));
    },
    onEnter: function (d) { $('title').textContent = 'Suivi — Programme ' + d.program.code; $('context').textContent = ''; try { google.script.history.replace(null, { view: 'suivi', program: d.program.id }); } catch (e) { /* hors web app */ } }
  });
  $('picker').addEventListener('change', function () { if (pv.isProgram(this.value)) pv.enter(this.value); else { pv.leave(); loadProject(this.value); } });
  $('reload').addEventListener('click', function () { loadProject(state.projectId); });
  $('form-ok').addEventListener('click', submitForm);
  $('form-cancel').addEventListener('click', closeForm);
  $('form').addEventListener('cancel', function (e) { e.preventDefault(); closeForm(); });

  // ------------------------------------------------------------ démarrage
  call('planning.catalog', {}).then(function (cat) {
    state.catalog = cat;
    var first = BOOT.project || (cat.projects.filter(function (p) { return p.status !== 'Clos'; })[0] || cat.projects[0] || {}).id;
    if (!first) { empty($('panel-ecarts'), 'Aucun projet pour l’instant.', 'Créez un projet dans l’application AppSheet, puis revenez ici.'); return; }
    state.projectId = first;
    fillPicker();
    return loadProject(first);
  }).catch(function (e) { failed($('panel-ecarts'), e); });

  window.__ppm = { state: state, loadProject: loadProject };
})();
</script>
</body>
</html>
